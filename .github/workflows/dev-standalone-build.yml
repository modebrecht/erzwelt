name: Dev standalone build

# Keeps the generated standalone entry in sync with dev sources.
on:
  push:
    branches:
      - dev
    paths:
      - "erzwelt-core.html"
      - "patches.json"
      - "*.js"
      - "scripts/build-standalone.mjs"
      - ".github/workflows/dev-standalone-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Build standalone
        run: node scripts/build-standalone.mjs

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: refresh dev standalone"
          git push origin HEAD:dev
