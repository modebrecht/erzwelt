name: Final Sek B text gate

on:
  push:
    branches:
      - didactic-complexity-sekb

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: didactic-complexity-sekb
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and standalone build
        run: |
          node --check didactic-complexity.js
          node --check didactic-global-text.js
          node scripts/build-standalone.mjs
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Browser assertions
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/erzwelt-http.log 2>&1 &
          sleep 1
          cat >/tmp/final-text-gate.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":360,"height":800})
              page.on("pageerror", lambda e: errors.append("page:"+str(e)))
              page.on("console", lambda m: errors.append("console:"+m.type+":"+m.text) if m.type=="error" else None)
              page.goto("http://127.0.0.1:8000/index.html", wait_until="networkidle", timeout=30000)
              page.wait_for_timeout(150)

              base=page.evaluate('''()=>({
                patches:document.querySelectorAll('script[data-erzwelt-patch]').length,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                marker:window.__erzweltGlobalTextAudit,
                difficulty:document.getElementById('d-text')?.innerText||'',
                difficultyOptions:document.getElementById('d-wahlen')?.innerText||'',
                tutorial:TUTORIAL.map(t=>t.text)
              })''')
              assert base['patches']==24, base
              assert base['overflow']<=0, base['overflow']
              assert base['marker']['version']==2 and base['marker']['target']=='Sek B', base['marker']
              assert base['difficulty']=='Die Schwierigkeit verändert nur den Verkaufserlös. Schwer wird nach einer erfolgreichen Mittel-Etappe frei.', base['difficulty']
              assert 'Standard-Balancing' not in base['difficultyOptions']
              assert all(len(x)<=180 for x in base['tutorial'])

              surfaces=page.evaluate('''()=>{
                const strip=html=>{const d=document.createElement('div');d.innerHTML=html||'';return (d.innerText||d.textContent||'').replace(/\\n{3,}/g,'\\n\\n').trim();};
                S.schwierigkeit='einfach'; S.kasse=2500000; S.arbeiterGesamt=100; S.tutorial=TUTORIAL.length; modalOffen=false;
                document.getElementById('schleier').hidden=true;
                S.minen={kolwezi:{arbeiter:10,stufe:1,zufriedenheit:62,stillBis:0,malus:1,malusBis:0,ausbau:1,sicherheit:true,nachweis:true},bangka:{arbeiter:25,stufe:1,zufriedenheit:60,stillBis:0,malus:1,malusBis:0,ausbau:0,sicherheit:false,nachweis:true}};
                S.raff={r_china:{arbeiter:10,ausbau:1}};
                S.fabriken=[{produkt:'kabel',land:'deutschland',arbeiter:10,restbau:0}];
                S.erz={kupfer:120,zinn:80,alu:90}; S.mat={kupfer:70,zinn:40,alu:60}; S.ware={kabel:25}; S.verkaeufer=3;
                S.eingenommen=500000; S.ausgegeben=250000; S.etappeStartEingenommen=0; S.etappeStartAusgegeben=0; S.ruf=62; S.tag=220;
                if(typeof didaktikMigration==='function') didaktikMigration();
                const out={
                  market:strip(seiteMarkt()),
                  team:strip(seiteTeam()),
                  goal:strip(seiteZiel()),
                  knowledge:strip(seiteWissen()),
                  refinery:strip(blattRaff('r_china')),
                  factory:strip(blattFab('deutschland'))
                };
                einstFuellen(); out.settings=document.getElementById('einstinhalt')?.innerText||''; document.getElementById('einst').hidden=true;
                const taiwan=EREIGNISSE.find(x=>x.id==='taiwan').bau();
                const law=EREIGNISSE.find(x=>x.id==='lieferkettengesetz').bau();
                const accident=EREIGNISSE.find(x=>x.id==='unglueck').bau();
                out.events={taiwan:strip(taiwan.text),law:strip(law.text),accidentOptions:(accident.wahlen||[]).map(w=>`${w.text} — ${w.klein}`)};
                S.ende=null;S.tag=ZIEL_TAGE+1;S.eingenommen=ZIEL_GEWINN+1000000;S.ausgegeben=0;S.etappe=1;S.etappeStartEingenommen=0;S.etappeStartAusgegeben=0;S.ruf=70;modalOffen=false;
                rundeBeenden('etappe');
                out.stage={text:document.getElementById('d-text')?.innerText||'',options:document.getElementById('d-wahlen')?.innerText||''};
                return out;
              }''')

              assert 'Fertige Fertige' not in surfaces['market']
              assert 'Selbst verkaufen: einmal pro Tag. Das Verkaufsteam verkauft automatisch.' in surfaces['market']
              assert 'Weltmarktpreise für Rohstoffe werden nicht berechnet.' in surfaces['market']
              assert 'Ohne Personal stehen Rohstoffquellen und Fabriken still.' in surfaces['team']
              assert 'Spielmodell: Löhne sind vereinfachte Spielwerte.' in surfaces['team']
              assert 'Nach 720 Tagen wird abgerechnet. Danach kannst du weiterspielen.' in surfaces['goal']
              assert 'Niedriger Ruf senkt die Nachfrage.' in surfaces['goal']
              assert 'Wissen kostet nichts. Geld brauchst du nur für Verbesserungen.' in surfaces['knowledge']
              assert 'Jede Stufe bringt +5 %. Jede zehnte Stufe verdoppelt die Leistung.' in surfaces['refinery']
              assert 'Andere Rohstoffe werden normal verarbeitet.' in surfaces['refinery']
              assert 'keine echten Stücklisten' in surfaces['factory']
              assert 'Ändert die Grösse aller Texte.' in surfaces['settings']
              assert 'Ändert die Dauer eines Spieltags.' in surfaces['settings']
              assert 'andere Firmen können weniger Elektronik liefern.' in surfaces['events']['taiwan']
              assert 'Grosskunden können bestellen' in surfaces['events']['law']
              assert any(x.startswith('Sicherheit verbessern —') for x in surfaces['events']['accidentOptions'])
              assert 'Ziel erreicht. Du kannst mit derselben Firma weiterspielen.' in surfaces['stage']['text']
              assert 'Gleiche Firma · weitere 720 Tage' in surfaces['stage']['options']
              assert not errors, errors

              print(json.dumps({"base":base,"checked":"difficulty, market, team, goal, knowledge, refinery, factory, settings, events, stage"},ensure_ascii=False,indent=2))
              print('FINAL SEK B TEXT GATE PASS')
              browser.close()
          PY
          python /tmp/final-text-gate.py

      - name: Publish verified standalone and remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/global-text-audit.yml
          git commit -m "build: publish verified global Sek B text pass"
          git push origin HEAD:didactic-complexity-sekb
