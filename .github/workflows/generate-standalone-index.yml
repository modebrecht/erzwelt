name: Generate standalone index

on:
  push:
    branches:
      - standalone-final-release

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: standalone-final-release
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate standalone index
        run: node scripts/build-standalone.mjs
      - name: Commit generated index
        run: |
          test -s index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Standalone index already current.'
            exit 0
          fi
          git commit -m 'build: regenerate standalone index'
          git push origin HEAD:standalone-final-release
