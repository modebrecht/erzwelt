name: Easy fail bonus smoke

on:
  push:
    branches:
      - easy-fail-bonus-pass

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: easy-fail-bonus-pass
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply core bonus change and build standalone
        run: |
          test "$(git hash-object erzwelt-core.html)" = "1eab52af4a1a21705b79acd4f5da61307ba21d08"
          git apply --check scripts/easy-fail-bonus.patch
          git apply scripts/easy-fail-bonus.patch
          test "$(git hash-object erzwelt-core.html)" = "ffbb1b7d6e04db585312c073cdc178ab71d85364"
          node scripts/build-standalone.mjs
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Serve exact standalone
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/erzwelt-http.log 2>&1 &
          echo $! >/tmp/erzwelt-http.pid
          sleep 1

      - name: Smoke conditional assistance bonus
        run: |
          cat >/tmp/easy-fail-bonus-smoke.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json, math

          errors=[]
          out={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":360,"height":800})
              page.on("pageerror", lambda e: errors.append("page:"+str(e)))
              page.on("console", lambda m: errors.append("console:"+m.type+":"+m.text) if m.type=="error" else None)
              page.goto("http://127.0.0.1:8000/index.html", wait_until="networkidle", timeout=30000)
              page.wait_for_timeout(200)

              out["patches"]=page.locator('script[data-erzwelt-patch]').count()
              out["overflow"]=page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')
              page.locator('#d-wahlen .wahl').nth(0).click()  # Einfach
              page.wait_for_timeout(80)

              # Easy failed: bonus choice must exist exactly once.
              page.evaluate('''()=>{tempoSetzen(1);S.schwierigkeit='einfach';S.hilfsBonus=false;S.etappe=1;S.etappeStartEingenommen=0;S.etappeStartAusgegeben=0;S.eingenommen=100000;S.ausgegeben=0;S.ruf=70;S.tag=721;S.ende=null;rundeBeenden('etappe');}''')
              page.wait_for_timeout(50)
              labels=[page.locator('#d-wahlen .wahl').nth(i).inner_text() for i in range(page.locator('#d-wahlen .wahl').count())]
              out["easy_failed"]={"count":len(labels),"labels":labels,"bonus":sum('Weiter mit Bonus' in x for x in labels)}

              # Activate bonus; same run/day continues, total sale multiplier is 1.50.
              page.get_by_text('Weiter mit Bonus', exact=False).click()
              page.wait_for_timeout(80)
              out["after_bonus"]=page.evaluate('({tag:S.tag,etappe:S.etappe,bonus:S.hilfsBonus,tempo,mult:verkaufsMultiplikator()})')
              page.evaluate("seiteWechseln('ziel')")
              page.wait_for_timeout(50)
              out["ziel_bonus"]='Bonus aktiv' in page.locator('#seite').inner_text() and '+50 %' in page.locator('#seite').inner_text()
              page.evaluate("seiteWechseln('karte')")

              # Bonus persists across save/reload.
              page.evaluate('speichern()')
              page.reload(wait_until='networkidle')
              page.wait_for_timeout(150)
              out["reload_bonus"]=page.evaluate('({bonus:S.hilfsBonus,mult:verkaufsMultiplikator(),schwierigkeit:S.schwierigkeit,etappe:S.etappe})')

              # Once bonus is active, another failed Easy stage must NOT offer it again.
              page.evaluate('''()=>{tempoSetzen(0);S.ende=null;S.etappe=2;S.etappeStartEingenommen=S.eingenommen;S.etappeStartAusgegeben=S.ausgegeben;S.eingenommen+=1000;S.ruf=70;S.tag=1441;rundeBeenden('etappe');}''')
              page.wait_for_timeout(50)
              labels=[page.locator('#d-wahlen .wahl').nth(i).inner_text() for i in range(page.locator('#d-wahlen .wahl').count())]
              out["easy_failed_bonus_active"]={"count":len(labels),"bonus":sum('Weiter mit Bonus' in x for x in labels)}

              # Fresh Easy success: no bonus option.
              page.evaluate('''()=>{S=newZ=neuerZustand();S.schwierigkeit='einfach';S.hilfsBonus=false;S.eingenommen=6000000;S.ausgegeben=0;S.ruf=70;S.tag=721;modalOffen=false;rundeBeenden('etappe');}''')
              page.wait_for_timeout(50)
              labels=[page.locator('#d-wahlen .wahl').nth(i).inner_text() for i in range(page.locator('#d-wahlen .wahl').count())]
              out["easy_success"]={"count":len(labels),"bonus":sum('Weiter mit Bonus' in x for x in labels)}

              # Easy failed only because of reputation: still failed, so bonus must appear.
              page.evaluate('''()=>{S=neuerZustand();S.schwierigkeit='einfach';S.hilfsBonus=false;S.eingenommen=6000000;S.ausgegeben=0;S.ruf=40;S.tag=721;modalOffen=false;rundeBeenden('etappe');}''')
              page.wait_for_timeout(50)
              labels=[page.locator('#d-wahlen .wahl').nth(i).inner_text() for i in range(page.locator('#d-wahlen .wahl').count())]
              out["easy_ruf_failed"]={"count":len(labels),"bonus":sum('Weiter mit Bonus' in x for x in labels)}

              # Medium failed: no bonus option.
              page.evaluate('''()=>{S=neuerZustand();S.schwierigkeit='mittel';S.eingenommen=100000;S.ausgegeben=0;S.ruf=70;S.tag=721;modalOffen=false;rundeBeenden('etappe');}''')
              page.wait_for_timeout(50)
              labels=[page.locator('#d-wahlen .wahl').nth(i).inner_text() for i in range(page.locator('#d-wahlen .wahl').count())]
              out["medium_failed"]={"count":len(labels),"bonus":sum('Weiter mit Bonus' in x for x in labels)}

              # Hard failed: no bonus option.
              page.evaluate('''()=>{S=neuerZustand();S.schwierigkeit='schwer';S.eingenommen=100000;S.ausgegeben=0;S.ruf=70;S.tag=721;modalOffen=false;rundeBeenden('etappe');}''')
              page.wait_for_timeout(50)
              labels=[page.locator('#d-wahlen .wahl').nth(i).inner_text() for i in range(page.locator('#d-wahlen .wahl').count())]
              out["hard_failed"]={"count":len(labels),"bonus":sum('Weiter mit Bonus' in x for x in labels)}

              # Insolvency is terminal: only New Round, never bonus.
              page.evaluate('''()=>{S=neuerZustand();S.schwierigkeit='einfach';S.kasse=-900001;S.tag=300;modalOffen=false;rundeBeenden('insolvenz');}''')
              page.wait_for_timeout(50)
              labels=[page.locator('#d-wahlen .wahl').nth(i).inner_text() for i in range(page.locator('#d-wahlen .wahl').count())]
              out["insolvency"]={"count":len(labels),"bonus":sum('Weiter mit Bonus' in x for x in labels)}

              # Legacy state without bonus field defaults safely to false.
              page.evaluate('''()=>{const old=neuerZustand();old.schwierigkeit='einfach';delete old.hilfsBonus;localStorage.setItem('erzwelt_v2',JSON.stringify(old));speichern=()=>{};}''')
              page.reload(wait_until='networkidle')
              page.wait_for_timeout(120)
              out["legacy_bonus_default"]=page.evaluate('S.hilfsBonus')

              browser.close()

          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('ERRORS',json.dumps(errors,ensure_ascii=False,indent=2))
          assert out['patches']==22 and out['overflow']<=0
          assert out['easy_failed']['count']==3 and out['easy_failed']['bonus']==1
          assert out['after_bonus']['tag']==721 and out['after_bonus']['etappe']==2 and out['after_bonus']['bonus'] and math.isclose(out['after_bonus']['mult'],1.5)
          assert out['ziel_bonus']
          assert out['reload_bonus']=={'bonus':True,'mult':1.5,'schwierigkeit':'einfach','etappe':2}
          assert out['easy_failed_bonus_active']=={'count':2,'bonus':0}
          assert out['easy_success']=={'count':2,'bonus':0}
          assert out['easy_ruf_failed']=={'count':3,'bonus':1}
          assert out['medium_failed']=={'count':2,'bonus':0}
          assert out['hard_failed']=={'count':2,'bonus':0}
          assert out['insolvency']=={'count':1,'bonus':0}
          assert out['legacy_bonus_default'] is False
          assert not errors, errors
          print('EASY FAIL BONUS EXACT PACKED SMOKE PASS')
          PY
          python /tmp/easy-fail-bonus-smoke.py

      - name: Commit product change and remove helper files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/easy-fail-bonus.patch .github/workflows/easy-fail-bonus-smoke.yml
          git add erzwelt-core.html index.html
          git commit -m "feat: offer assistance bonus after failed easy stage"
          git push origin HEAD:easy-fail-bonus-pass
