name: Dev E2E audit Windows

on:
  push:
    branches: [dev]
    paths:
      - "tests/e2e/**"
      - ".github/workflows/dev-e2e-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Playwright
        shell: pwsh
        run: |
          npm init -y | Out-Null
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Serve standalone
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList '-m','http.server','4173','--bind','127.0.0.1' -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:4173/index.html' -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) { throw 'Local Erzwelt server did not become ready' }

      - name: Harden standalone readiness and animated UI in test copy
        shell: pwsh
        run: |
          $p = 'tests/e2e/gameplay.mjs'
          $raw = Get-Content $p -Raw
          $ready = "await page.waitForFunction(() => !!window.__erzweltDidacticComplexity && !!window.__erzweltKnowledgeQuestFlow && !!window.__erzweltObjectiveGuide && !!document.querySelector('#quest'), null, { timeout: 15000 });`nawait page.addStyleTag({ content: '*,*::before,*::after{animation:none!important;transition:none!important}' });"
          $raw = $raw.Replace("await page.waitForTimeout(1000);", $ready)
          $raw = $raw.Replace("await page.waitForTimeout(800);", "await page.waitForFunction(() => !!window.__erzweltKnowledgeQuestFlow && !!document.querySelector('#quest'), null, { timeout: 15000 });")
          $raw = $raw.Replace("await loc.first().click();", "await loc.first().evaluate(el => el.click());")
          $raw = $raw.Replace(".click({ force: true });", ".evaluate(el => el.click());")
          $raw = $raw.Replace('page.locator(`button[data-tun="crew"][data-id="${id}"][data-n="10"]:not([disabled]), button[data-tun="crew"][data-id="${id}"][data-n="1"]:not([disabled])`).first()', 'page.locator(`button[data-tun="crew"][data-id="${id}"][data-n="10"]:not([disabled])`).first()')
          $raw = $raw.Replace("await setTempo(4);", "await goMap();`nawait setTempo(4);")
          $raw = $raw.Replace("await collectKnowledge('lohn');", "await goMap();`nawait collectKnowledge('lohn');")
          $raw = $raw.Replace("await collectKnowledge('geologie');", "await goMap();`nawait collectKnowledge('geologie');")
          Set-Content -Path $p -Value $raw -Encoding utf8

      - name: Run full gameplay E2E
        shell: pwsh
        run: node tests/e2e/gameplay.mjs

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erzwelt-e2e-windows
          path: artifacts/
          if-no-files-found: warn

# Triggered after rebuilding the geology click fix into the dev standalone.
