name: Objective visual final

on:
  push:
    branches: [didactic-complexity-sekb]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: didactic-complexity-sekb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          node --check objective-guide.js
          node scripts/build-standalone.mjs
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Browser visual gate
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 1
          cat >/tmp/final.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          out=Path('visual-final');out.mkdir(exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':360,'height':800})
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:8000/index.html',wait_until='networkidle')
              page.evaluate("()=>{document.getElementById('schleier').style.display='none';}")
              page.wait_for_timeout(100)
              # tutorial
              t=page.evaluate('''()=>{const q=document.getElementById('quest'),g=q.querySelector('.objective-guide-action');const r=g.getBoundingClientRect();return {guide:g.innerText,w:r.width,h:r.height,overflow:document.documentElement.scrollWidth>innerWidth}}''')
              assert t['guide']=='Ziel zeigen' and t['h']>=40 and not t['overflow'],t
              page.screenshot(path=str(out/'01-tutorial.png'))
              # prepare post tutorial and collect basis
              page.evaluate('''()=>{S.tutorial=TUTORIAL.length;S.kasse=3000000;S.arbeiterGesamt=100;S.minen={kolwezi:{arbeiter:10,stufe:1,zufriedenheit:60,stillBis:0,malus:1,malusBis:0,ausbau:0,sicherheit:false,nachweis:false}};S.raff={r_china:{arbeiter:10,ausbau:0}};S.fabriken=[{produkt:'kabel',land:'deutschland',arbeiter:10,restbau:0}];S.erz={kupfer:50,alu:50,zinn:50};S.mat={kupfer:50,alu:50,zinn:50};S.ware={kabel:20};S.verkaeufer=2;S.handverkaufTag=-1;delete S.wissenQuestFlow;aktiveSeite='karte';offenesBlatt=null;offeneLupe=null;document.getElementById('seite').hidden=true;document.getElementById('blatt').hidden=true;document.getElementById('lupe').hidden=true;questZeichnen();}''')
              page.click('[data-wissen-quest="basis"]',force=True)
              page.evaluate("()=>{document.getElementById('lupe').hidden=true;offeneLupe=null;seiteWechseln('karte');questZeichnen();}")
              page.wait_for_timeout(80)
              k=page.evaluate('''()=>{const q=document.getElementById('quest'),g=q.querySelector('.objective-guide-action');const qr=q.getBoundingClientRect(),gr=g.getBoundingClientRect();return {qw:qr.width,qh:qr.height,gw:gr.width,gh:gr.height,text:g.innerText,lines:Math.round(gr.height/parseFloat(getComputedStyle(g).lineHeight||'16')),overflow:document.documentElement.scrollWidth>innerWidth}}''')
              assert k['qw']>=220,k
              assert k['text']=='Ziel zeigen' and k['gh']>=40 and k['gh']<=50,k
              assert not k['overflow'],k
              page.screenshot(path=str(out/'02-knowledge-lohn.png'))
              # ready state
              page.evaluate("()=>{S.wissenQuestFlow.flags.lohn=true;questZeichnen();}")
              page.wait_for_timeout(80)
              ready=page.evaluate('''()=>({guide:!!document.querySelector('.objective-guide-action'),view:document.querySelector('.wissen-quest-action')?.innerText||'',qw:document.getElementById('quest').getBoundingClientRect().width})''')
              assert not ready['guide'] and ready['view']=='Ansehen' and ready['qw']>=220,ready
              page.screenshot(path=str(out/'03-ready.png'))
              assert not errors,errors
              print({'tutorial':t,'knowledge':k,'ready':ready})
              b.close()
          PY
          python /tmp/final.py
      - uses: actions/upload-artifact@v4
        with:
          name: objective-visual-final
          path: visual-final/
      - name: Publish verified build and remove QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/objective-visual-final.yml
          git commit -m "build: publish verified objective visibility pass"
          git push origin HEAD:didactic-complexity-sekb
