name: One-time dev standalone refresh

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/dev-standalone-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Build standalone
        run: node scripts/build-standalone.mjs

      - name: Commit refreshed index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "build: refresh dev standalone after final copy cleanup"
          git push origin HEAD:dev
