name: One-time dev visual polish

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/dev-polish-fix.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply source-owned polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lang = Path('language-pass.js')
          text = lang.read_text(encoding='utf-8')
          old = '''    ["Ware verkauft sich nicht von allein", "Fertige Produkte müssen verkauft werden"],
    ["Fertige Ware verkauft sich nicht von allein", "Fertige Produkte müssen verkauft werden"],'''
          new = '''    ["Fertige Ware verkauft sich nicht von allein", "Fertige Produkte müssen verkauft werden"],
    ["Ware verkauft sich nicht von allein", "Fertige Produkte müssen verkauft werden"],'''
          if old not in text:
              raise SystemExit('Expected market language rules not found')
          lang.write_text(text.replace(old, new, 1), encoding='utf-8')

          transport = Path('didactic-transport.js')
          text = transport.read_text(encoding='utf-8')
          anchor = '''let transportRouteCache="";
let transportReducedCache=null;
'''
          insert = '''let transportRouteCache="";
let transportReducedCache=null;

/* Mobile: the route note already contains the transport sequence. Keep one
   readable explanation and move it above the map controls instead of stacking
   three overlays on the same bottom edge. */
const transportMobileStyle=document.createElement("style");
transportMobileStyle.id="didaktik-transport-mobile-style";
transportMobileStyle.textContent=`@media(max-width:560px){
  #didaktik-route-note{bottom:calc(var(--dockh) + 92px)!important;max-width:calc(100vw - 20px)!important}
  #didaktik-transport-legende{display:none!important}
}`;
document.head.appendChild(transportMobileStyle);
'''
          if anchor not in text:
              raise SystemExit('Expected transport cache anchor not found')
          transport.write_text(text.replace(anchor, insert, 1), encoding='utf-8')
          PY

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add language-pass.js didactic-transport.js
          git diff --cached --check
          git commit -m "fix: polish mobile transport and market copy"
          git push origin HEAD:dev
