name: Knowledge quest flow QA v2

on:
  push:
    branches:
      - didactic-complexity-sekb

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: didactic-complexity-sekb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          node --check knowledge-quest-flow.js
          node scripts/build-standalone.mjs
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Full browser flow
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 1
          cat >/tmp/qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":360,"height":800})
              page.on("pageerror", lambda e: errors.append("page:"+str(e)))
              page.on("console", lambda m: errors.append("console:"+m.type+":"+m.text) if m.type=="error" else None)
              page.goto("http://127.0.0.1:8000/index.html", wait_until="networkidle")
              page.wait_for_timeout(100)

              initial=page.evaluate('''()=>({
                patches:document.querySelectorAll('script[data-erzwelt-patch]').length,
                marker:window.__erzweltKnowledgeQuestFlow,
                tutorial:tutorialLaeuft(),
                knowledgeClass:document.getElementById('quest').classList.contains('wissen-quest'),
                art:document.getElementById('q-art').innerText
              })''')
              assert initial['patches']==25, initial
              assert initial['marker']['quests']==['basis','lohn','markt','geologie','ruf','modell'], initial
              if initial['tutorial']:
                  assert not initial['knowledgeClass'], initial
                  assert initial['art'].lower().startswith('aufgabe'), initial

              # Realistic state immediately after a completed tutorial.
              page.evaluate('''()=>{
                localStorage.clear();
                S.schwierigkeit='einfach';
                S.tutorial=TUTORIAL.length;
                S.kasse=3000000;
                S.arbeiterGesamt=100;
                S.minen={kolwezi:{arbeiter:10,stufe:1,zufriedenheit:60,stillBis:0,malus:1,malusBis:0,ausbau:0,sicherheit:false,nachweis:false}};
                S.raff={r_china:{arbeiter:10,ausbau:0}};
                S.fabriken=[{produkt:'kabel',land:'deutschland',arbeiter:10,restbau:0}];
                S.erz={kupfer:50,alu:50,zinn:50};
                S.mat={kupfer:50,alu:50,zinn:50};
                S.ware={kabel:20};
                S.verkaeufer=2;
                S.handverkaufTag=-1;
                delete S.wissenQuestFlow;
                aktiveSeite='karte';offenesBlatt=null;offeneLupe=null;modalOffen=false;
                document.getElementById('schleier').hidden=true;
                document.getElementById('seite').hidden=true;
                document.getElementById('blatt').hidden=true;
                document.getElementById('lupe').hidden=true;
                questZeichnen();
              }''')

              def snap():
                  return page.evaluate('''()=>({
                    art:document.getElementById('q-art').innerText.toLowerCase(),
                    title:document.getElementById('q-titel').innerText,
                    text:document.getElementById('q-text').innerText,
                    buttons:[...document.querySelectorAll('[data-wissen-quest]')].map(x=>x.dataset.wissenQuest),
                    state:JSON.parse(JSON.stringify(S.wissenQuestFlow))
                  })''')

              s=snap()
              assert s['art']=='wissen freigeschaltet' and s['title']=='Deine Lieferkette steht', s
              assert s['buttons']==['basis'] and s['state']['startMinen']==1, s
              page.evaluate("()=>document.querySelector('[data-wissen-quest=\"basis\"]').click()")
              page.wait_for_timeout(30)
              assert page.evaluate("()=>S.wissenQuestFlow.collected.basis===true")
              assert page.evaluate("()=>['kette','chemie','fabrik'].every(x=>S.wissenQuestFlow.fields[x])")
              assert page.evaluate("()=>wissenPraxis('kette',0).ok && wissenPraxis('chemie',1).ok && wissenPraxis('fabrik',1).ok")

              def back_to_map():
                  page.evaluate('''()=>{
                    document.getElementById('lupe').hidden=true;offeneLupe=null;
                    seiteWechseln('karte');questZeichnen();
                  }''')
                  page.wait_for_timeout(20)

              back_to_map()
              s=snap(); assert s['art']=='wissens-quest 2/6' and s['title']=='Lohn & Zufriedenheit beobachten' and not s['buttons'], s
              assert not page.evaluate("()=>wissenPraxis('leute',0).ok")

              # Same wage level does not count.
              page.evaluate('''()=>{
                const h=document.createElement('div');h.innerHTML=blattMine('kolwezi');document.body.appendChild(h);
                h.querySelector('[data-tun="lohn"][data-stufe="1"]').click();h.remove();
              }''')
              assert not page.evaluate("()=>!!S.wissenQuestFlow.flags.lohn")
              # A genuine wage change does count.
              page.evaluate('''()=>{
                const h=document.createElement('div');h.innerHTML=blattMine('kolwezi');document.body.appendChild(h);
                h.querySelector('[data-tun="lohn"][data-stufe="2"]').click();h.remove();questZeichnen();
              }''')
              s=snap(); assert s['art']=='wissen freigeschaltet' and s['buttons']==['lohn'], s
              page.evaluate("()=>document.querySelector('[data-wissen-quest=\"lohn\"]').click()")
              assert page.evaluate("()=>wissenPraxis('leute',1).ok")

              back_to_map()
              page.evaluate("()=>{S.ware.kabel=20;S.handverkaufTag=-1;questZeichnen();}")
              s=snap(); assert s['art']=='wissens-quest 3/6' and s['title']=='Markt selbst ausprobieren', s
              page.evaluate('''()=>{
                const h=document.createElement('div');h.innerHTML=seiteMarkt();document.body.appendChild(h);
                h.querySelector('[data-tun="handverkauf"]').click();h.remove();questZeichnen();
              }''')
              s=snap(); assert s['art']=='wissen freigeschaltet' and s['buttons']==['markt'], s
              page.evaluate("()=>document.querySelector('[data-wissen-quest=\"markt\"]').click()")
              assert page.evaluate("()=>wissenPraxis('markt',1).ok")

              back_to_map()
              s=snap(); assert s['art']=='wissens-quest 4/6' and s['title']=='Einen neuen Rohstoffstandort vergleichen', s
              before=page.evaluate("()=>offeneMinen().length")
              page.evaluate('''()=>{
                const h=document.createElement('div');h.innerHTML=blattMine('bangka');document.body.appendChild(h);
                const b=h.querySelector('[data-tun="mine-auf"]');if(!b) throw new Error('Bangka open button missing');b.click();h.remove();questZeichnen();
              }''')
              after=page.evaluate("()=>offeneMinen().length")
              assert after==before+1, (before,after)
              s=snap(); assert s['art']=='wissen freigeschaltet' and s['buttons']==['geologie'], s
              page.evaluate("()=>document.querySelector('[data-wissen-quest=\"geologie\"]').click()")
              assert page.evaluate("()=>wissenPraxis('geologie',1).ok")

              back_to_map()
              s=snap(); assert s['art']=='wissens-quest 5/6' and s['title']=='Ruf und Nachweise unterscheiden', s
              page.evaluate('''()=>{
                const b=document.createElement('button');b.dataset.seite='ziel';document.body.appendChild(b);b.click();b.remove();questZeichnen();
              }''')
              s=snap(); assert s['art']=='wissen freigeschaltet' and s['buttons']==['ruf'], s
              page.evaluate("()=>document.querySelector('[data-wissen-quest=\"ruf\"]').click()")
              assert page.evaluate("()=>wissenPraxis('ruf',1).ok")

              back_to_map()
              s=snap(); assert s['art']=='wissen freigeschaltet' and s['title']=='Das Spielmodell einordnen' and s['buttons']==['modell'], s
              page.evaluate("()=>document.querySelector('[data-wissen-quest=\"modell\"]').click()")
              page.wait_for_timeout(30)
              done=page.evaluate('''()=>({
                count:Object.values(S.wissenQuestFlow.collected).filter(Boolean).length,
                model:wissenPraxis('modell',1).ok,
                fields:Object.keys(S.wissenQuestFlow.fields).filter(k=>S.wissenQuestFlow.fields[k]).sort()
              })''')
              assert done['count']==6 and done['model'], done
              assert done['fields']==sorted(['kette','chemie','fabrik','leute','markt','geologie','ruf','modell']), done
              assert not errors, errors
              print(json.dumps({'initial':initial,'done':done},ensure_ascii=False,indent=2))
              print('KNOWLEDGE QUEST FLOW QA V2 PASS')
              browser.close()
          PY
          python /tmp/qa.py
      - name: Publish and clean QA workflows
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/knowledge-quest-qa.yml .github/workflows/knowledge-quest-qa-v2.yml
          git commit -m "build: publish verified knowledge quest flow"
          git push origin HEAD:didactic-complexity-sekb
