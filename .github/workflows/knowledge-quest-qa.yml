name: Knowledge quest flow QA

on:
  push:
    branches:
      - didactic-complexity-sekb

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: didactic-complexity-sekb
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and standalone build
        run: |
          node --check knowledge-quest-flow.js
          node scripts/build-standalone.mjs
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Browser assertions
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/erzwelt-http.log 2>&1 &
          sleep 1
          cat >/tmp/knowledge-quest-qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":360,"height":800})
              page.on("pageerror", lambda e: errors.append("page:"+str(e)))
              page.on("console", lambda m: errors.append("console:"+m.type+":"+m.text) if m.type=="error" else None)
              page.goto("http://127.0.0.1:8000/index.html", wait_until="networkidle", timeout=30000)
              page.wait_for_timeout(150)

              base=page.evaluate('''()=>({
                patches:document.querySelectorAll('script[data-erzwelt-patch]').length,
                marker:window.__erzweltKnowledgeQuestFlow,
                tutorialActive:tutorialLaeuft(),
                art:document.getElementById('q-art')?.innerText||'',
                hasKnowledgeClass:document.getElementById('quest')?.classList.contains('wissen-quest')||false
              })''')
              assert base['patches']==25, base
              assert base['marker']['version']==1 and len(base['marker']['quests'])==6, base['marker']
              if base['tutorialActive']:
                  assert not base['hasKnowledgeClass'], base
                  assert base['art'].startswith('Aufgabe'), base['art']

              # Force a clean post-tutorial state for deterministic flow testing.
              page.evaluate('''()=>{
                localStorage.clear();
                S.tutorial=TUTORIAL.length;
                S.kasse=3000000;
                S.arbeiterGesamt=100;
                S.minen={kolwezi:{arbeiter:10,stufe:1,zufriedenheit:60,stillBis:0,malus:1,malusBis:0,ausbau:0,sicherheit:false,nachweis:false}};
                S.raff={r_china:{arbeiter:10,ausbau:0}};
                S.fabriken=[{produkt:'kabel',land:'deutschland',arbeiter:10,restbau:0}];
                S.erz={kupfer:50,alu:50,zinn:50};
                S.mat={kupfer:50,alu:50,zinn:50};
                S.ware={kabel:20};
                S.verkaeufer=2;
                S.handverkaufTag=-1;
                delete S.wissenQuestFlow;
                aktiveSeite='karte';offenesBlatt=null;offeneLupe=null;
                document.getElementById('seite').hidden=true;
                document.getElementById('blatt').hidden=true;
                document.getElementById('lupe').hidden=true;
                questZeichnen();
              }''')

              foundation=page.evaluate('''()=>({
                art:document.getElementById('q-art').innerText,
                title:document.getElementById('q-titel').innerText,
                text:document.getElementById('q-text').innerText,
                button:document.querySelector('[data-wissen-quest="basis"]')?.innerText||'',
                startMinen:S.wissenQuestFlow?.startMinen
              })''')
              assert foundation['art']=='Wissen freigeschaltet', foundation
              assert foundation['title']=='Deine Lieferkette steht', foundation
              assert foundation['button']=='Ansehen', foundation
              assert foundation['startMinen']==1, foundation

              page.click('[data-wissen-quest="basis"]')
              page.wait_for_timeout(80)
              basis=page.evaluate('''()=>({
                collected:S.wissenQuestFlow.collected.basis,
                fields:S.wissenQuestFlow.fields,
                lupe:document.getElementById('lupe').hidden,
                praxisKette:wissenPraxis('kette',0).ok,
                praxisChem:wissenPraxis('chemie',1).ok,
                praxisFab:wissenPraxis('fabrik',0).ok
              })''')
              assert basis['collected'] is True, basis
              assert all(basis['fields'].get(x) for x in ['kette','chemie','fabrik']), basis
              assert basis['praxisKette'] and basis['praxisChem'] and basis['praxisFab'], basis

              # Return to map and verify only one next quest is shown.
              page.evaluate('''()=>{document.getElementById('lupe').hidden=true;offeneLupe=null;seiteWechseln('karte');questZeichnen();}''')
              people=page.evaluate('''()=>({art:q=document.getElementById('q-art').innerText,title:document.getElementById('q-titel').innerText,button:!!document.querySelector('[data-wissen-quest="lohn"]'),praxis:wissenPraxis('leute',0).ok})''')
              assert people['art']=='Wissens-Quest 2/6', people
              assert people['title']=='Lohn & Zufriedenheit beobachten', people
              assert not people['button'] and not people['praxis'], people

              # Clicking the currently active wage level must NOT count.
              page.evaluate('''()=>{
                const host=document.createElement('div');
                host.innerHTML=blattMine('kolwezi');document.body.appendChild(host);
                host.querySelector('[data-tun="lohn"][data-stufe="1"]').click();
                host.remove();
              }''')
              assert page.evaluate("()=>!S.wissenQuestFlow.flags.lohn") is True

              # A real wage change completes the quest and stays pending until collected.
              page.evaluate('''()=>{
                const host=document.createElement('div');
                host.innerHTML=blattMine('kolwezi');document.body.appendChild(host);
                host.querySelector('[data-tun="lohn"][data-stufe="2"]').click();
                host.remove();questZeichnen();
              }''')
              wage_ready=page.evaluate('''()=>({flag:S.wissenQuestFlow.flags.lohn,art:document.getElementById('q-art').innerText,button:document.querySelector('[data-wissen-quest="lohn"]')?.innerText||''})''')
              assert wage_ready=={'flag':True,'art':'Wissen freigeschaltet','button':'Ansehen'}, wage_ready
              page.click('[data-wissen-quest="lohn"]');page.wait_for_timeout(60)
              assert page.evaluate("()=>wissenPraxis('leute',1).ok") is True

              # Market quest: one post-tutorial manual sale.
              page.evaluate('''()=>{document.getElementById('lupe').hidden=true;offeneLupe=null;seiteWechseln('karte');S.ware.kabel=20;S.handverkaufTag=-1;questZeichnen();}''')
              market_before=page.evaluate("()=>document.getElementById('q-art').innerText")
              assert market_before=='Wissens-Quest 3/6', market_before
              page.evaluate('''()=>{
                const host=document.createElement('div');host.innerHTML=seiteMarkt();document.body.appendChild(host);
                const b=host.querySelector('[data-tun="handverkauf"]');b.click();host.remove();questZeichnen();
              }''')
              assert page.evaluate("()=>S.wissenQuestFlow.flags.markt===true") is True
              assert page.locator('[data-wissen-quest="markt"]').count()==1
              page.click('[data-wissen-quest="markt"]');page.wait_for_timeout(60)
              assert page.evaluate("()=>wissenPraxis('markt',0).ok") is True

              # Geology quest: open one additional source after tutorial baseline.
              page.evaluate('''()=>{document.getElementById('lupe').hidden=true;offeneLupe=null;seiteWechseln('karte');questZeichnen();}''')
              assert page.evaluate("()=>document.getElementById('q-art').innerText")=='Wissens-Quest 4/6'
              page.evaluate('''()=>{
                const b=document.createElement('button');b.dataset.tun='mine-auf';b.dataset.id='bangka';document.body.appendChild(b);b.click();b.remove();questZeichnen();
              }''')
              assert page.locator('[data-wissen-quest="geologie"]').count()==1
              page.click('[data-wissen-quest="geologie"]');page.wait_for_timeout(60)
              assert page.evaluate("()=>wissenPraxis('geologie',1).ok") is True

              # Ruf/Nachweise quest: opening Ziel is the deliberate observation.
              page.evaluate('''()=>{document.getElementById('lupe').hidden=true;offeneLupe=null;seiteWechseln('karte');questZeichnen();}''')
              assert page.evaluate("()=>document.getElementById('q-art').innerText")=='Wissens-Quest 5/6'
              page.evaluate('''()=>{const b=document.createElement('button');b.dataset.seite='ziel';document.body.appendChild(b);b.click();b.remove();questZeichnen();}''')
              assert page.locator('[data-wissen-quest="ruf"]').count()==1
              page.click('[data-wissen-quest="ruf"]');page.wait_for_timeout(60)
              assert page.evaluate("()=>wissenPraxis('ruf',0).ok") is True

              # Model recap becomes the final collectable, then the normal wayfinder returns.
              page.evaluate('''()=>{document.getElementById('lupe').hidden=true;offeneLupe=null;seiteWechseln('karte');questZeichnen();}''')
              final_ready=page.evaluate('''()=>({art:document.getElementById('q-art').innerText,title:document.getElementById('q-titel').innerText,button:document.querySelector('[data-wissen-quest="modell"]')?.innerText||''})''')
              assert final_ready=={'art':'Wissen freigeschaltet','title':'Das Spielmodell einordnen','button':'Ansehen'}, final_ready
              page.click('[data-wissen-quest="modell"]');page.wait_for_timeout(60)
              done=page.evaluate('''()=>({count:Object.keys(S.wissenQuestFlow.collected).filter(k=>S.wissenQuestFlow.collected[k]).length,model:wissenPraxis('modell',1).ok})''')
              assert done['count']==6 and done['model'], done

              assert not errors, errors
              print(json.dumps({"base":base,"foundation":foundation,"done":done},ensure_ascii=False,indent=2))
              print('KNOWLEDGE QUEST FLOW QA PASS')
              browser.close()
          PY
          python /tmp/knowledge-quest-qa.py

      - name: Publish verified standalone and remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/knowledge-quest-qa.yml
          git commit -m "build: publish verified knowledge quest flow"
          git push origin HEAD:didactic-complexity-sekb
