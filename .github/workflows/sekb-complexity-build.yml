name: Sek B complexity build

on:
  push:
    branches:
      - didactic-complexity-sekb

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: didactic-complexity-sekb
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and standalone build
        run: |
          node --check didactic-complexity.js
          node -e "const p=require('./patches.json'); const f=p.groups.flatMap(g=>g.files); if(f.length!==23||f.at(-1)!=='didactic-complexity.js') process.exit(1)"
          node scripts/build-standalone.mjs
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Browser smoke
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/erzwelt-http.log 2>&1 &
          sleep 1
          cat >/tmp/sekb-smoke.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":360,"height":800})
              page.on("pageerror", lambda e: errors.append("page:"+str(e)))
              page.on("console", lambda m: errors.append("console:"+m.type+":"+m.text) if m.type=="error" else None)
              page.goto("http://127.0.0.1:8000/index.html", wait_until="networkidle", timeout=30000)
              page.wait_for_timeout(150)

              out=page.evaluate('''()=>({
                patches:document.querySelectorAll('script[data-erzwelt-patch]').length,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                complexity:window.__erzweltDidacticComplexity,
                mineInfos:MINEN.map(m=>m.info),
                model:WISSEN.find(s=>s.id==='modell'),
                tutorial:TUTORIAL.map(t=>({id:t.id,titel:t.titel,text:t.text,zusammenhang:t.zusammenhang}))
              })''')
              assert out['patches']==23, out['patches']
              assert out['overflow']<=0, out['overflow']
              assert out['complexity']['target']=='Sek B'
              assert all('%' not in x for x in out['mineInfos'])
              assert any('Quellenstand' in x for x in out['model']['fakten'])
              assert all(len(t['text'])<=180 for t in out['tutorial'])

              taiwan=page.evaluate('''()=>{const e=EREIGNISSE.find(x=>x.id==='taiwan');const d=e.bau();return {text:d.text,phone:S.nachfrageMod.phone.faktor,konsole:S.nachfrageMod.konsole.faktor};}''')
              assert 'Einige Kunden wechseln zu deiner Firma' in taiwan['text']
              assert taiwan['phone']==1.5 and taiwan['konsole']==1.5

              law_fail=page.evaluate('''()=>{S.perks={};S.minen={};const e=EREIGNISSE.find(x=>x.id==='lieferkettengesetz');return e.bau().text;}''')
              assert 'Im Spiel fällt eine Busse' in law_fail
              law_ok=page.evaluate('''()=>{S.perks={ruf1:true};const e=EREIGNISSE.find(x=>x.id==='lieferkettengesetz');return e.bau().text;}''')
              assert 'Grosskunden mit Nachweispflicht' in law_ok

              page.locator('#d-wahlen .wahl').nth(0).click()
              page.wait_for_timeout(100)
              quest=page.locator('#quest')
              assert quest.is_visible()
              qtext=page.locator('#q-text').inner_text()
              assert len(qtext)<=180

              browser.close()

          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('ERRORS',json.dumps(errors,ensure_ascii=False,indent=2))
          assert not errors, errors
          print('SEK B COMPLEXITY SMOKE PASS')
          PY
          python /tmp/sekb-smoke.py

      - name: Commit generated standalone and remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/sekb-complexity-build.yml
          git commit -m "build: publish verified Sek B complexity standalone"
          git push origin HEAD:didactic-complexity-sekb
