name: Generate standalone integration build

on:
  push:
    branches:
      - standalone-integration

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check builder syntax
        run: node --check scripts/build-standalone.mjs
      - name: Generate standalone HTML
        run: node scripts/build-standalone.mjs
      - name: Check generated diff
        run: git diff --check
      - name: Commit generated standalone file
        shell: bash
        run: |
          if git diff --quiet -- erzwelt.html; then
            echo "Standalone file already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erzwelt.html
          git commit -m "build: generate standalone erzwelt [skip ci]"
          git push
