name: Gameplay E2E

on:
  push:
    branches: [dev, main]
    paths:
      - "erzwelt-core.html"
      - "patches.json"
      - "*.js"
      - "index.html"
      - "assets/intro/**"
      - "scripts/build-standalone.mjs"
      - "tests/e2e/**"
      - ".github/workflows/dev-e2e-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "erzwelt-core.html"
      - "patches.json"
      - "*.js"
      - "index.html"
      - "assets/intro/**"
      - "scripts/build-standalone.mjs"
      - "tests/e2e/**"
      - ".github/workflows/dev-e2e-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve standalone
        run: |
          python3 -m http.server 4173 >/tmp/erzwelt-http.log 2>&1 &
          echo $! >/tmp/erzwelt-http.pid
          sleep 1

      - name: Run mobile probe
        run: node tests/e2e/probe.mjs

      - name: Run full gameplay E2E
        run: node tests/e2e/gameplay.mjs

      - name: Run save slot E2E
        run: node tests/e2e/spielstaende.mjs

      - name: Verify tutorial feedback duration
        run: node tests/e2e/lernfeedback.mjs

      - name: Verify transport animations and day duration
        run: node tests/e2e/transport-spieltempo.mjs

      - name: Verify knowledge objectives and monthly team costs
        run: node tests/e2e/wissen-team.mjs

      - name: Verify product research (Produktentwicklung)
        run: |
          node tests/e2e/produktentwicklung.mjs
          node tests/sim/produktentwicklung.mjs >/dev/null

      - name: Verify intro and discoveries, including the offline build
        run: |
          node scripts/build-standalone.mjs --offline
          node tests/e2e/intro-entdeckungen.mjs

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erzwelt-e2e-audit
          path: artifacts/
          if-no-files-found: warn
