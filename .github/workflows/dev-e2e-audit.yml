name: Dev E2E audit

on:
  push:
    branches: [dev]
    paths:
      - "tests/e2e/**"
      - ".github/workflows/dev-e2e-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve standalone
        run: |
          python3 -m http.server 4173 >/tmp/erzwelt-http.log 2>&1 &
          echo $! >/tmp/erzwelt-http.pid
          sleep 1

      - name: Run mobile probe
        run: node tests/e2e/probe.mjs

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erzwelt-e2e-probe
          path: artifacts/
          if-no-files-found: warn
