name: Visual objective audit

on:
  push:
    branches: [didactic-complexity-sekb]

permissions:
  contents: write

env:
  BRANCH: didactic-complexity-sekb

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: didactic-complexity-sekb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node scripts/build-standalone.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Capture mobile states
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 1
          cat >/tmp/capture.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          out=Path('visual-audit');out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':360,'height':800}, device_scale_factor=1)
              page.goto('http://127.0.0.1:8000/index.html',wait_until='networkidle')
              page.evaluate("()=>{document.getElementById('schleier').style.display='none';}")
              page.wait_for_timeout(150)
              page.screenshot(path=str(out/'01-tutorial-360.png'), full_page=False)

              page.evaluate('''()=>{
                S.tutorial=TUTORIAL.length;
                S.kasse=3000000;S.arbeiterGesamt=100;
                S.minen={kolwezi:{arbeiter:10,stufe:1,zufriedenheit:60,stillBis:0,malus:1,malusBis:0,ausbau:0,sicherheit:false,nachweis:false}};
                S.raff={r_china:{arbeiter:10,ausbau:0}};
                S.fabriken=[{produkt:'kabel',land:'deutschland',arbeiter:10,restbau:0}];
                S.erz={kupfer:50,alu:50,zinn:50};S.mat={kupfer:50,alu:50,zinn:50};S.ware={kabel:20};S.verkaeufer=2;S.handverkaufTag=-1;
                delete S.wissenQuestFlow;aktiveSeite='karte';offenesBlatt=null;offeneLupe=null;
                document.getElementById('seite').hidden=true;document.getElementById('blatt').hidden=true;document.getElementById('lupe').hidden=true;
                questZeichnen();
              }''')
              page.wait_for_timeout(100)
              # basis is immediately ready; collect it so next quest is actionable
              page.click('[data-wissen-quest="basis"]', force=True)
              page.wait_for_timeout(80)
              page.evaluate("()=>{document.getElementById('lupe').hidden=true;offeneLupe=null;seiteWechseln('karte');questZeichnen();}")
              page.wait_for_timeout(100)
              page.screenshot(path=str(out/'02-knowledge-lohn-360.png'), full_page=False)

              page.evaluate('''()=>{
                const f=S.wissenQuestFlow;f.collected.lohn=true;f.fields.leute=true;f.collected.markt=true;f.fields.markt=true;f.collected.geologie=true;f.fields.geologie=true;questZeichnen();
              }''')
              page.wait_for_timeout(80)
              page.screenshot(path=str(out/'03-knowledge-ruf-360.png'), full_page=False)

              # ready state: mark ruf flag but do not collect
              page.evaluate("()=>{S.wissenQuestFlow.flags.ruf=true;questZeichnen();}")
              page.wait_for_timeout(80)
              page.screenshot(path=str(out/'04-knowledge-ready-360.png'), full_page=False)

              metrics=page.evaluate('''()=>{
                const q=document.getElementById('quest');
                const g=document.querySelector('.objective-guide-action');
                const a=document.querySelector('.wissen-quest-action');
                const rect=x=>x?({x:x.getBoundingClientRect().x,y:x.getBoundingClientRect().y,w:x.getBoundingClientRect().width,h:x.getBoundingClientRect().height}):null;
                return {quest:rect(q),guide:rect(g),ready:rect(a),guideText:g?.innerText||'',font:g?getComputedStyle(g).fontSize:null,bg:g?getComputedStyle(g).backgroundColor:null,color:g?getComputedStyle(g).color:null};
              }''')
              (out/'metrics.txt').write_text(str(metrics),encoding='utf-8')
              b.close()
          PY
          python /tmp/capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: objective-visual-audit
          path: visual-audit/
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/visual-objective-audit.yml
          git commit -m "chore: remove temporary visual objective audit"
          git push origin HEAD:didactic-complexity-sekb
