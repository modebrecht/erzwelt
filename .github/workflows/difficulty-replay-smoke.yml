name: Difficulty replay browser smoke

on:
  push:
    branches:
      - difficulty-replay-pass

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: difficulty-replay-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preserve an unchosen difficulty across reload
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('erzwelt-core.html')
          s=p.read_text()
          replacements=[
            ('schwierigkeit:"mittel", etappe:1, etappeStartEingenommen:0, etappeStartAusgegeben:0,',
             'schwierigkeit:null, etappe:1, etappeStartEingenommen:0, etappeStartAusgegeben:0,'),
            ('if (!SCHWIERIGKEIT[S.schwierigkeit]) S.schwierigkeit = "mittel";',
             'if (g.schwierigkeit === undefined) S.schwierigkeit = "mittel";\n    else if (g.schwierigkeit !== null && !SCHWIERIGKEIT[g.schwierigkeit]) S.schwierigkeit = "mittel";'),
            ('const frischeRunde = !laden();\nif (frischeRunde){ S = neuerZustand();\n  notiz("Willkommen in der Erzwelt. Wähle zuerst deine Schwierigkeit.", "gut"); }\nletzterTagGezeigt = S.tag;\nansicht.z = 1.15; zeigeAuf("obuasi", 1.15);\ndockZeichnen();\ntempoSetzen(frischeRunde ? 0 : 1);\nzeichnen();\nif (frischeRunde) schwierigkeitZeigen();',
             'const geladen = laden();\nif (!geladen){ S = neuerZustand();\n  notiz("Willkommen in der Erzwelt. Wähle zuerst deine Schwierigkeit.", "gut"); }\nconst brauchtSchwierigkeit = !SCHWIERIGKEIT[S.schwierigkeit];\nletzterTagGezeigt = S.tag;\nansicht.z = 1.15; zeigeAuf("obuasi", 1.15);\ndockZeichnen();\ntempoSetzen(brauchtSchwierigkeit ? 0 : 1);\nzeichnen();\nif (brauchtSchwierigkeit) schwierigkeitZeigen();')
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one replacement, got {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          test "$(git hash-object erzwelt-core.html)" = "1eab52af4a1a21705b79acd4f5da61307ba21d08"
          node scripts/build-standalone.mjs
          git diff --check

      - name: Install Chromium driver
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Serve exact standalone
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/erzwelt-http.log 2>&1 &
          echo $! >/tmp/erzwelt-http.pid
          sleep 1

      - name: Smoke difficulty, knowledge pause and replay
        run: |
          cat >/tmp/erzwelt-smoke.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json, math

          errors=[]
          out={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":360,"height":800})
              page.on("pageerror", lambda e: errors.append("page:"+str(e)))
              page.on("console", lambda m: errors.append("console:"+m.type+":"+m.text) if m.type=="error" else None)
              page.goto("http://127.0.0.1:8000/index.html", wait_until="networkidle", timeout=30000)
              page.wait_for_timeout(250)

              out["patches"]=page.locator('script[data-erzwelt-patch]').count()
              out["modal_initial"]=not page.locator('#schleier').is_hidden()
              out["hard_initial_disabled"]=page.locator('#d-wahlen .wahl').nth(2).is_disabled()
              out["difficulty_labels"]=[page.locator('#d-wahlen .wahl').nth(i).inner_text() for i in range(3)]
              out["overflow"]=page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')
              out["pending_initial"]=page.evaluate('S.schwierigkeit')

              page.locator('#d-wahlen .wahl').nth(1).click()
              page.wait_for_timeout(80)
              out["chosen_medium"]=page.evaluate('S.schwierigkeit')
              out["tutorial_visible"]=not page.locator('#quest').is_hidden()

              out["ratios"]=page.evaluate('''()=>{const old=S.schwierigkeit;S.ware.kabel=0;S.ruf=70;S.globalMod=[];S.perks={};
                S.schwierigkeit='mittel';const m=warenPreis('kabel');
                S.schwierigkeit='einfach';const e=warenPreis('kabel');
                S.schwierigkeit='schwer';const h=warenPreis('kabel');S.schwierigkeit=old;
                return {m,e,h,eRatio:e/m,hRatio:h/m};}''')

              page.evaluate("tempoSetzen(4);seiteWechseln('wissen')")
              page.wait_for_timeout(50)
              out["wissen_pause"]=page.evaluate('({tempo,wissenTempoVorher,aktiveSeite})')
              page.evaluate("seiteWechseln('karte')")
              page.wait_for_timeout(50)
              out["wissen_resume"]=page.evaluate('({tempo,wissenTempoVorher,aktiveSeite})')

              page.evaluate('''()=>{tempoSetzen(1);S.schwierigkeit='mittel';S.etappe=1;S.etappeStartEingenommen=0;S.etappeStartAusgegeben=0;S.eingenommen=6000000;S.ausgegeben=0;S.ruf=70;S.tag=721;S.ende=null;rundeBeenden('etappe');}''')
              page.wait_for_timeout(50)
              out["medium_unlock"]=page.evaluate('META.mittelGeschafft')
              out["unlock_copy"]='Schwer freigeschaltet' in page.locator('#d-text').inner_text()
              # Result choice 1 is Neue Runde. It must reopen the difficulty chooser.
              page.locator('#d-wahlen .wahl').nth(1).click()
              page.wait_for_timeout(150)
              out["hard_after_unlock_disabled"]=page.locator('#d-wahlen .wahl').nth(2).is_disabled()
              page.locator('#d-wahlen .wahl').nth(2).click()
              page.wait_for_timeout(50)
              out["chosen_hard"]=page.evaluate('S.schwierigkeit')

              page.evaluate('''()=>{tempoSetzen(4);S.etappe=1;S.etappeStartEingenommen=0;S.etappeStartAusgegeben=0;S.eingenommen=1000000;S.ausgegeben=100000;S.ruf=65;S.tag=721;S.ende=null;rundeBeenden('etappe');}''')
              page.wait_for_timeout(50)
              out["continue_count"]=page.locator('#d-wahlen .wahl').count()
              page.locator('#d-wahlen .wahl').nth(0).click()
              page.wait_for_timeout(100)
              out["after_continue"]=page.evaluate('({tag:S.tag,etappe:S.etappe,ende:S.ende,tempo,next:etappenEnde(),startE:S.etappeStartEingenommen,startA:S.etappeStartAusgegeben})')

              page.evaluate("seiteWechseln('ziel')")
              page.wait_for_timeout(50)
              ziel=page.locator('#seite').inner_text()
              out["ziel_copy"]={k:(k in ziel) for k in ['Etappe 2','Schwierigkeit','Schwer','Nächste Abrechnung','Verbleibende Tage','Gesamtgewinn']}
              page.evaluate("seiteWechseln('karte')")

              # Test the real overridden day step at the second 720-day boundary.
              page.evaluate('''()=>{tempoSetzen(0);S.ende=null;S.etappe=2;S.tag=1440;S.etappeStartEingenommen=0;S.etappeStartAusgegeben=0;S.eingenommen=100000;S.ausgegeben=0;S.ruf=70;modalOffen=false;}''')
              page.evaluate('tagVor()')
              page.wait_for_timeout(50)
              out["boundary_via_tagVor"]=page.evaluate('({tag:S.tag,ende:S.ende&&{grund:S.ende.grund,etappe:S.ende.etappe}})')
              page.locator('#d-wahlen .wahl').nth(0).click()
              page.wait_for_timeout(80)

              page.evaluate("()=>{tempoSetzen(0);S.ende=null;S.kasse=-900001;modalOffen=false;tagVor()}")
              page.wait_for_timeout(50)
              out["insolvency"]=page.evaluate('S.ende&&S.ende.grund')
              out["insolvency_buttons"]=page.locator('#d-wahlen .wahl').count()

              # Use the actual New Round action. Hard is profile metadata and must remain unlocked.
              page.locator('#d-wahlen .wahl').nth(0).click()
              page.wait_for_timeout(150)
              out["new_round_pending"]=page.evaluate('S.schwierigkeit')
              out["hard_after_new_round"]=not page.locator('#d-wahlen .wahl').nth(2).is_disabled()

              # Reload without choosing: pagehide may save, but chooser must return and Hard must stay unlocked.
              page.reload(wait_until='networkidle')
              page.wait_for_timeout(150)
              out["pending_after_reload"]=page.evaluate('S.schwierigkeit')
              out["chooser_after_reload"]=not page.locator('#schleier').is_hidden()
              out["hard_persisted_after_reload"]=not page.locator('#d-wahlen .wahl').nth(2).is_disabled()

              # v1 migration: prevent the normal pagehide flush from recreating v2 after setting a legacy-only save.
              page.locator('#d-wahlen .wahl').nth(1).click()
              page.wait_for_timeout(50)
              page.evaluate('''()=>{const old=JSON.parse(localStorage.getItem('erzwelt_v2'));delete old.schwierigkeit;delete old.etappe;delete old.etappeStartEingenommen;delete old.etappeStartAusgegeben;localStorage.removeItem('erzwelt_v2');localStorage.setItem('erzwelt_v1',JSON.stringify(old));speichern=()=>{};}''')
              page.reload(wait_until='networkidle')
              page.wait_for_timeout(150)
              out["migration"]=page.evaluate('({schwierigkeit:S.schwierigkeit,etappe:S.etappe,startE:S.etappeStartEingenommen,startA:S.etappeStartAusgegeben})')

              browser.close()

          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('ERRORS',json.dumps(errors,ensure_ascii=False,indent=2))
          assert out['patches']==22
          assert out['modal_initial'] and out['hard_initial_disabled'] and out['pending_initial'] is None
          assert out['overflow']<=0 and out['chosen_medium']=='mittel' and out['tutorial_visible']
          assert math.isclose(out['ratios']['eRatio'],1.2,rel_tol=1e-12)
          assert math.isclose(out['ratios']['hRatio'],0.7,rel_tol=1e-12)
          assert out['wissen_pause']['tempo']==0 and out['wissen_pause']['wissenTempoVorher']==4
          assert out['wissen_resume']['tempo']==4 and out['wissen_resume']['wissenTempoVorher'] is None
          assert out['medium_unlock'] and out['unlock_copy'] and not out['hard_after_unlock_disabled']
          assert out['chosen_hard']=='schwer'
          assert out['continue_count']==2
          assert out['after_continue']['tag']==721 and out['after_continue']['etappe']==2 and out['after_continue']['ende'] is None and out['after_continue']['tempo']==4 and out['after_continue']['next']==1440
          assert all(out['ziel_copy'].values())
          assert out['boundary_via_tagVor']['tag']==1441 and out['boundary_via_tagVor']['ende']=={'grund':'etappe','etappe':2}
          assert out['insolvency']=='insolvenz' and out['insolvency_buttons']==1
          assert out['new_round_pending'] is None and out['hard_after_new_round']
          assert out['pending_after_reload'] is None and out['chooser_after_reload'] and out['hard_persisted_after_reload']
          assert out['migration']=={'schwierigkeit':'mittel','etappe':1,'startE':0,'startA':0}
          assert not errors, errors
          print('EXACT PACKED BROWSER SMOKE PASS')
          PY
          python /tmp/erzwelt-smoke.py

      - name: Commit reload fix and remove temporary smoke workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/difficulty-replay-smoke.yml
          git add erzwelt-core.html index.html
          git commit -m "fix: preserve pending difficulty selection"
          git push origin HEAD:difficulty-replay-pass
