name: Full Easy E2E smoke

on:
  push:
    branches:
      - full-easy-e2e-smoke

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4
        with:
          ref: full-easy-e2e-smoke
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild exact standalone
        run: |
          test "$(git rev-parse origin/main)" = "655a5927bbdf5cc0a3ed689f283f2e441e8423a1"
          node scripts/build-standalone.mjs
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Serve exact standalone
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/erzwelt-http.log 2>&1 &
          echo $! >/tmp/erzwelt-http.pid
          sleep 1

      - name: Play full Easy infrastructure run
        run: |
          cat >/tmp/full-easy-smoke.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json, math, sys

          errors=[]
          timeline=[]

          def dump(label, value):
              print(label, json.dumps(value, ensure_ascii=False, indent=2))

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":360,"height":800})
              page.on("pageerror", lambda e: errors.append("page:"+str(e)))
              page.on("console", lambda m: errors.append("console:"+m.type+":"+m.text) if m.type=="error" else None)
              page.goto("http://127.0.0.1:8000/index.html", wait_until="networkidle", timeout=30000)
              page.wait_for_timeout(150)

              # Deterministic event/market path so this remains a repeatable smoke.
              page.evaluate("""()=>{let seed=0x5EED1234;Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};}""")

              config=page.evaluate("""()=>({
                start:STARTKAPITAL,
                mines:MINEN.map(m=>({id:m.id,mat:m.mat,cost:m.erschliessung,places:m.plaetze})),
                raffs:RAFF_ORTE.map(r=>({id:r.id,cost:r.bau,places:r.plaetze})),
                products:Object.entries(PRODUKT).map(([id,p])=>({id,cost:p.kosten,build:p.bauzeit,places:p.plaetze})),
                fabPlaces:[...FAB_ORTE],
                starter:[...START_MATERIALIEN],
                patches:document.querySelectorAll('script[data-erzwelt-patch]').length
              })""")
              dump("CONFIG",config)
              assert config['patches']==22

              # Choose Easy through the actual UI.
              assert page.locator('#d-wahlen .wahl').count()==3
              page.locator('#d-wahlen .wahl').nth(0).click()
              page.wait_for_timeout(80)
              assert page.evaluate('S.schwierigkeit')=='einfach'

              # Tutorial itself has a dedicated full 1-11 browser gate already. This run starts
              # immediately after it so the smoke can exercise every purchasable world asset.
              page.evaluate("""()=>{S.tutorial=TUTORIAL.length; if(typeof tutorialErneuern==='function')tutorialErneuern(); seiteWechseln('karte'); zeichnen();}""")

              def q(expr):
                  return page.evaluate(expr)

              def click(sel):
                  return page.evaluate("""sel=>{const e=document.querySelector(sel);if(!e||e.disabled)return false;e.click();return true;}""",sel)

              def close_to_map():
                  page.evaluate("()=>{seiteWechseln('karte'); if(typeof zeichnen==='function')zeichnen();}")

              def handle_modal():
                  # Returns False only for terminal insolvency.
                  for _ in range(8):
                      info=q("()=>({open:!!modalOffen,ende:S.ende&&S.ende.grund,buttons:[...document.querySelectorAll('#d-wahlen .wahl')].map(b=>b.innerText)})")
                      if not info['open']:
                          return True
                      if info['ende']=='insolvenz':
                          dump('INSOLVENCY',q("()=>({tag:S.tag,kasse:S.kasse,ein:S.eingenommen,aus:S.ausgegeben,ruf:S.ruf})"))
                          return False
                      if info['ende']=='etappe':
                          # Always continue normally: this is an Easy smoke, not the assistance-bonus path.
                          ok=page.evaluate("""()=>{const b=[...document.querySelectorAll('#d-wahlen .wahl')].find(x=>x.innerText.includes('Weiter · Etappe'));if(!b)return false;b.click();return true;}""")
                          if not ok:
                              raise AssertionError('stage result had no normal Continue button')
                          page.wait_for_timeout(5)
                          continue
                      # Required/random event: take the first available choice, as a real user can.
                      ok=page.evaluate("""()=>{const b=[...document.querySelectorAll('#d-wahlen .wahl')].find(x=>!x.disabled);if(!b)return false;b.click();return true;}""")
                      if not ok:
                          raise AssertionError('open event modal had no usable choice')
                      page.wait_for_timeout(5)
                  raise AssertionError('modal did not settle')

              def hire_to_free(target, reserve=250000):
                  for _ in range(20):
                      free=q('freieArbeiter()')
                      if free>=target:
                          return True
                      cash=q('S.kasse')
                      need=max(5, min(50, int(math.ceil((target-free)/5))*5))
                      # Do not endanger the company merely to satisfy the smoke.
                      max_afford=max(0,int((cash-reserve)//q('LOHN_PRO_KOPF')))
                      need=min(need,(max_afford//5)*5)
                      if need<5:
                          return False
                      page.evaluate("n=>{anstellMenge=n;seiteWechseln('team');seiteAktualisieren();}",need)
                      if not click('[data-tun="anstellen"]'):
                          return False
                      page.wait_for_timeout(3)
                  return q('freieArbeiter()')>=target

              def ensure_sellers(target=5):
                  current=q('S.verkaeufer||0')
                  if current>=target:
                      return
                  if not hire_to_free(target-current,300000):
                      return
                  page.evaluate("()=>seiteWechseln('markt')")
                  for _ in range(10):
                      if q('S.verkaeufer||0')>=target: break
                      if not click('[data-tun="vcrew"][data-n="1"]'): break
                  close_to_map()

              def open_pin(kind,id):
                  close_to_map()
                  sel=f'[data-pin="{kind}"][data-id="{id}"]'
                  if not page.evaluate("sel=>!!document.querySelector(sel)",sel):
                      return False
                  return click(sel)

              def assign_mine(id,target=5):
                  if q(f"S.minen[{json.dumps(id)}]?.arbeiter||0")>=target:return
                  if not hire_to_free(target,250000):return
                  open_pin('mine',id)
                  for _ in range(target):
                      if q(f"S.minen[{json.dumps(id)}]?.arbeiter||0")>=target:break
                      if not click(f'[data-tun="crew"][data-id="{id}"][data-n="1"]'):break

              def assign_raff(id,target=5):
                  if q(f"S.raff[{json.dumps(id)}]?.arbeiter||0")>=target:return
                  if not hire_to_free(target,250000):return
                  open_pin('raff',id)
                  for _ in range(target):
                      if q(f"S.raff[{json.dumps(id)}]?.arbeiter||0")>=target:break
                      if not click(f'[data-tun="rcrew"][data-id="{id}"][data-n="1"]'):break

              def assign_finished_factories(target=5):
                  facts=q("()=>S.fabriken.map((f,i)=>({i,land:f.land,rest:f.restbau,crew:f.arbeiter,product:f.produkt}))")
                  for f in facts:
                      if f['rest']>0 or f['crew']>=target:continue
                      if not hire_to_free(target,250000):return
                      open_pin('fab',f['land'])
                      for _ in range(target):
                          cur=q(f"S.fabriken[{f['i']}]&&S.fabriken[{f['i']}].arbeiter||0")
                          if cur>=target:break
                          if not click(f'[data-tun="fcrew"][data-i="{f["i"]}"][data-n="1"]'):break

              # Prioritise the three tutorial-chain materials, cheapest mine for each.
              starter=[]
              for mat in config['starter']:
                  opts=[m for m in config['mines'] if m['mat']==mat]
                  if opts: starter.append(min(opts,key=lambda x:x['cost']))
              rest_mines=sorted([m for m in config['mines'] if m['id'] not in {x['id'] for x in starter}],key=lambda x:x['cost'])
              mine_order=starter+rest_mines
              raff_order=sorted(config['raffs'],key=lambda x:x['cost'])
              product_order=sorted(config['products'],key=lambda x:x['cost'])

              # Purchase helper functions use the actual map sheet and CTA buttons.
              def buy_mine(m,reserve):
                  if q(f"!!S.minen[{json.dumps(m['id'])}]"):return False
                  if q('S.kasse') < m['cost']+reserve:return False
                  if not open_pin('mine',m['id']):return False
                  if not click(f'[data-tun="mine-auf"][data-id="{m["id"]}"]'):return False
                  page.wait_for_timeout(3)
                  assign_mine(m['id'])
                  return True

              def buy_raff(r,reserve):
                  if q(f"!!S.raff[{json.dumps(r['id'])}]"):return False
                  if q('S.kasse') < r['cost']+reserve:return False
                  if not open_pin('raff',r['id']):return False
                  if not click(f'[data-tun="raff-bau"][data-id="{r["id"]}"]'):return False
                  page.wait_for_timeout(3)
                  assign_raff(r['id'])
                  return True

              def build_factory(land,product,reserve):
                  cost=next(x['cost'] for x in config['products'] if x['id']==product)
                  if q('S.kasse') < cost+reserve:return False
                  if not open_pin('fab',land):return False
                  before=q('S.fabriken.length')
                  if not click(f'[data-tun="fab-bau"][data-p="{product}"][data-l="{land}"]'):return False
                  page.wait_for_timeout(3)
                  return q('S.fabriken.length')==before+1

              # Build a viable starter chain first.
              for m in starter:
                  if not buy_mine(m,300000):
                      raise AssertionError(f'could not buy starter mine {m}')
              if not buy_raff(raff_order[0],300000):
                  raise AssertionError('could not buy starter refinery')
              if not build_factory(config['fabPlaces'][0],'kabel',250000):
                  raise AssertionError('could not build starter cable factory')
              ensure_sellers(5)

              def state():
                  return q("""()=>({tag:S.tag,kasse:Math.round(S.kasse),ruf:Math.round(S.ruf),ein:Math.round(S.eingenommen),aus:Math.round(S.ausgegeben),etappe:S.etappe,
                    mines:Object.keys(S.minen).length,raff:Object.keys(S.raff).length,fabs:S.fabriken.length,
                    fabLands:[...new Set(S.fabriken.map(f=>f.land))],products:[...new Set(S.fabriken.map(f=>f.produkt))],
                    finished:S.fabriken.filter(f=>f.restbau===0).length,staffedM:Object.values(S.minen).filter(m=>m.arbeiter>0).length,
                    staffedR:Object.values(S.raff).filter(r=>r.arbeiter>0).length,staffedF:S.fabriken.filter(f=>f.restbau===0&&f.arbeiter>0).length,
                    workers:S.arbeiterGesamt,sellers:S.verkaeufer,ware:Object.values(S.ware).reduce((a,b)=>a+b,0),ende:S.ende&&S.ende.grund})""")

              target_mines=len(config['mines'])
              target_raff=len(config['raffs'])
              target_lands=len(config['fabPlaces'])
              target_products=len(config['products'])

              # Main play loop: run real day steps, resolve real events, reinvest earned cash.
              max_day=3600
              while q('S.tag') < max_day:
                  if not handle_modal():
                      raise AssertionError('Easy full-infrastructure smoke went insolvent')

                  reserve=350000 if q('S.eingenommen')<1000000 else 250000

                  # Buy at most two new capital assets per investment cycle to keep liquidity healthy.
                  bought=0
                  for m in mine_order:
                      if bought>=2:break
                      if buy_mine(m,reserve):bought+=1
                  for r in raff_order:
                      if bought>=2:break
                      if buy_raff(r,reserve):bought+=1

                  # Occupy every factory country. Cycle products so all product recipes get exercised.
                  existing_lands=set(q("()=>S.fabriken.map(f=>f.land)"))
                  existing_products=set(q("()=>S.fabriken.map(f=>f.produkt)"))
                  for idx,land in enumerate(config['fabPlaces']):
                      if bought>=2:break
                      if land in existing_lands:continue
                      # Prefer a product not represented yet, otherwise cycle catalogue.
                      missing=[p['id'] for p in product_order if p['id'] not in existing_products]
                      prod=(missing[0] if missing else product_order[idx%len(product_order)]['id'])
                      if build_factory(land,prod,reserve):
                          bought+=1;existing_lands.add(land);existing_products.add(prod)

                  # If all countries are occupied but a catalogue product is still missing, add it at first site.
                  if bought<2 and len(existing_lands)==target_lands:
                      for pdef in product_order:
                          if pdef['id'] in existing_products:continue
                          if build_factory(config['fabPlaces'][0],pdef['id'],reserve):
                              bought+=1;existing_products.add(pdef['id'])
                          if bought>=2:break

                  assign_finished_factories(5)
                  ensure_sellers(8 if q('S.eingenommen')>1500000 else 5)

                  # Advance up to 30 genuine game days. tagVor stops itself when a modal opens.
                  advanced=q("""()=>{const start=S.tag;for(let i=0;i<30;i++){if(modalOffen||S.ende)break;tagVor();}return S.tag-start;}""")
                  if advanced==0:
                      if not handle_modal():raise AssertionError('insolvency')
                      continue

                  s=state()
                  if s['tag']%120<31:
                      timeline.append(s)

                  all_bought=(s['mines']==target_mines and s['raff']==target_raff and len(s['fabLands'])==target_lands and len(s['products'])==target_products)
                  all_running=(s['staffedM']==target_mines and s['staffedR']==target_raff and s['finished']>=target_lands and s['staffedF']>=target_lands)
                  if all_bought and all_running and s['tag']>720 and s['ein']>0:
                      break

              if not handle_modal():raise AssertionError('terminal insolvency at finish')
              final=state()
              dump('FINAL',final)
              dump('TIMELINE',timeline[-12:])

              assert final['mines']==target_mines, (final,target_mines)
              assert final['raff']==target_raff, (final,target_raff)
              assert len(final['fabLands'])==target_lands, (final,target_lands)
              assert len(final['products'])==target_products, (final,target_products)
              assert final['staffedM']==target_mines
              assert final['staffedR']==target_raff
              assert final['staffedF']>=target_lands
              assert final['tag']>720
              assert final['ein']>0
              assert final['ende'] is None

              # Save/reload the fully-expanded company and verify infrastructure survives intact.
              before=q("()=>({mines:Object.keys(S.minen).length,raff:Object.keys(S.raff).length,fabs:S.fabriken.length,tag:S.tag,schwierigkeit:S.schwierigkeit})")
              page.evaluate('speichern()')
              page.reload(wait_until='networkidle')
              page.wait_for_timeout(150)
              after=q("()=>({mines:Object.keys(S.minen).length,raff:Object.keys(S.raff).length,fabs:S.fabriken.length,tag:S.tag,schwierigkeit:S.schwierigkeit})")
              dump('RELOAD',{'before':before,'after':after})
              assert after==before
              assert page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth')<=0
              assert not errors, errors
              browser.close()

          print('FULL EASY E2E INFRASTRUCTURE SMOKE PASS')
          PY
          python /tmp/full-easy-smoke.py

      - name: Remove temporary smoke workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- index.html
          git rm .github/workflows/full-easy-e2e-smoke.yml
          git commit -m "chore: remove temporary full easy smoke"
          git push origin HEAD:full-easy-e2e-smoke
