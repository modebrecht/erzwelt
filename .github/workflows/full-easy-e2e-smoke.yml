name: Full Easy E2E smoke

on:
  push:
    branches:
      - full-easy-e2e-smoke

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4
        with:
          ref: full-easy-e2e-smoke
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild exact standalone
        run: |
          test "$(git rev-parse origin/main)" = "655a5927bbdf5cc0a3ed689f283f2e441e8423a1"
          node scripts/build-standalone.mjs
          git diff --check

      - name: Harden temporary smoke driver
        run: python scripts/harden-full-easy-smoke.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Serve exact standalone
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/erzwelt-http.log 2>&1 &
          sleep 1

      - name: Play full Easy infrastructure run
        run: python scripts/full-easy-e2e-smoke.py

      - name: Remove temporary smoke files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- index.html scripts/full-easy-e2e-smoke.py
          git rm .github/workflows/full-easy-e2e-smoke.yml scripts/full-easy-e2e-smoke.py scripts/harden-full-easy-smoke.py
          git commit -m "chore: remove temporary full easy smoke"
          git push origin HEAD:full-easy-e2e-smoke
