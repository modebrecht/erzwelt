<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3648">
<title>Erzwelt — Rohstoffe &amp; Lieferketten</title>
<style>
html,body{margin:0;height:100%;background:#0a2f42;color:#fff;font-family:system-ui,sans-serif}
#boot{height:100%;display:grid;place-items:center;padding:24px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div id="boot">Erzwelt wird geladen …</div>
<script>
(async()=>{
  try{
    const response=await fetch("./erzwelt-core.html",{cache:"no-cache"});
    if(!response.ok) throw new Error("Core HTTP "+response.status);
    let html=await response.text();
    const patches=["didactic-model.js","didactic-events.js","didactic-ui.js","didactic-should.js","didactic-transport.js","language-pass.js","language-pass-2.js","performance-pass.js","transformation-animations.js","transformation-enhance.js","tutorial-enhance.js","construction-visibility.js"]
      .map(src=>`<script src="./${src}"><\/script>`).join("");
    if(!html.includes("</body>")) throw new Error("Core-Datei ist unvollständig");
    html=html.replace("</body>",patches+"</body>");
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById("boot").innerHTML="Erzwelt konnte nicht geladen werden.<br><small>Bitte über einen lokalen Webserver oder die veröffentlichte Webseite öffnen.</small>";
  }
})();
</script>
</body>
</html>
