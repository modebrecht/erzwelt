<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b3648">
<title>Erzwelt — Rohstoffe &amp; Lieferketten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   ERZWELT — Rohstoffe & Lieferketten
   Aufbau: 1 CSS · 2 DATEN · 3 MOTOR · 4 KARTE · 5 ANZEIGE
   ========================================================== */
:root{
  --meer1:#14587a; --meer2:#0a2f42; --land:#e6d6ae; --landlinie:#b49f73;
  --papier:#fffaf0; --papier2:#f4ead6; --tinte:#2b2118; --grau:#7d6f5e;
  --gold:#f5b73d; --gruen:#2fbe7e; --alarm:#e0504a; --warn:#f08c2e;
  --dunkel:#0e2b3c; --linie:#e0d3b8;
  --sh:0 4px 0 rgba(0,0,0,.14), 0 8px 20px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:Nunito,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:600; color:var(--tinte); background:var(--meer2);
  font-size:15px; line-height:1.35; overscroll-behavior:none;
  user-select:none; -webkit-user-select:none;
}
h1,h2,h3,.disp{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Bühne ---------- */
#spiel{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:30;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  display:flex;gap:7px;align-items:center;
  background:linear-gradient(#0a2f42f0,#0a2f4200);pointer-events:none
}
.pille{
  display:flex;align-items:center;gap:6px;pointer-events:auto;
  background:#0b3648e8;border:2px solid #ffffff26;border-radius:99px;
  padding:5px 11px 5px 7px;color:#fff;box-shadow:0 3px 0 #00000030
}
.pille i{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-style:normal;font-size:13px;flex:none}
.pille b{font-family:"Baloo 2",sans-serif;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pille small{font-size:10px;opacity:.65;display:block;line-height:1;margin-bottom:1px;letter-spacing:.04em}
.pille.kasse i{background:var(--gold);color:#5a3c00}
.pille.crew i{background:#6fb8e0;color:#0a3a55}
.pille.tag{margin-left:auto;padding:5px 7px}
.tempo{display:flex;gap:3px;pointer-events:auto}
.tempo button{
  width:34px;height:34px;border-radius:12px;background:#0b3648e8;border:2px solid #ffffff26;
  color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:13px;
  display:grid;place-items:center;box-shadow:0 3px 0 #00000030
}
.tempo button[aria-pressed="true"]{background:var(--gold);color:#4a3000;border-color:#fff6}

/* ---------- Karte ---------- */
#sicht{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(120% 80% at 50% 10%, var(--meer1) 0%, var(--meer2) 70%);
  touch-action:none;cursor:grab}
#sicht.zieht{cursor:grabbing}
#welt{position:absolute;top:0;left:0;width:1000px;height:560px;transform-origin:0 0}
#welt svg{display:block;width:1000px;height:560px}
.land{fill:var(--land);stroke:var(--landlinie);stroke-width:1.5;stroke-linejoin:round}
.gitter{stroke:#ffffff14;stroke-width:1;fill:none}

/* ---------- Pins ---------- */
.pin{
  position:absolute;transform-origin:50% 100%;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))
}
.knopf{
  width:38px;height:38px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;
  display:grid;place-items:center;position:relative;
  background:#f7f1e2;border:3px solid #fff;font-size:15px;font-weight:800;
  font-family:"Baloo 2",sans-serif;color:#3a2d1c
}
.knopf::after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top:8px solid #fff}
.pin.zu .knopf{background:#fbf7ee;border-color:#8b7a5e;color:#7a6a50;border-width:2.5px}
.pin.zu .knopf::after{border-top-color:#8b7a5e}
.pin .bez{
  font-size:9.5px;font-weight:800;color:#fff;background:#0b3648e6;
  padding:1px 6px;border-radius:99px;white-space:nowrap;margin-top:7px;
  font-family:"Baloo 2",sans-serif;pointer-events:none;position:relative;z-index:1
}
.pin .knopf{position:relative;z-index:2}
.pin .crew{
  position:absolute;top:-6px;right:-8px;background:#6fb8e0;color:#06263a;
  border:2px solid #fff;border-radius:99px;font-size:10px;font-weight:800;
  padding:0 5px;min-width:19px;text-align:center;font-family:"Baloo 2",sans-serif
}
.pin.werk .knopf{border-radius:12px}
.pin.werk .knopf::after{border-top-color:#fff}
.pin.alarm .knopf{border-color:var(--alarm);animation:puls 1s infinite}
.pin.alarm .bez{background:var(--alarm)}
@keyframes puls{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#welt.weit .pin .bez{display:none}
.pin:active{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}

/* ---------- Ebenen-Chips ---------- */
#ebenen{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:20;display:flex;gap:6px}
#ebenen button{
  background:#0b3648d9;color:#fff;border:2px solid #ffffff26;border-radius:99px;
  padding:5px 11px;font-size:12px;font-weight:800;font-family:"Baloo 2",sans-serif
}
#ebenen button{display:flex;align-items:center;gap:5px}
#ebenen button i{width:9px;height:9px;border-radius:3px;display:block}
#ebenen button[aria-pressed="false"]{opacity:.4}
#zoom{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:20;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:13px;background:#0b3648d9;color:#fff;
  border:2px solid #ffffff26;font-size:19px;font-family:"Baloo 2",sans-serif;font-weight:800}

/* ---------- Wegweiser ---------- */
#quest{
  position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 52px);z-index:27;
  width:min(46%,255px);background:var(--papier);border-radius:16px;
  border-top:4px solid var(--gold);box-shadow:var(--sh);padding:8px 11px 10px
}
#quest[hidden]{display:none}
#quest.unten{top:auto;bottom:calc(env(safe-area-inset-bottom) + 70px);left:10px;right:10px;width:auto;z-index:44}
#quest .kopf{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--grau)}
#quest .kopf span:first-child{font-size:14px}
#quest b{display:block;font-family:"Baloo 2",sans-serif;font-size:13.5px;line-height:1.18;margin:3px 0 2px}
#quest small{display:block;color:var(--grau);font-size:11px;font-weight:600;line-height:1.28}
#quest .fortschritt{display:flex;gap:3px;margin-top:7px}
#quest .fortschritt i{height:4px;flex:1;border-radius:99px;background:#e3d7bd}
#quest .fortschritt i.ok{background:var(--gruen)}
#quest .fortschritt i.jetzt{background:var(--gold)}

/* Hinweis-Animation: zeigt, wo getippt werden soll */
.pin.wink{z-index:5}
.pin.wink .knopf{border-color:var(--gold);box-shadow:0 0 0 5px #f5b73d66;animation:wink 1.15s ease-in-out infinite}
@keyframes wink{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.pin.blass{opacity:.45}
#dock button{position:relative}
#dock button.wink{color:var(--gold);background:#f5b73d1f}
#dock button.wink::after{content:"";position:absolute;top:3px;right:calc(50% - 20px);
  width:9px;height:9px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 0 #f5b73daa;animation:ping 1.3s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #f5b73daa}70%{box-shadow:0 0 0 9px #f5b73d00}100%{box-shadow:0 0 0 0 #f5b73d00}}

/* ---------- Dock ---------- */
#dock{
  position:absolute;left:0;right:0;bottom:0;z-index:39;display:flex;
  background:#0b3648;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
  border-top:2px solid #ffffff1a
}
#dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 2px;color:#7fa3b8;font-size:10.5px;font-weight:800;font-family:"Baloo 2",sans-serif;border-radius:12px}
#dock button em{font-style:normal;font-size:19px;line-height:1}
#dock button[aria-selected="true"]{color:var(--gold);background:#ffffff10}

/* ---------- Blatt (Bottom Sheet) & Seiten ---------- */
#blatt{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:40;
  max-height:74%;background:var(--papier);border-radius:22px 22px 0 0;
  box-shadow:0 -6px 30px rgba(0,0,0,.4);
  transform:translateY(calc(100% + 60px));transition:transform .26s cubic-bezier(.22,1,.3,1);
  display:flex;flex-direction:column;padding-bottom:10px
}
#blattschleier{position:absolute;left:0;right:0;top:0;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:38;background:#06202e66;opacity:0;
  transition:opacity .26s;pointer-events:none}
#blattschleier.auf{opacity:1;pointer-events:auto}
#zu{position:absolute;top:8px;right:12px;width:32px;height:32px;border-radius:50%;
  background:var(--papier2);font-size:17px;font-weight:800;display:grid;place-items:center;color:var(--grau)}
#blatt.auf{transform:translateY(0)}
#blatt.auf ~ #dock{box-shadow:0 -2px 14px #0006}
.griff{width:42px;height:5px;border-radius:99px;background:#00000022;margin:9px auto 4px;flex:none}
.blattinhalt{overflow-y:auto;padding:6px 16px 12px;-webkit-overflow-scrolling:touch}
#seite{
  position:absolute;inset:0;bottom:calc(env(safe-area-inset-bottom) + 62px);z-index:35;
  background:var(--papier);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 20px;
  -webkit-overflow-scrolling:touch
}
#seite[hidden]{display:none}
#seite h1{font-size:23px;margin-bottom:2px}
#seite .unter{color:var(--grau);font-size:13px;margin-bottom:14px}

/* ---------- Bausteine ---------- */
.titelzeile{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.titelzeile .flagge{font-size:26px}
.titelzeile h2{font-size:21px}
.titelzeile .ort{color:var(--grau);font-size:12.5px;font-weight:700}
.erzband{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 12px 5px 6px;
  color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:13.5px;margin:8px 0}
.erzband span{width:22px;height:22px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-size:11px}
.werte{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.wert{background:var(--papier2);border-radius:13px;padding:8px 10px}
.wert small{display:block;color:var(--grau);font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.wert b{font-family:"Baloo 2",sans-serif;font-size:16px;font-variant-numeric:tabular-nums}
.notiz{background:#fff3d6;border-radius:13px;padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.4;margin:10px 0}
.notiz.rot{background:#ffe2e0}
.notiz.gruen{background:#dcf5e8}
.cta{
  display:block;width:100%;padding:15px;border-radius:17px;text-align:center;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:16.5px;margin-top:10px;
  background:var(--gold);color:#4a3000;box-shadow:0 4px 0 #c48d1c
}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #c48d1c}
.cta.gruen{background:var(--gruen);color:#04331f;box-shadow:0 4px 0 #1d8d5c}
.cta.gruen:active{box-shadow:0 1px 0 #1d8d5c}
.cta.still{background:var(--papier2);color:var(--grau);box-shadow:0 4px 0 #e0d3b8}
.cta:disabled{background:#e8ddc6;color:#a1937d;box-shadow:0 4px 0 #d6c9b0;cursor:not-allowed}
.crewzeile{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0 6px}
.crewzeile button{
  width:48px;height:48px;border-radius:16px;background:var(--papier2);
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:15px;box-shadow:0 3px 0 #e0d3b8
}
.crewzeile button:active{transform:translateY(2px);box-shadow:0 1px 0 #e0d3b8}
.crewzeile button:disabled{opacity:.35}
.crewzeile .zahl{min-width:74px;text-align:center}
.crewzeile .zahl b{display:block;font-family:"Baloo 2",sans-serif;font-size:27px;line-height:1}
.crewzeile .zahl small{color:var(--grau);font-size:10.5px;font-weight:700}
.segment{display:flex;gap:5px;background:var(--papier2);padding:4px;border-radius:15px;margin:8px 0}
.segment button{flex:1;padding:9px 4px;border-radius:11px;font-weight:800;font-size:12.5px;color:var(--grau);font-family:"Baloo 2",sans-serif}
.segment button[aria-pressed="true"]{background:#fff;color:var(--tinte);box-shadow:0 2px 5px #0000001a}
.leiste{height:11px;border-radius:99px;background:#e6dcc6;overflow:hidden;margin:5px 0}
.leiste i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.zeile{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--linie);font-size:13.5px}
.zeile:last-child{border:none}
.zeile b{font-variant-numeric:tabular-nums;font-family:"Baloo 2",sans-serif;font-size:15px}
.karte{background:#fff;border-radius:17px;padding:13px;margin-bottom:11px;box-shadow:0 2px 8px #0000000f}
.karte h3{font-size:16.5px;margin-bottom:2px}
.karte .ort{color:var(--grau);font-size:12px;font-weight:700;margin-bottom:6px}
.stueck{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}
.stueck span{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;color:#fff}
.stueck span.fehlt{opacity:.35;text-decoration:line-through}
.wahlgruppe{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.wahlgruppe button{background:var(--papier2);border-radius:13px;padding:10px 6px;font-weight:800;font-size:12.5px;box-shadow:0 3px 0 #e0d3b8}
.wahlgruppe button:disabled{opacity:.4}
.handel{display:flex;gap:5px}
.handel button{background:var(--papier2);border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:800;box-shadow:0 2px 0 #e0d3b8}
.handel button:disabled{opacity:.35}
.punkt{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block}

/* ---------- Ereignis ---------- */
#schleier{position:fixed;inset:0;z-index:60;background:#06202ecc;backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:18px}
#schleier[hidden]{display:none}
.dialog{background:var(--papier);border-radius:24px;width:100%;max-width:430px;
  padding:20px;box-shadow:0 20px 50px #0009;max-height:86vh;overflow-y:auto}
.dialog .art{display:inline-block;background:var(--alarm);color:#fff;border-radius:99px;
  padding:3px 12px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.dialog h2{font-size:24px;margin:9px 0 8px}
.dialog p{font-size:14px;font-weight:600;line-height:1.45;margin-bottom:15px}
.wahl{display:block;width:100%;text-align:left;background:#fff;border-radius:16px;
  padding:13px 15px;margin-bottom:9px;box-shadow:0 3px 0 #e0d3b8}
.wahl:active{transform:translateY(2px);box-shadow:0 1px 0 #e0d3b8}
.wahl b{display:block;font-family:"Baloo 2",sans-serif;font-size:15px}
.wahl small{color:var(--grau);font-size:12px;font-weight:600}

/* ---------- Meldungen ---------- */
#toasts{position:absolute;top:calc(env(safe-area-inset-top) + 52px);left:10px;width:min(48%,300px);z-index:42;
  display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#fffaf0f2;border-radius:14px;padding:8px 12px;font-size:12.5px;font-weight:700;
  box-shadow:var(--sh);animation:rein .3s cubic-bezier(.22,1,.3,1)}
.toast.gut{border-left:5px solid var(--gruen)}
.toast.warn{border-left:5px solid var(--warn)}
.toast.alarm{border-left:5px solid var(--alarm)}
.toast.geld{border-left:5px solid var(--gold)}
@keyframes rein{from{opacity:0;transform:translateY(-10px)}}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--linie)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--grau)}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
code{background:var(--papier2);padding:1px 6px;border-radius:6px;font-size:12.5px}
#seite p{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:10px}
#seite h2{font-size:18px;margin:18px 0 7px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:820px){
  #hud{padding-left:18px;padding-right:18px}
  #blatt{left:50%;transform:translate(-50%,calc(100% + 60px));width:440px}
  #blatt.auf{transform:translate(-50%,0)}
  #seite{left:50%;transform:translateX(-50%);width:560px;border-radius:20px 20px 0 0;top:64px}
}
</style>
</head>
<body>
<div id="spiel">
  <div id="sicht">
    <div id="welt"></div>
  </div>

  <div id="hud">
    <div class="pille kasse"><i>◆</i><div><small>Kasse</small><b id="h-kasse">–</b></div></div>
    <div class="pille crew"><i>☻</i><div><small>Frei</small><b id="h-crew">–</b></div></div>
    <div class="pille tag"><div><small>Tag</small><b id="h-tag">1</b></div></div>
    <div class="tempo" role="group" aria-label="Tempo">
      <button data-tempo="0" aria-pressed="false" aria-label="Pause">❚❚</button>
      <button data-tempo="1" aria-pressed="true">1×</button>
      <button data-tempo="4" aria-pressed="false">4×</button>
    </div>
  </div>

  <div id="toasts"></div>

  <div id="ebenen" role="group" aria-label="Kartenebenen">
    <button data-ebene="mine" aria-pressed="true"><i style="background:#e8b923"></i>Minen</button>
    <button data-ebene="raff" aria-pressed="true"><i style="background:#5b8f7a"></i>Werke</button>
    <button data-ebene="fab" aria-pressed="true"><i style="background:#b5703c"></i>Fabriken</button>
  </div>
  <div id="zoom">
    <button data-zoom="1" aria-label="Näher">+</button>
    <button data-zoom="-1" aria-label="Weiter weg">−</button>
  </div>

  <div id="quest" hidden>
    <div class="kopf"><span id="q-emoji">⛏️</span><span id="q-art">Aufgabe</span></div>
    <b id="q-titel"></b><small id="q-text"></small>
    <div class="fortschritt" id="q-punkte"></div>
  </div>

  <div id="seite" hidden></div>

  <nav id="dock" role="tablist">
    <button role="tab" data-seite="karte" aria-selected="true"><em>🗺</em>Karte</button>
    <button role="tab" data-seite="markt" aria-selected="false"><em>📈</em>Markt</button>
    <button role="tab" data-seite="team" aria-selected="false"><em>👥</em>Team</button>
    <button role="tab" data-seite="ziel" aria-selected="false"><em>🎯</em>Ziel</button>
    <button role="tab" data-seite="wissen" aria-selected="false"><em>📖</em>Wissen</button>
  </nav>

  <div id="blattschleier"></div>

  <div id="blatt" aria-live="polite">
    <div class="griff"></div>
    <button id="zu" aria-label="Schliessen">✕</button>
    <div class="blattinhalt" id="blattinhalt"></div>
  </div>
</div>

<div id="schleier" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="d-titel">
    <span class="art" id="d-art">Ereignis</span>
    <h2 id="d-titel"></h2>
    <p id="d-text"></p>
    <div id="d-wahlen"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   2. DATEN
   ============================================================ */

/* Materialien: Preis = CHF pro Einheit im Weltmarkt-Grundzustand.
   ausbeute = wie viel Material aus 1 Einheit Roherz entsteht.
   Je tiefer die Ausbeute, desto mehr Gestein muss bewegt werden. */

/* ---------- kleine Helfer ---------- */
const chf = n => (n<0?"−":"") + "CHF " + Math.abs(Math.round(n)).toLocaleString("de-CH");
const kurz = n => Math.abs(n)>=1e6 ? (n/1e6).toFixed(2)+" Mio" : Math.abs(n)>=1000 ? Math.round(n/1000)+"k" : Math.round(n);
const zufall = (a,b) => a + Math.random()*(b-a);
const klemm = (v,a,b) => Math.max(a, Math.min(b, v));
const monat = () => Math.floor((S.tag-1)/30) + 1;

function notiz(text, art){
  S.log.unshift({tag:S.tag, text, art:art||""});
  if (S.log.length > 60) S.log.pop();
}

/* Wie viele Arbeiter sind bereits eingeteilt? */
function belegteArbeiter(){
  let n = 0;
  for (const id in S.minen) n += S.minen[id].arbeiter;
  for (const id in S.raff)  n += S.raff[id].arbeiter;
  for (const f of S.fabriken) n += f.arbeiter;
  return n;
}
const freieArbeiter = () => S.arbeiterGesamt - belegteArbeiter();

/* Monatliche Lohnsumme */
function lohnsumme(){
  let summe = 0;
  for (const id in S.minen){
    const m = S.minen[id], def = MINEN.find(x=>x.id===id);
    summe += m.arbeiter * LAND[def.land].lohn * LOHNSTUFE[m.stufe].faktor;
  }
  for (const id in S.raff){
    const def = RAFF_ORTE.find(x=>x.id===id);
    summe += S.raff[id].arbeiter * LAND[def.land].lohn;
  }
  for (const f of S.fabriken) summe += f.arbeiter * LAND[f.land].lohn;
  // Arbeiter ohne Einteilung kosten trotzdem eine Grundpauschale
  summe += freieArbeiter() * 200;
  return summe;
}

/* Aktueller Marktpreis eines Materials */
function matPreis(k){
  const mod = S.preisMod[k];
  const f = (mod && mod.bis > S.tag) ? mod.faktor : 1;
  return MATERIAL[k].preis * f * dollarFaktor();
}
function dollarFaktor(){
  const g = S.globalMod.find(m => m.art === "dollar" && m.bis > S.tag);
  return g ? g.wert : 1;
}
function globalWert(art){
  const g = S.globalMod.find(m => m.art === art && m.bis > S.tag);
  return g ? g.wert : 1;
}

/* Nachfrage pro Tag: Grundwert × Saison × Ereignis × Ruf */
function nachfrage(p){
  const def = PRODUKT[p];
  const m = ((monat()-1) % 12) + 1;
  let saison = 1;
  if (p==="konsole" || p==="tv") saison = (m===11||m===12) ? 1.8 : (m===1||m===2 ? .75 : 1);
  if (p==="phone") saison = (m===9||m===10) ? 1.35 : 1;
  if (p==="akku")  saison = (m>=3 && m<=7) ? 1.4 : .8;
  const mod = S.nachfrageMod[p];
  const ev = (mod && mod.bis > S.tag) ? mod.faktor : 1;
  const rufF = 0.65 + (S.ruf/100) * 0.7;     // schlechter Ruf → weniger Käufer
  return def.nachfrage * saison * ev * rufF;
}

/* Verkaufspreis sinkt, wenn das Lager überquillt (Angebot > Nachfrage) */
function warenPreis(p){
  const lager = S.ware[p] || 0;
  const n = Math.max(1, nachfrage(p));
  const ueber = klemm(lager / (n*12), 0, 1);
  return PRODUKT[p].preis * (1 - 0.35*ueber) * dollarFaktor();
}

/* Handel: kaufen kostet Aufschlag, verkaufen bringt Abschlag.
   Genau deshalb lohnt es sich, selber abzubauen. */
const kaufPreis = k => matPreis(k) * 1.60;
const verkaufPreis = k => matPreis(k) * 0.75;
const HANDELSMENGE = 100;

/* ============================================================
   Der Tagesschritt – hier passiert alles.
   Reihenfolge: Zufriedenheit → Abbau → Raffination → Bau →
                Produktion → Verkauf → Monatsende → Ereignis
   ============================================================ */
function tagVor(){
  if (S.ende || modalOffen) return;
  S.tag++;

  // 1) Zufriedenheit bewegt sich langsam auf den Zielwert der Lohnstufe zu
  for (const id in S.minen){
    const m = S.minen[id], def = MINEN.find(x=>x.id===id);
    const ziel = LOHNSTUFE[m.stufe].ziel - (LAND[def.land].risiko - 1) * 8;
    m.zufriedenheit += (ziel - m.zufriedenheit) * 0.04;
    m.zufriedenheit = klemm(m.zufriedenheit, 0, 100);
  }

  // 2) Abbau: Roherz entsteht
  for (const id in S.minen){
    const m = S.minen[id], def = MINEN.find(x=>x.id===id);
    if (m.stillBis > S.tag) continue;
    let f = 1;
    if (m.malusBis > S.tag) f *= m.malus;
    f *= 0.55 + (m.zufriedenheit/100) * 0.6;          // müde, unzufriedene Leute fördern weniger
    const menge = m.arbeiter * def.ergiebigkeit * f;
    S.erz[def.mat] = (S.erz[def.mat] || 0) + menge;
  }

  // 3) Raffination: Roherz → Material
  const hafen = globalWert("hafen");
  for (const id in S.raff){
    const r = S.raff[id], def = RAFF_ORTE.find(x=>x.id===id);
    if (r.arbeiter === 0) continue;
    const rest = def.kapazitaet * (r.arbeiter / def.plaetze) * hafen;
    // Die Kapazitaet wird anteilig auf alle vorhandenen Erze verteilt,
    // damit nicht immer nur das erste Material in der Liste verarbeitet wird.
    const vorrat = Object.keys(MATERIAL).filter(k => (S.erz[k]||0) > 0.5);
    const total = vorrat.reduce((a,k) => a + S.erz[k], 0);
    if (total <= 0) continue;
    for (const k of vorrat){
      const anteil = S.erz[k] / total;
      const nimm = Math.min(S.erz[k], rest * anteil);
      S.erz[k] -= nimm;
      S.mat[k] = (S.mat[k] || 0) + nimm * MATERIAL[k].ausbeute;
    }
  }

  // 4) Fabrikbau + Produktion
  for (const f of S.fabriken){
    if (f.restbau > 0){ f.restbau--; if (f.restbau === 0) notiz(`Fabrik <b>${PRODUKT[f.produkt].name}</b> in ${LAND[f.land].name} nimmt die Produktion auf.`, "gut"); continue; }
    if (f.arbeiter === 0) continue;
    const def = PRODUKT[f.produkt];
    let stueck = Math.floor(f.arbeiter * def.proArbeiter);
    for (const k in def.rezept) stueck = Math.min(stueck, Math.floor((S.mat[k]||0) / def.rezept[k]));
    if (stueck <= 0) continue;
    for (const k in def.rezept) S.mat[k] -= stueck * def.rezept[k];
    S.ware[f.produkt] = (S.ware[f.produkt] || 0) + stueck;
  }

  // 5) Verkauf: pro Tag wird höchstens die Nachfrage abgesetzt
  for (const p in PRODUKT){
    const lager = S.ware[p] || 0;
    if (lager <= 0) continue;
    const verkauft = Math.min(lager, Math.round(nachfrage(p)));
    if (verkauft <= 0) continue;
    const erloes = verkauft * warenPreis(p);
    S.ware[p] = lager - verkauft;
    S.kasse += erloes; S.eingenommen += erloes;
  }

  // 6) Monatsende: Löhne, Betriebskosten, Ruf
  if ((S.tag - 1) % 30 === 0){
    const lohn = lohnsumme();
    const betrieb = Object.keys(S.raff).length * 9000 + S.fabriken.length * 14000;
    S.kasse -= lohn + betrieb; S.ausgegeben += lohn + betrieb;
    notiz(`🧾 Monatsabschluss: Löhne ${chf(lohn)}, Betrieb ${chf(betrieb)}.`, "geld");
    rufAnpassen();
    if (S.kasse < 0) notiz("🔻 Die Kasse ist im Minus. Ohne Gegensteuer ist die Firma bald zahlungsunfähig.", "alarm");
  }

  // 7) Marktbewegung: Preise wandern zufällig
  if (S.tag % 5 === 0) marktBewegen();

  // 8) Ereignisse
  ereignisPruefen();

  // 9) Ende der Runde?
  if (S.tag > ZIEL_TAGE || S.kasse < -800000) rundeBeenden();
  speichern();
}

function rufAnpassen(){
  let summe = 0, n = 0;
  for (const id in S.minen){ summe += LOHNSTUFE[S.minen[id].stufe].faktor; n++; }
  if (n === 0) return;
  const schnitt = summe / n;
  const ziel = schnitt < 0.85 ? 25 : schnitt < 1.15 ? 58 : 88;
  S.ruf += (ziel - S.ruf) * 0.18;
  S.ruf = klemm(S.ruf, 0, 100);
}

function marktBewegen(){
  const k = Object.keys(MATERIAL)[Math.floor(Math.random()*12)];
  const alt = S.preisMod[k] && S.preisMod[k].bis > S.tag ? S.preisMod[k].faktor : 1;
  const neu = klemm(alt * zufall(0.88, 1.14), 0.55, 2.2);
  S.preisMod[k] = {faktor:neu, bis:S.tag + 60};
}

function rundeBeenden(){
  const gewinn = S.eingenommen - S.ausgegeben;
  const geschafft = gewinn >= ZIEL_GEWINN && S.ruf >= ZIEL_RUF;
  S.ende = {gewinn, ruf:Math.round(S.ruf), geschafft};
  tempoSetzen(0);
  dialogZeigen({
    art: geschafft ? "Runde beendet" : "Runde beendet",
    titel: geschafft ? "Ziel erreicht" : "Ziel verfehlt",
    text: `Gewinn: ${chf(gewinn)} (Ziel ${chf(ZIEL_GEWINN)}) · Ruf: ${Math.round(S.ruf)} (Ziel ${ZIEL_RUF}).<br><br>`
        + (geschafft
            ? "Du hast Geld verdient <b>und</b> den Ruf gehalten. Notiere dir: welche Entscheidung hat am meisten dazu beigetragen?"
            : (gewinn >= ZIEL_GEWINN
               ? "Der Gewinn stimmt, aber der Ruf nicht. Billige Löhne haben sich kurzfristig gelohnt und langfristig gerächt."
               : "Der Gewinn reicht nicht. Wo ist die Lieferkette gerissen – zu wenig Erz, zu wenig Raffination oder zu wenig Nachfrage?")),
    wahlen:[{text:"Neue Runde starten", klein:"Alles auf Anfang", tun:()=>{ zuruecksetzen(); }}]
  });
}

function ereignisPruefen(){
  if (S.tag < 15 || S.tag % 3 !== 0) return;
  // Zwingende Ereignisse (Protest, Unfall, Reportage) zuerst
  for (const e of EREIGNISSE){
    if (e.gewicht !== 0) continue;
    if (e.einmalig && S.erledigt[e.id]) continue;
    if (S.erledigt["cool_"+e.id] > S.tag) continue;
    if (!e.passt()) continue;
    S.erledigt[e.id] = true; S.erledigt["cool_"+e.id] = S.tag + 90;
    dialogZeigen(e.bau());
    return;
  }
  // Zufällige Ereignisse
  if (Math.random() > 0.10) return;
  const pool = EREIGNISSE.filter(e => e.gewicht > 0 && !(e.einmalig && S.erledigt[e.id]) && e.passt() && (S.erledigt["cool_"+e.id]||0) <= S.tag);
  if (!pool.length) return;
  const gesamt = pool.reduce((a,e)=>a+e.gewicht, 0);
  let w = Math.random()*gesamt, gewaehlt = pool[0];
  for (const e of pool){ w -= e.gewicht; if (w <= 0){ gewaehlt = e; break; } }
  S.erledigt[gewaehlt.id] = true; S.erledigt["cool_"+gewaehlt.id] = S.tag + 120;
  const erg = gewaehlt.bau();
  if (erg.passiv) notiz(erg.text, erg.art);
  else dialogZeigen(erg);
}

};

const KARTE_B = 1000, KARTE_H = 560;
const geo = ([lon,lat]) => [ (lon+180)/360*KARTE_B, (78-lat)/138*KARTE_H ];

/* Pins duerfen sich nicht ueberdecken: die Rohposition wird solange leicht
   auseinandergeschoben, bis alle mindestens PIN_ABSTAND auseinander liegen.
   Die Standorte bleiben dadurch ungefaehr, aber tippbar. */
const PIN_ABSTAND = 62;
const POS = {};
(function pinsEntzerren(){
  for (const k in ORT) POS[k] = geo(ORT[k]);
  const ids = Object.keys(POS);
  for (let runde = 0; runde < 120; runde++){
    let bewegt = false;
    for (let i = 0; i < ids.length; i++) for (let j = i+1; j < ids.length; j++){
      const a = POS[ids[i]], b = POS[ids[j]];
      let dx = b[0]-a[0], dy = b[1]-a[1];
      let d = Math.hypot(dx, dy);
      if (d >= PIN_ABSTAND) continue;
      if (d < 0.01){ dx = Math.random()-0.5; dy = Math.random()-0.5; d = 1; }
      const schub = (PIN_ABSTAND - d) / 2 / d;
      a[0] -= dx*schub; a[1] -= dy*schub;
      b[0] += dx*schub; b[1] += dy*schub;
      bewegt = true;
    }
    // Federkraft zurueck zum echten Ort: die Karte bleibt so nah wie moeglich an der Geografie
    for (const k of ids){
      const z = geo(ORT[k]);
      POS[k][0] += (z[0]-POS[k][0])*0.10;
      POS[k][1] += (z[1]-POS[k][1])*0.10;
    }
    if (!bewegt) break;
  }
  for (const k in POS){
    POS[k][0] = Math.max(22, Math.min(KARTE_B-22, POS[k][0]));
    POS[k][1] = Math.max(26, Math.min(KARTE_H-14, POS[k][1]));
  }
})();
const px = id => POS[id];

/* Duenne Linie vom echten Ort zum verschobenen Pin, damit die Geografie stimmt */
function ankerLinien(){
  return Object.keys(ORT).map(k => {
    const [gx,gy] = geo(ORT[k]), [pxx,pyy] = POS[k];
    if (Math.hypot(gx-pxx, gy-pyy) < 6) return "";
    return `<line x1="${gx.toFixed(1)}" y1="${gy.toFixed(1)}" x2="${pxx.toFixed(1)}" y2="${pyy.toFixed(1)}"
      stroke="#00000030" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="2.2" fill="#00000045"/>`;
  }).join("");
}

function ansichtAnwenden(){
  const b = sicht.clientWidth, hh = sicht.clientHeight;
  const zmin = Math.max(b/KARTE_B, 0.95), zmax = 4.5;
  ansicht.z = Math.min(zmax, Math.max(zmin, ansicht.z));
  const bb = KARTE_B*ansicht.z, bh = KARTE_H*ansicht.z;
  ansicht.x = bb <= b ? (b-bb)/2 : Math.min(0, Math.max(b-bb, ansicht.x));
  ansicht.y = bh <= hh ? (hh-bh)/2 : Math.min(0, Math.max(hh-bh, ansicht.y));
  welt.style.transform = `translate(${ansicht.x}px,${ansicht.y}px) scale(${ansicht.z})`;
  pinGroesse();
}

/* Pins behalten ihre Bildschirmgroesse, schrumpfen aber leicht beim Herauszoomen. */
function pinGroesse(){
  const k = Math.max(0.62, Math.min(1, 0.45 + ansicht.z*0.55));
  const s = k / ansicht.z;
  welt.classList.toggle("weit", ansicht.z < 0.99);
  document.querySelectorAll(".pin").forEach(p => p.style.transform = `translate(-50%,-100%) scale(${s})`);
}

function zoomUm(f, mx, my){
  const b = sicht.clientWidth, hh = sicht.clientHeight;
  mx = mx ?? b/2; my = my ?? hh/2;
  const alt = ansicht.z, neu = alt*f;
  ansicht.x = mx - (mx-ansicht.x)*(neu/alt);
  ansicht.y = my - (my-ansicht.y)*(neu/alt);
  ansicht.z = neu; ansichtAnwenden();
}

/* ---------- Ziehen und Zoomen ---------- */
(function steuerung(){
  const zeiger = new Map();
  let start = null, bewegt = 0, gefangen = false;
  sicht.addEventListener("pointerdown", e => {
    zeiger.set(e.pointerId, {x:e.clientX, y:e.clientY});
    // Erst greifen, wenn wirklich gezogen wird – sonst schluckt der Zeigerfang die Tipps auf Pins.
    if (zeiger.size === 1){ start = {x:e.clientX-ansicht.x, y:e.clientY-ansicht.y}; bewegt = 0; gefangen = false; }
  });
  sicht.addEventListener("pointermove", e => {
    if (!zeiger.has(e.pointerId)) return;
    const vor = zeiger.get(e.pointerId);
    zeiger.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (zeiger.size === 2){
      const [a,b] = [...zeiger.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (steuerung.dist) zoomUm(d/steuerung.dist, (a.x+b.x)/2, (a.y+b.y)/2);
      steuerung.dist = d; return;
    }
    if (!start) return;
    bewegt += Math.abs(e.clientX-vor.x) + Math.abs(e.clientY-vor.y);
    if (bewegt < 9) return;
    if (!gefangen){ gefangen = true; sicht.classList.add("zieht");
      try { sicht.setPointerCapture(e.pointerId); } catch(err){} }
    ansicht.x = e.clientX - start.x; ansicht.y = e.clientY - start.y;
    ansichtAnwenden();
  });
  const ende = e => { zeiger.delete(e.pointerId); if (zeiger.size < 2) steuerung.dist = null;
    if (!zeiger.size){ start = null; gefangen = false; sicht.classList.remove("zieht"); } };
  sicht.addEventListener("pointerup", ende);
  sicht.addEventListener("pointercancel", ende);
  sicht.addEventListener("wheel", e => { e.preventDefault();
    zoomUm(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});
  window.addEventListener("resize", ansichtAnwenden);
})();

/* ---------- Pins ---------- */
function pinsZeichnen(){
  const teile = [];
  const ziel = typeof hinweisZiel === "function" ? hinweisZiel() : null;
  const winkt = (art, offen) => {
    if (!ziel) return "";
    if (ziel === art + "-frei"  && !offen) return "wink";
    if (ziel === "meine-" + art &&  offen) return "wink";
    if (ziel.startsWith("dock:")) return "";
    return "blass";
  };

  if (ebenen.mine) for (const def of MINEN){
    const [x,y] = px(def.id);
    const m = S.minen[def.id], mat = MATERIAL[def.mat];
    const streik = m && m.stillBis > S.tag;
    teile.push(`<button class="pin ${m?"":"zu"} ${streik?"alarm":""} ${winkt("minen", !!m)}" data-pin="mine" data-id="${def.id}"
      style="left:${x}px;top:${y}px" aria-label="Mine ${def.ort}">
      <span class="knopf" style="${m?`background:${mat.farbe};color:#fff`:""}">${m?mat.sym:"+"}
        ${m&&m.arbeiter?`<span class="crew">${m.arbeiter}</span>`:""}</span>
      <span class="bez">${LAND[def.land].flagge} ${def.ort}</span></button>`);
  }

  if (ebenen.raff) for (const def of RAFF_ORTE){
    const [x,y] = px(def.id);
    const r = S.raff[def.id];
    teile.push(`<button class="pin werk ${r?"":"zu"} ${winkt("raff", !!r)}" data-pin="raff" data-id="${def.id}"
      style="left:${x}px;top:${y}px" aria-label="Raffinerie ${def.ort}">
      <span class="knopf" style="${r?"background:#5b8f7a;color:#fff":""}">🧪
        ${r&&r.arbeiter?`<span class="crew">${r.arbeiter}</span>`:""}</span>
      <span class="bez">${LAND[def.land].flagge} ${def.ort}</span></button>`);
  }

  if (ebenen.fab) for (const land of FAB_ORTE){
    const [x,y] = px("f_"+land);
    const meine = S.fabriken.filter(f => f.land === land);
    const crew = meine.reduce((a,f)=>a+f.arbeiter, 0);
    teile.push(`<button class="pin werk ${meine.length?"":"zu"} ${winkt("fab", !!meine.length)}" data-pin="fab" data-id="${land}"
      style="left:${x}px;top:${y}px" aria-label="Fabrikstandort ${LAND[land].name}">
      <span class="knopf" style="${meine.length?"background:#b5703c;color:#fff":""}">🏭
        ${crew?`<span class="crew">${crew}</span>`:""}</span>
      <span class="bez">${LAND[land].flagge} ${LAND[land].name}</span></button>`);
  }

  welt.querySelectorAll(".pin").forEach(p => p.remove());
  welt.insertAdjacentHTML("beforeend", teile.join(""));
  pinGroesse();
}

/* Karte auf einen Ort zentrieren, damit man nach dem Bauen sieht, wo es passiert ist. */
function zeigeAuf(id, z){
  const [mx,my] = px(id);
  ansicht.z = z || Math.max(ansicht.z, 1.6);
  ansicht.x = sicht.clientWidth/2 - mx*ansicht.z;
  ansicht.y = sicht.clientHeight/2 - my*ansicht.z;
  ansichtAnwenden();
}

/* Während des Tutorials darf von jeder Sorte nur ein Standort gekauft werden. */
function gesperrt(art){
  if (!tutorialLaeuft()) return false;
  if (art === "mine") return Object.keys(S.minen).length > 0;
  if (art === "raff") return Object.keys(S.raff).length > 0;
  if (art === "fab")  return S.fabriken.length > 0;
  return false;
}

function tutorialPruefen(){
  while (tutorialLaeuft() && TUTORIAL[S.tutorial].fertig()){

    notiz(tutorialLaeuft() ? "✅ Erledigt: " + erledigt.titel

/* ---------- Toasts statt Logliste ---------- */
const gezeigt = new Set();
function toastsErneuern(){
  const neu = S.log.filter(e => !gezeigt.has(e.tag + e.text)).slice(0, 2).reverse();
  for (const e of neu){
    gezeigt.add(e.tag + e.text);
    const d = document.createElement("div");
    d.className = "toast " + (e.art || "");
    d.innerHTML = e.text;
    $("#toasts").appendChild(d);
    setTimeout(() => { d.style.transition = "opacity .4s"; d.style.opacity = 0;
      setTimeout(()=>d.remove(), 400); }, 4200);
  }
  while ($("#toasts").children.length > 2) $("#toasts").firstChild.remove();
}

/* ---------- Wegweiser ---------- */
function naechsterSchritt(){
  const minen = Object.keys(S.minen);
  if (!minen.length) return ["Eröffne deine erste Mine", "Tippe auf einen hellen Pin. Günstig sind Boké, Katanga und Kolwezi."];
  if (minen.every(id => S.minen[id].arbeiter === 0)) return ["Schick Leute in die Mine", "Ohne Arbeiter wird nichts gefördert."];
  const gefahr = minen.find(id => S.minen[id].zufriedenheit < 35 && S.minen[id].arbeiter > 0);
  if (gefahr) return ["Streikgefahr in " + MINEN.find(x=>x.id===gefahr).ort, "Zufriedenheit unter 35 %. Erhöh dort den Lohn."];
  if (!Object.keys(S.raff).length) return ["Bau eine Raffinerie", "Roherz allein nützt nichts. Erst die Raffinerie macht Material daraus."];
  const kapa = Object.keys(S.raff).reduce((a,id)=>{ const d=RAFF_ORTE.find(x=>x.id===id); return a + d.kapazitaet*(S.raff[id].arbeiter/d.plaetze); }, 0);
  if (kapa === 0) return ["Die Raffinerie steht still", "Schick Arbeiter hin, sonst stapelt sich dein Erz."];
  if (Object.values(S.erz).reduce((a,b)=>a+b,0) > kapa*5) return ["Deine Raffinerie kommt nicht nach", "Mehr Arbeiter dort – oder eine zweite bauen."];
  if (!S.fabriken.length) return ["Bau deine erste Fabrik", "Tippe auf einen Fabrik-Pin. Das Mainboard braucht am wenigsten Materialien."];
  const leer = S.fabriken.findIndex(f => f.restbau === 0 && f.arbeiter === 0);
  if (leer >= 0) return ["Deine Fabrik hat keine Leute", "Sie ist fertig, produziert aber nichts."];
  for (const f of S.fabriken){
    if (f.restbau > 0) continue;
    const fehlt = Object.keys(PRODUKT[f.produkt].rezept).filter(k => (S.mat[k]||0) < PRODUKT[f.produkt].rezept[k]*3);
    if (fehlt.length) return ["Es fehlt " + fehlt.map(k=>MATERIAL[k].name).join(", "),
      "Passende Mine eröffnen – oder im Markt zukaufen (60 % Aufschlag)."];
  }
  if (freieArbeiter() > 15) return [freieArbeiter() + " Leute ohne Aufgabe", "Sie kosten trotzdem Lohn. Einteilen oder entlassen."];
  if (S.ruf < 55) return ["Dein Ruf ist tief", "Das senkt die Nachfrage nach allen Produkten. Prüf die Löhne."];
  return null;
}


/* Zeigt entweder die Tutorial-Aufgabe oder danach den Wegweiser. */
function questZeichnen(){
  const k = $("#quest");
  const t = tutorialSchritt();
  k.classList.toggle("unten", aktiveSeite !== "karte");
  if (t){
    $("#q-emoji").textContent = t.emoji;
    $("#q-art").textContent = `Aufgabe ${S.tutorial+1}/${TUTORIAL.length}`;
    $("#q-titel").textContent = t.titel;
    $("#q-text").textContent = t.text;
    $("#q-punkte").innerHTML = TUTORIAL.map((_,i) =>
      `<i class="${i < S.tutorial ? "ok" : i === S.tutorial ? "jetzt" : ""}"></i>`).join("");
    k.hidden = false;
    return;
  }
  const w = naechsterSchritt();
  if (!w || offenesBlatt){ k.hidden = true; return; }
  $("#q-emoji").textContent = "➜";
  $("#q-art").textContent = "Nächster Schritt";
  $("#q-titel").textContent = w[0];
  $("#q-text").textContent = w[1];
  $("#q-punkte").innerHTML = "";
  k.hidden = false;
}

    const geht = S.kasse >= def.erschliessung && !zu;
    return kopf + (zu ? `<div class="notiz">🔒 Im Tutorial eröffnest du zuerst nur <b>eine</b> Mine. Danach werden alle Standorte frei.</div>` : "") + `
      <div class="werte">

  }

  const st = LOHNSTUFE[m.stufe], zuf = Math.round(m.zufriedenheit);
  const farbe = zuf < 32 ? "var(--alarm)" : zuf < 60 ? "var(--warn)" : "var(--gruen)";
  const still = m.stillBis > S.tag;
  const ertrag = still ? 0 : m.arbeiter * def.ergiebigkeit * (0.55 + zuf/100*0.6) * (m.malusBis>S.tag ? m.malus : 1);
  return kopf +

/* ---------- Blatt: Fabrikstandort ---------- */
function blattFab(land){
  const meine = S.fabriken.map((f,i)=>({f,i})).filter(o => o.f.land === land);
  const kopf = `<div class="titelzeile"><span class="flagge">${LAND[land].flagge}</span>
    <div><h2>${LAND[land].name}</h2><div class="ort">Fabrikstandort · Lohn ${chf(LAND[land].lohn)}/Monat</div></div></div>`;

  const laufend = meine.map(({f,i}) => {
    const def = PRODUKT[f.produkt];
    if (f.restbau > 0) return `<div class="karte"><h3>${def.name}</h3>
      <div class="ort">Im Bau – noch ${f.restbau} Tage</div>
      <div class="leiste"><i style="width:${100-f.restbau/def.bauzeit*100}%;background:var(--gold)"></i></div></div>`;
    let stueck = Math.floor(f.arbeiter * def.proArbeiter);
    for (const k in def.rezept) stueck = Math.min(stueck, Math.floor((S.mat[k]||0)/def.rezept[k]));
    const fehlt = Object.keys(def.rezept).filter(k => (S.mat[k]||0) < def.rezept[k]);
    return `<div class="karte"><h3>${def.name}</h3>
      <div class="ort">Verkaufspreis ${chf(warenPreis(f.produkt))} · Nachfrage ${Math.round(nachfrage(f.produkt))}/Tag</div>
      <div class="stueck">${Object.keys(def.rezept).map(k =>
        `<span class="${fehlt.includes(k)?"fehlt":""}" style="background:${MATERIAL[k].farbe}">${MATERIAL[k].sym} ${def.rezept[k]}</span>`).join("")}</div>
      <div class="crewzeile">
        <button data-tun="fcrew" data-i="${i}" data-n="-5" ${f.arbeiter<=0?"disabled":""}>−5</button>
        <button data-tun="fcrew" data-i="${i}" data-n="-1" ${f.arbeiter<=0?"disabled":""}>−</button>
        <div class="zahl"><b>${f.arbeiter}</b><small>von ${def.plaetze}</small></div>
        <button data-tun="fcrew" data-i="${i}" data-n="1" ${(freieArbeiter()<=0||f.arbeiter>=def.plaetze)?"disabled":""}>+</button>
        <button data-tun="fcrew" data-i="${i}" data-n="5" ${(freieArbeiter()<=0||f.arbeiter>=def.plaetze)?"disabled":""}>+5</button>
      </div>
      <div class="zeile"><span>Produktion heute</span><b>${stueck} Stück</b></div>
      ${fehlt.length ? `<div class="notiz rot">Es fehlt: ${fehlt.map(k=>MATERIAL[k].name).join(", ")}</div>` : ""}</div>`;
  }).join("");

  const zu = gesperrt("fab");
  const neu = Object.keys(PRODUKT).map(p => {
    const def = PRODUKT[p], geht = S.kasse >= def.kosten && !zu;
    return `<div class="karte"><h3>${def.name}</h3>
      <div class="ort">${chf(def.preis)} · Bauzeit ${def.bauzeit} Tage</div>
      <div class="stueck">${Object.keys(def.rezept).map(k =>
        `<span style="background:${MATERIAL[k].farbe}">${MATERIAL[k].sym} ${def.rezept[k]}</span>`).join("")}</div>
      <div class="notiz">${def.info}</div>
      <button class="cta gruen" data-tun="fab-bau" data-p="${p}" data-l="${land}" ${geht?"":"disabled"}>
        ${zu ? SPERRTEXT : geht ? "Hier bauen · " + chf(def.kosten) : "Zu wenig Geld · " + chf(def.kosten)}</button></div>`;
  }).join("");

  return kopf + laufend + (zu ? `<div class="notiz">🔒 Im Tutorial baust du zuerst nur <b>eine</b> Fabrik.</div>` : "")
    + `<h3 style="margin:16px 0 8px">Neue Produktlinie</h3>` + neu;
}

let blattStand = "";

  offenesBlatt = {art, id};

function dialogZeigen(e){
  modalOffen = true;
  $("#d-art").textContent = e.art || "Ereignis";
  $("#d-titel").textContent = e.titel || "";
  $("#d-text").innerHTML = e.text || "";
  $("#d-wahlen").innerHTML = "";

    b.className = "wahl";

    b.onclick = () => { w.tun(); S.ruf = klemm(S.ruf,0,100);
      modalOffen = false; $("#schleier").hidden = true; speichern(); zeichnen(); };

/* ---------- Steuerung ---------- */
document.addEventListener("click", e => {
  if (e.target.id === "zu" || e.target.id === "blattschleier"){ blattZu(); return; }

  const pin = e.target.closest(".pin");
  if (pin){ blattFuellen(pin.dataset.pin, pin.dataset.id); return; }

  const eb = e.target.closest("[data-ebene]");
  if (eb){ const k = eb.dataset.ebene; ebenen[k] = !ebenen[k];
    eb.setAttribute("aria-pressed", ebenen[k]); pinsZeichnen(); return; }

  const zo = e.target.closest("[data-zoom]");
  if (zo){ zoomUm(+zo.dataset.zoom > 0 ? 1.5 : 1/1.5); return; }

  const tm = e.target.closest("[data-tempo]");
  if (tm){ tempoSetzen(+tm.dataset.tempo); return; }

  const sb = e.target.closest("[data-seite]");
  if (sb){
    aktiveSeite = sb.dataset.seite; blattZu();
    document.querySelectorAll("[data-seite]").forEach(b => b.setAttribute("aria-selected", b.dataset.seite === aktiveSeite));
    seite.hidden = aktiveSeite === "karte";
    if (!seite.hidden){ seiteFuellen(aktiveSeite); seite.scrollTop = 0; }
    zeichnen(); return;
  }

  const t = e.target.closest("[data-tun]");
  if (!t){ if (!e.target.closest("#blatt") && !e.target.closest("#seite")) blattZu(); return; }
  const id = t.dataset.id, n = +t.dataset.n;

  switch (t.dataset.tun){
    case "mine-auf": {
      const def = MINEN.find(x=>x.id===id);
      if (S.kasse < def.erschliessung || gesperrt("mine")) return;
      S.kasse -= def.erschliessung; S.ausgegeben += def.erschliessung;
      S.minen[id] = {arbeiter:0, stufe:1, zufriedenheit:55, stillBis:0, malus:1, malusBis:0};
      notiz(`⛏️ Mine <b>${def.ort}</b> eröffnet. Jetzt Leute hinschicken.`, "gut");
      zeigeAuf(id); break; }
    case "crew": {
      const def = MINEN.find(x=>x.id===id), m = S.minen[id];
      m.arbeiter = Math.max(0, Math.min(def.plaetze, m.arbeiter + Math.min(n, n>0?freieArbeiter():n)));
      break; }
    case "lohn": {
      const neu = +t.dataset.stufe;
      if (neu < S.minen[id].stufe && S.minen[id].zufriedenheit > 70) S.minen[id].zufriedenheit -= 12;
      S.minen[id].stufe = neu; break; }
    case "raff-bau": {
      const def = RAFF_ORTE.find(x=>x.id===id);
      if (S.kasse < def.bau || gesperrt("raff")) return;
      S.kasse -= def.bau; S.ausgegeben += def.bau; S.raff[id] = {arbeiter:0};
      notiz(`🧪 Raffinerie <b>${def.ort}</b> gebaut.`, "gut"); zeigeAuf(id); break; }
    case "rcrew": {
      const def = RAFF_ORTE.find(x=>x.id===id), r = S.raff[id];
      r.arbeiter = Math.max(0, Math.min(def.plaetze, r.arbeiter + Math.min(n, n>0?freieArbeiter():n)));
      break; }
    case "fab-bau": {
      const p = t.dataset.p, l = t.dataset.l, def = PRODUKT[p];
      if (S.kasse < def.kosten || gesperrt("fab")) return;
      S.kasse -= def.kosten; S.ausgegeben += def.kosten;
      S.fabriken.push({produkt:p, land:l, arbeiter:0, restbau:def.bauzeit});
      notiz(`🏭 Fabrik für <b>${def.name}</b> in ${LAND[l].name} – fertig in ${def.bauzeit} Tagen.`, "geld"); break; }
    case "fcrew": {
      const i = +t.dataset.i, f = S.fabriken[i], def = PRODUKT[f.produkt];
      f.arbeiter = Math.max(0, Math.min(def.plaetze, f.arbeiter + Math.min(n, n>0?freieArbeiter():n)));
      break; }
    case "anstellen":
      if (S.kasse < 18000) return;
      S.kasse -= 18000; S.ausgegeben += 18000; S.arbeiterGesamt += 10;
      notiz("👥 10 Leute angestellt.", "geld"); break;
    case "entlassen":
      if (freieArbeiter() >= 10){ S.arbeiterGesamt -= 10; notiz("👋 10 Leute entlassen.", "warn"); } break;
    case "kaufen": {
      const k = t.dataset.k, summe = kaufPreis(k)*HANDELSMENGE;
      if (S.kasse < summe) return;
      S.kasse -= summe; S.ausgegeben += summe; S.mat[k] = (S.mat[k]||0) + HANDELSMENGE; S.gekauft = true;
      notiz(`📦 ${HANDELSMENGE} ${MATERIAL[k].name} zugekauft für ${chf(summe)}.`, "geld"); break; }
    case "verkaufen": {
      const k = t.dataset.k, summe = verkaufPreis(k)*HANDELSMENGE;
      if ((S.mat[k]||0) < HANDELSMENGE) return;
      S.mat[k] -= HANDELSMENGE; S.kasse += summe; S.eingenommen += summe;
      notiz(`💸 ${HANDELSMENGE} ${MATERIAL[k].name} verkauft für ${chf(summe)}.`, "geld"); break; }
    case "reset":
      if (confirm("Neue Runde starten? Der bisherige Verlauf geht verloren.")) zuruecksetzen();
      return;
  }
  tutorialPruefen(); speichern(); zeichnen();
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" && !modalOffen && e.target === document.body){
    e.preventDefault(); tempoSetzen(tempo > 0 ? 0 : 1); }
  if (e.key === "Escape") blattZu();
});

/* ---------- Uhr ---------- */
function tempoSetzen(v){
  tempo = v;
  document.querySelectorAll("[data-tempo]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.tempo === v));
  if (takt) clearInterval(takt);
  if (v > 0) takt = setInterval(() => { tagVor(); tutorialPruefen(); zeichnen(); }, 1400/v);
}

  try { const roh = SPEICHER.lies("erzwelt_v1"); if (!roh) return false;
    const g = JSON.parse(roh); if (!g || typeof g.tag !== "number") return false;
    S = Object.assign(neuerZustand(), g); return true;
  } catch(e){ return false; }
}
function zuruecksetzen(){
  SPEICHER.loesch("erzwelt_v1"); S = neuerZustand();

  tempoSetzen(1); zeigeAuf("obuasi", 1.15); zeichnen();
}
