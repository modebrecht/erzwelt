<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b3648">
<title>Erzwelt — Rohstoffe &amp; Lieferketten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   ERZWELT — Rohstoffe & Lieferketten
   Aufbau: 1 CSS · 2 DATEN · 3 FLAGGEN · 4 IKONEN
           5 MOTOR · 6 KARTE · 7 ANZEIGE
   ========================================================== */
:root{
  --meer1:#14587a; --meer2:#0a2f42; --land:#e6d6ae; --landlinie:#b49f73;
  --papier:#fffaf0; --papier2:#f4ead6; --tinte:#241c14; --grau:#6b5f50;
  --gold:#f5b73d; --gold2:#d9971a; --gruen:#2fbe7e; --alarm:#e0504a; --warn:#f08c2e;
  --dunkel:#0e2b3c; --linie:#e3d7bf;
  --sh:0 4px 0 rgba(0,0,0,.14), 0 8px 20px rgba(0,0,0,.18);

  /* Schrift-Skala: --fs kommt aus den Einstellungen (Regler).
     Kleinste Schrift im ganzen Spiel ist --f0 = 12px × Skala. */
  --fs:1.06;
  --f0:calc(12px * var(--fs));
  --f1:calc(13.5px * var(--fs));
  --f2:calc(15px * var(--fs));
  --f3:calc(17px * var(--fs));
  --f4:calc(19.5px * var(--fs));
  --f5:calc(23px * var(--fs));
  --f6:calc(28px * var(--fs));

  --dockh:86px;   /* wird in JS gemessen */
  --hudh:56px;
  --questh:0px;   /* Höhe des Aufgabenkastens, wenn eine Seite offen ist */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:Nunito,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:600; color:var(--tinte); background:var(--meer2);
  font-size:var(--f2); line-height:1.4; overscroll-behavior:none;
  user-select:none; -webkit-user-select:none;
}
h1,h2,h3,.disp{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}

/* ---------- Bühne ---------- */
#spiel{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:30;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(#0a2f42f2,#0a2f4200);pointer-events:none
}
.pille{
  display:flex;align-items:center;gap:7px;pointer-events:auto;
  background:#0b3648ee;border:2px solid #ffffff2e;border-radius:99px;
  padding:5px 12px 5px 7px;color:#fff;box-shadow:0 3px 0 #00000030
}
.pille i{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-style:normal;flex:none}
.pille i svg{width:16px;height:16px}
.pille b{font-family:"Baloo 2",sans-serif;font-size:var(--f2);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pille small{font-size:var(--f0);opacity:.75;display:block;line-height:1;margin-bottom:2px;letter-spacing:.04em}
.pille.kasse{cursor:pointer;text-align:left}
.pille.kasse:active{transform:translateY(2px)}
.pille.kasse i{background:var(--gold);color:#5a3c00}
.pille .lupezeichen{width:16px;height:16px;border-radius:50%;border:2px solid #ffffff66;
  display:grid;place-items:center;flex:none;margin-left:2px}
.pille .lupezeichen::after{content:"";width:0;height:0;border:4px solid transparent;
  border-top:5px solid #ffffffcc;margin-top:3px}
/* Kassenbuch */
.buchtabelle{width:100%;border-collapse:collapse;font-size:var(--f1);display:table}
.buchtabelle th{font-size:var(--f0);text-transform:uppercase;letter-spacing:.04em;color:var(--grau);
  text-align:right;padding:8px 4px;border-bottom:1px solid var(--linie)}
.buchtabelle th:first-child{text-align:left}
.buchtabelle td{padding:8px 4px;border-bottom:1px solid var(--linie);text-align:right;
  font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.buchtabelle td:first-child{text-align:left;font-weight:600;white-space:normal}
.buchtabelle tr.summe td{border-top:2px solid var(--tinte);border-bottom:none;
  font-family:"Baloo 2",sans-serif;font-size:var(--f2);padding-top:11px}
.buchtabelle .ein{color:#0f7a4f}
.buchtabelle .aus{color:#b8443e}
.buchpunkt{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:7px}
.pille.crew i{background:#6fb8e0;color:#0a3a55}
.pille.tag i{background:#ffffff26;color:#fff}
.hudrechts{margin-left:auto;display:flex;gap:5px;pointer-events:auto;align-items:center}
.tempo{display:flex;gap:4px}
.tempo button,.hudknopf{
  min-width:40px;height:40px;padding:0 8px;border-radius:13px;background:#0b3648ee;border:2px solid #ffffff2e;
  color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:var(--f1);
  display:grid;place-items:center;box-shadow:0 3px 0 #00000030
}
.hudknopf svg{width:21px;height:21px}
.tempo button[aria-pressed="true"]{background:var(--gold);color:#4a3000;border-color:#fff6}

/* ---------- Karte ---------- */
#sicht{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(120% 80% at 50% 10%, var(--meer1) 0%, var(--meer2) 70%);
  touch-action:none;cursor:grab}
#sicht.zieht{cursor:grabbing}
#welt{position:absolute;top:0;left:0;width:1000px;height:560px;transform-origin:0 0}
#welt svg.weltkarte{display:block;width:1000px;height:560px;background:none}
.land{fill:var(--land);stroke:var(--landlinie);stroke-width:1.5;stroke-linejoin:round}
.gitter{stroke:#ffffff14;stroke-width:1;fill:none}

/* ---------- Flaggen ---------- */
.fl{width:1.7em;height:calc(1.7em * .667);border-radius:2.5px;flex:none;
  box-shadow:0 0 0 1px #00000030, 0 1px 2px #00000030;background:#fff}
.fl.gross{width:2.9em;height:calc(2.9em * .667);border-radius:4px}
.fl.mini{width:1.35em;height:calc(1.35em * .667)}
.flz{display:inline-flex;align-items:center;gap:.4em;vertical-align:middle}

/* ---------- Pins ---------- */
.pin{
  position:absolute;transform-origin:50% 100%;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))
}
.knopf{
  width:42px;height:42px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;
  display:grid;place-items:center;position:relative;
  background:#f7f1e2;border:3px solid #fff;font-size:15px;font-weight:800;
  font-family:"Baloo 2",sans-serif;color:#3a2d1c
}
.knopf svg{width:21px;height:21px}
.knopf .sym{display:block;line-height:1}
.knopf::after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top:8px solid #fff}
.pin.zu .knopf{background:#fbf7ee;border-color:#8b7a5e;color:#6d5e46;border-width:2.5px}
.pin.zu .knopf::after{border-top-color:#8b7a5e}
.pin .bez{
  font-size:11px;font-weight:800;color:#fff;background:#0b3648ef;
  padding:2px 7px 2px 4px;border-radius:99px;white-space:nowrap;margin-top:7px;
  font-family:"Baloo 2",sans-serif;pointer-events:none;position:relative;z-index:1;
  display:flex;align-items:center;gap:4px
}
.pin .bez .fl{width:15px;height:10px}
.pin .knopf{position:relative;z-index:2}
.pin .crew{
  position:absolute;top:-7px;right:-9px;background:#6fb8e0;color:#06263a;
  border:2px solid #fff;border-radius:99px;font-size:11px;font-weight:800;
  padding:0 5px;min-width:20px;text-align:center;font-family:"Baloo 2",sans-serif}
.pin.werk .knopf{border-radius:13px}
.pin.werk .knopf::after{border-top-color:#fff}
.pin.alarm .knopf{border-color:var(--alarm);animation:puls 1s infinite}
.pin.alarm .bez{background:var(--alarm)}
@keyframes puls{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#welt.weit .pin .bez{display:none}
.pin:active{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
/* Mine fördert gerade: Hacke wippt, Staub steigt */
.pin.foerdert .knopf > svg,.pin.foerdert .knopf > span.sym{animation:wippen 1.5s ease-in-out infinite}
@keyframes wippen{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-3px) rotate(-9deg)}70%{transform:translateY(1px) rotate(3deg)}}
.pin .staub{position:absolute;left:50%;top:6px;width:7px;height:7px;border-radius:50%;
  background:#ffffffb0;opacity:0;pointer-events:none}
.pin.foerdert .staub{animation:staub 1.5s ease-out infinite}
.pin.foerdert .staub.b{animation-delay:.5s}
.pin.foerdert .staub.c{animation-delay:1s}
@keyframes staub{0%{opacity:0;transform:translate(-50%,0) scale(.5)}
  25%{opacity:.85}100%{opacity:0;transform:translate(-160%,-20px) scale(1.5)}}
/* ---------- Leben auf der Karte: aktive Standorte bewegen sich ---------- */
/* Minenarbeiter laufen neben der Mine hin und her und verschwinden
   kurz hinter dem Stolleneingang */
.pin .treiben{position:absolute;left:50%;top:6px;width:104px;height:34px;margin-left:-52px;
  pointer-events:none;z-index:0}
.pin .laeufer{position:absolute;bottom:0;left:0;width:22px;height:32px;opacity:.97;
  filter:drop-shadow(0 1px 1px #0003)}
.pin .laeufer svg{width:22px;height:32px}
#welt.weit .pin .treiben{display:none}
body[data-anim="1"] .pin .laeufer,body[data-anim="2"] .pin .laeufer{animation:patrouille 7s ease-in-out infinite}
.pin .laeufer.l1{animation-delay:-2.4s}
.pin .laeufer.l2{animation-delay:-4.8s}
@keyframes patrouille{
  0%   {transform:translateX(0) scaleX(1)}
  46%  {transform:translateX(82px) scaleX(1)}
  50%  {transform:translateX(82px) scaleX(-1)}
  96%  {transform:translateX(0) scaleX(-1)}
  100% {transform:translateX(0) scaleX(1)}}
/* Raffinerie blubbert */
.pin .blubb{position:absolute;left:50%;top:2px;width:6px;height:6px;border-radius:50%;
  background:#ffffffcc;opacity:0;pointer-events:none}
body[data-anim="1"] .pin.kocht .blubb,body[data-anim="2"] .pin.kocht .blubb{animation:blubbauf 2.4s ease-out infinite}
.pin .blubb.b{animation-delay:.8s;left:38%}
.pin .blubb.c{animation-delay:1.6s;left:62%}
@keyframes blubbauf{0%{opacity:0;transform:translate(-50%,6px) scale(.4)}
  30%{opacity:.9}100%{opacity:0;transform:translate(-50%,-16px) scale(1.3)}}
/* Fabrik raucht */
.pin .qualm{position:absolute;left:58%;top:-2px;width:9px;height:9px;border-radius:50%;
  background:#ffffffbb;opacity:0;pointer-events:none}
body[data-anim="1"] .pin.raucht .qualm,body[data-anim="2"] .pin.raucht .qualm{animation:qualmauf 3s ease-out infinite}
.pin .qualm.b{animation-delay:1.5s}
@keyframes qualmauf{0%{opacity:0;transform:translate(-50%,4px) scale(.4)}
  25%{opacity:.8}100%{opacity:0;transform:translate(-140%,-22px) scale(1.7)}}

/* frisch gekauft */
.pin.pop .knopf{animation:popauf .75s cubic-bezier(.2,1.6,.4,1)}
@keyframes popauf{0%{transform:scale(.2) rotate(-25deg)}55%{transform:scale(1.35) rotate(6deg)}100%{transform:scale(1)}}
.pin.pop .bez{animation:rein .5s .15s backwards}

/* ---------- Ebenen-Chips ---------- */
#ebenen{position:absolute;left:10px;bottom:calc(var(--dockh) + 12px);z-index:20;display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
#ebenen button{
  background:#0b3648e0;color:#fff;border:2px solid #ffffff2e;border-radius:99px;
  padding:6px 12px;font-size:var(--f0);font-weight:800;font-family:"Baloo 2",sans-serif;
  display:flex;align-items:center;gap:6px}
#ebenen button i{width:10px;height:10px;border-radius:3px;display:block}
#ebenen button[aria-pressed="false"]{opacity:.4}
#zoom{position:absolute;right:10px;bottom:calc(var(--dockh) + 12px);z-index:20;display:flex;flex-direction:column;gap:6px}
#zoom button{width:42px;height:42px;border-radius:14px;background:#0b3648e0;color:#fff;
  border:2px solid #ffffff2e;font-size:var(--f4);font-family:"Baloo 2",sans-serif;font-weight:800}

/* ---------- Wegweiser ---------- */
#quest{
  position:absolute;right:10px;top:calc(var(--hudh) + 6px);z-index:27;
  width:min(45%,290px);background:var(--papier);border-radius:16px;
  border-top:4px solid var(--gold);box-shadow:var(--sh);padding:9px 12px 11px
}
#quest[hidden]{display:none}
/* Der Kasten sitzt IMMER oben rechts – auf der Karte unter dem HUD, bei
   offener Seite unter den Schliessknöpfen. Nie mitten im Menü. */
#quest.breit{top:calc(env(safe-area-inset-top) + 64px);left:auto;right:12px;
  width:min(64%,300px);z-index:46}
#quest .kopf{display:flex;align-items:center;gap:6px;font-size:var(--f0);font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--grau)}
#quest .kopf svg{width:18px;height:18px;flex:none}
#quest .qstand{margin-left:auto;background:var(--gold);color:#4a3000;border-radius:99px;
  padding:2px 9px;font-size:var(--f0);letter-spacing:0;text-transform:none;white-space:nowrap}
#quest .qstand:empty{display:none}
#quest.belohnt{animation:questfeier .9s cubic-bezier(.2,1.5,.4,1)}
@keyframes questfeier{0%{transform:scale(1)}30%{transform:scale(1.06)}60%{transform:scale(.99)}100%{transform:scale(1)}}
#quest b{display:block;font-family:"Baloo 2",sans-serif;font-size:var(--f2);line-height:1.2;margin:4px 0 2px}
#quest small{display:block;color:var(--grau);font-size:var(--f0);font-weight:600;line-height:1.35}
#quest .fortschritt{display:flex;gap:3px;margin-top:8px}
#quest .fortschritt i{height:5px;flex:1;border-radius:99px;background:#e3d7bd}
#quest .fortschritt i.ok{background:var(--gruen)}
#quest .fortschritt i.jetzt{background:var(--gold);animation:blinken 1.4s ease-in-out infinite}
@keyframes blinken{0%,100%{opacity:1}50%{opacity:.45}}

/* Hinweis-Animation: zeigt, wo getippt werden soll */
.pin.wink{z-index:5}
.pin.wink .knopf{border-color:var(--gold);box-shadow:0 0 0 5px #f5b73d66;animation:wink 1.15s ease-in-out infinite}
@keyframes wink{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.pin.blass{opacity:.45}
#dock button{position:relative}
#dock button.wink:not(.orb){color:var(--gold);background:#f5b73d1f}
#dock button.wink:not(.orb)::after{content:"";position:absolute;top:2px;right:calc(50% - 22px);
  width:10px;height:10px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 0 #f5b73daa;animation:ping 1.3s ease-out infinite}
#dock button.orb.wink .orbring{animation:orbwink 1.1s ease-in-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #f5b73daa}70%{box-shadow:0 0 0 10px #f5b73d00}100%{box-shadow:0 0 0 0 #f5b73d00}}
@keyframes orbwink{0%,100%{transform:scale(1);box-shadow:0 6px 0 #b8790a,0 0 0 0 #f5b73d99}
  50%{transform:scale(1.09);box-shadow:0 6px 0 #b8790a,0 0 0 14px #f5b73d00}}

/* ---------- Dock mit grossem Orb ---------- */
#dock{
  position:absolute;left:0;right:0;bottom:0;z-index:39;display:flex;align-items:flex-end;
  background:linear-gradient(#0b3648,#092c3b);padding:8px 4px calc(env(safe-area-inset-bottom) + 8px);
  border-top:2px solid #ffffff1f
}
#dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:#8fb2c6;font-size:var(--f0);font-weight:800;font-family:"Baloo 2",sans-serif;border-radius:14px}
#dock button svg{width:26px;height:26px}
#dock button[aria-selected="true"]{color:var(--gold);background:#ffffff12}
#dock button[aria-selected="true"] svg{filter:drop-shadow(0 0 6px #f5b73d66)}
/* der grosse Orb */
#dock button.orb{flex:0 0 auto;width:96px;gap:5px;background:none;color:#cfe4ef}
#dock button.orb[aria-selected="true"]{color:#fff;background:none}
.orbring{
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%, #ffe9a8 0%, var(--gold) 42%, var(--gold2) 100%);
  border:4px solid #0b3648;box-shadow:0 6px 0 #b8790a, 0 10px 22px #0007;position:relative;
  margin-top:-26px}
.orbring::before{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:2px solid #f5b73d55;pointer-events:none}
.orbring svg{width:48px!important;height:auto!important}
#dock button.orb:active .orbring{transform:translateY(4px);box-shadow:0 2px 0 #b8790a,0 4px 10px #0006}
.orbzahl{position:absolute;top:-4px;right:-6px;min-width:28px;height:28px;padding:0 6px;
  border-radius:99px;background:#0b3648;color:#fff;border:3px solid #6fb8e0;
  display:grid;place-items:center;font-size:var(--f0);font-weight:800;font-family:"Baloo 2",sans-serif}
.orbzahl.leer{border-color:var(--alarm);background:var(--alarm);animation:puls 1.1s infinite}

/* ---------- Blatt (Bottom Sheet) & Seiten ---------- */
#blatt{
  position:absolute;left:0;right:0;bottom:calc(var(--dockh) + 30px);z-index:40;
  max-height:76%;background:var(--papier);border-radius:24px 24px 0 0;
  box-shadow:0 -6px 30px rgba(0,0,0,.4);
  transform:translateY(calc(100% + var(--dockh) + 44px));transition:transform .3s cubic-bezier(.22,1,.3,1);
  display:flex;flex-direction:column;padding-bottom:10px
}
#blattschleier{position:absolute;left:0;right:0;top:0;bottom:var(--dockh);z-index:38;background:#06202e70;opacity:0;
  transition:opacity .26s;pointer-events:none}
#blattschleier.auf{opacity:1;pointer-events:auto}
#blatt.auf{transform:translateY(0)}
.griff{width:46px;height:6px;border-radius:99px;background:#00000022;margin:10px auto 2px;flex:none}
.blattinhalt{overflow-y:auto;padding:8px 16px 14px;-webkit-overflow-scrolling:touch}
#seite{
  position:absolute;inset:0;bottom:var(--dockh);z-index:35;
  background:var(--papier);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 12px + var(--questh)) 14px 62px;
  scroll-padding-top:var(--questh);
  -webkit-overflow-scrolling:touch
}
#seite[hidden]{display:none}
#seite h1{font-size:var(--f5);margin-bottom:2px}
#seite .unter{color:var(--grau);font-size:var(--f1);margin-bottom:14px}
.seitenkopf{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.seitenkopf .txt{flex:1;min-width:0}

/* ---------- rotes Schliesskreuz (auf jedem Menü) ---------- */
.xzu{
  position:absolute;top:10px;right:10px;z-index:6;width:42px;height:42px;border-radius:14px;
  background:#fff;border:3px solid var(--alarm);color:var(--alarm);
  display:grid;place-items:center;box-shadow:0 3px 0 #b83c37, 0 4px 12px #00000026}
.xzu svg{width:19px;height:19px}
.xzu:active{transform:translateY(3px);box-shadow:0 0 0 #b83c37}
#blatt .xzu{top:8px}
/* Zahnrad und Kreuz liegen über der Seite und scrollen nie weg */
#seitenkopf{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:47;
  display:flex;gap:8px}
#seitenkopf[hidden]{display:none}
#seitenkopf .xzu,#seitenkopf .seitenknopf{position:relative;top:0;right:0}
.seitenknopf{width:42px;height:42px;border-radius:14px;background:#fff;border:3px solid var(--linie);
  color:var(--grau);display:grid;place-items:center;box-shadow:0 3px 0 #e0d3b8}
.seitenknopf svg{width:21px;height:21px}
.seitenknopf:active{transform:translateY(3px);box-shadow:0 0 0 #e0d3b8}

/* ---------- Bausteine ---------- */
.titelzeile{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.titelzeile h2{font-size:var(--f4)}
.titelzeile .ort{color:var(--grau);font-size:var(--f0);font-weight:700}
.erzband{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 14px 6px 6px;
  color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:var(--f1);margin:9px 0}
.erzband span.kugel{width:26px;height:26px;border-radius:50%;background:#ffffff38;display:grid;place-items:center;font-size:var(--f0)}
/* Bei grosser Schrift bricht das Raster von selbst auf eine Spalte um */
.werte{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(142px * var(--fs)),1fr));gap:9px;margin:11px 0}
.wert{background:var(--papier2);border-radius:14px;padding:9px 11px;display:flex;align-items:center;gap:9px}
.wert .wi{flex:none;width:26px;height:26px;opacity:.85;color:var(--grau)}
.wert .wi svg{width:100%;height:100%}
.wert .wt{min-width:0}
.wert small{display:block;color:var(--grau);font-size:var(--f0);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.wert b{font-family:"Baloo 2",sans-serif;font-size:var(--f3);font-variant-numeric:tabular-nums;display:block;line-height:1.15;overflow-wrap:anywhere}
.notiz{background:#fff3d6;border-radius:14px;padding:11px 13px;font-size:var(--f1);font-weight:600;line-height:1.45;margin:11px 0}
.notiz.rot{background:#ffe2e0}
.notiz.gruen{background:#dcf5e8}
.notiz.blau{background:#dceaf7}
.cta{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:18px;text-align:center;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:var(--f3);margin-top:11px;
  background:var(--gold);color:#4a3000;box-shadow:0 4px 0 #c48d1c}
.cta svg{width:24px;height:24px;flex:none}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #c48d1c}
.cta.gruen{background:var(--gruen);color:#04331f;box-shadow:0 4px 0 #1d8d5c}
.cta.gruen:active{box-shadow:0 1px 0 #1d8d5c}
.cta.still{background:var(--papier2);color:var(--grau);box-shadow:0 4px 0 #e0d3b8}
.cta:disabled{background:#e8ddc6;color:#9c8e78;box-shadow:0 4px 0 #d6c9b0;cursor:not-allowed}
.cta.riesig{padding:19px;font-size:var(--f4);border-radius:22px;box-shadow:0 6px 0 #c48d1c}
.cta.riesig:active{transform:translateY(4px);box-shadow:0 2px 0 #c48d1c}
.cta.puls{animation:ctapuls 2s ease-in-out infinite}
@keyframes ctapuls{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

.crewzeile{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap}
.crewzeile button{
  min-width:52px;height:52px;padding:0 10px;border-radius:17px;background:var(--papier2);
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:var(--f2);box-shadow:0 3px 0 #e0d3b8}
.crewzeile button:active{transform:translateY(2px);box-shadow:0 1px 0 #e0d3b8}
.crewzeile button:disabled{opacity:.35}
.crewzeile .zahl{min-width:86px;text-align:center}
.crewzeile .zahl b{display:block;font-family:"Baloo 2",sans-serif;font-size:var(--f6);line-height:1}
.crewzeile .zahl small{color:var(--grau);font-size:var(--f0);font-weight:700}
.segment{display:flex;gap:5px;background:var(--papier2);padding:5px;border-radius:16px;margin:8px 0}
.segment button{flex:1;padding:9px 4px;border-radius:12px;font-weight:800;font-size:var(--f0);color:var(--grau);
  font-family:"Baloo 2",sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px}
.segment button svg{width:30px;height:22px}
.segment button[aria-pressed="true"]{background:#fff;color:var(--tinte);box-shadow:0 2px 5px #0000001a}
/* ---------- Ausbaureihe: zehn Kästchen, das zehnte verdoppelt ---------- */
.ausbaukopf{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ausbaumarke{background:var(--gruen);color:#04331f;border-radius:99px;padding:3px 11px;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:var(--f1)}
.ausbaureihe{display:flex;gap:4px;margin:9px 0 4px}
/* Die Kästchen sind Markierungen, keine Lesetexte: Ihre Beschriftung
   passt sich der Kästchenbreite an, damit auch zehn Stück auf 320px passen. */
.ausbaureihe i{flex:1;min-width:0;height:calc(24px + 6px * var(--fs));border-radius:8px;background:#ece2cc;
  border:2px solid #00000012;display:grid;place-items:center;font-style:normal;overflow:hidden;
  font-family:"Baloo 2",sans-serif;font-weight:800;color:#a99a80;
  font-size:clamp(10px, 3.2vw, var(--f0))}
.ausbaureihe i.voll{background:linear-gradient(#ffdc86,var(--gold));border-color:#c48d1c;
  color:#5a3c00;box-shadow:0 2px 0 #c48d1c}
.ausbaureihe i.doppel{background:#e4f5ec;border-color:#9ed8bd;color:#1a7a54}
.ausbaureihe i.doppel.voll{background:linear-gradient(#82e2b4,var(--gruen));border-color:#1d8d5c;
  color:#04331f;box-shadow:0 2px 0 #1d8d5c}
.ausbaureihe i.naechst{border-color:var(--gold);border-style:dashed;color:var(--gold2)}
body[data-anim="1"] .ausbaureihe i.naechst,body[data-anim="2"] .ausbaureihe i.naechst{animation:blinken 1.5s ease-in-out infinite}
.ausbaureihe i.frisch{animation:stufeRein .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stufeRein{0%{transform:scale(.4) rotate(-16deg)}60%{transform:scale(1.25) rotate(5deg)}100%{transform:scale(1)}}

.leiste{height:13px;border-radius:99px;background:#e6dcc6;overflow:hidden;margin:6px 0}
.leiste i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.zeile{display:flex;justify-content:space-between;align-items:center;gap:4px 10px;flex-wrap:wrap;
  padding:8px 0;border-bottom:1px solid var(--linie);font-size:var(--f1)}
.zeile:last-child{border:none}
.zeile b{font-variant-numeric:tabular-nums;font-family:"Baloo 2",sans-serif;font-size:var(--f2);white-space:nowrap}
.karte{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000012}
.karte h3{font-size:var(--f3);margin-bottom:3px}
.karte .ort{color:var(--grau);font-size:var(--f0);font-weight:700;margin-bottom:7px}
.stueck{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.stueck span{font-size:var(--f0);font-weight:800;padding:4px 9px;border-radius:99px;color:#fff}
.stueck span.fehlt{opacity:.4;text-decoration:line-through}
.wahlgruppe{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wahlgruppe button{background:var(--papier2);border-radius:14px;padding:11px 7px;font-weight:800;font-size:var(--f1);box-shadow:0 3px 0 #e0d3b8}
.wahlgruppe button small{display:block;font-size:var(--f0);color:var(--grau);font-weight:700}
.wahlgruppe button:disabled{opacity:.4}
.punkt{width:13px;height:13px;border-radius:4px;flex:none;display:inline-block}

/* ---------- Szenen (kleine Animationen) ---------- */
.szene{position:relative;border-radius:18px;overflow:hidden;margin:10px 0 4px;
  background:linear-gradient(#bfe0f0,#e7f2f8);box-shadow:inset 0 2px 10px #0000001a}
.szene svg.buehne{width:100%;height:auto;display:block}
.szene .schweber{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden}
.flieger{position:absolute;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:var(--f1);
  color:#2c6e4f;text-shadow:0 1px 0 #fff,0 0 6px #fff;animation:flieg 1.5s ease-out forwards;white-space:nowrap}
@keyframes flieg{0%{opacity:0;transform:translateY(6px) scale(.7)}
  20%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-34px) scale(1.05)}}
.hack{transform-box:fill-box;transform-origin:41% 14%}
body[data-anim="1"] .hack,body[data-anim="2"] .hack{animation:hacken 1.5s cubic-bezier(.5,0,.4,1) infinite}
@keyframes hacken{0%,100%{transform:rotate(-40deg)}40%{transform:rotate(16deg)}52%{transform:rotate(10deg)}}
.funkeln{opacity:0}
body[data-anim="1"] .funkeln,body[data-anim="2"] .funkeln{animation:funkeln 1.5s ease-out infinite}
@keyframes funkeln{0%,38%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1.2)}70%,100%{opacity:0;transform:scale(.5) translateY(-7px)}}
.rauch{opacity:0}
body[data-anim="1"] .rauch,body[data-anim="2"] .rauch{animation:rauch 3s ease-out infinite}
@keyframes rauch{0%{opacity:0;transform:translate(0,0) scale(.5)}
  25%{opacity:.75}100%{opacity:0;transform:translate(-9px,-30px) scale(1.7)}}
.zahnrad{transform-box:fill-box;transform-origin:50% 50%}
body[data-anim="1"] .zahnrad,body[data-anim="2"] .zahnrad{animation:dreh 4s linear infinite}
.zahnrad.rueck{animation-direction:reverse}
@keyframes dreh{to{transform:rotate(360deg)}}
.band{stroke-dasharray:6 6}
body[data-anim="1"] .band,body[data-anim="2"] .band{animation:bandlauf 1s linear infinite}
@keyframes bandlauf{to{stroke-dashoffset:-12}}
.kiste{transform-box:fill-box}
body[data-anim="1"] .kiste,body[data-anim="2"] .kiste{animation:kistenlauf 3.2s linear infinite}
@keyframes kistenlauf{0%{transform:translateX(0);opacity:0}
  8%{opacity:1}92%{opacity:1}100%{transform:translateX(96px);opacity:0}}
.blase{transform-box:fill-box}
body[data-anim="1"] .blase,body[data-anim="2"] .blase{animation:blubber 2.4s ease-in infinite}
@keyframes blubber{0%{transform:translateY(0) scale(.4);opacity:0}
  20%{opacity:.9}100%{transform:translateY(-26px) scale(1.1);opacity:0}}
.herz{transform-box:fill-box;transform-origin:50% 55%}
body[data-anim="1"] .herz,body[data-anim="2"] .herz{animation:herzschlag var(--takt,1.4s) ease-in-out infinite}
@keyframes herzschlag{0%,100%{transform:scale(1)}14%{transform:scale(1.16)}28%{transform:scale(1)}42%{transform:scale(1.1)}}
.wandern{transform-box:fill-box}
body[data-anim="2"] .wandern{animation:wandern 5s ease-in-out infinite alternate}
@keyframes wandern{to{transform:translateX(10px)}}

/* Einzug der Blatt-Inhalte */
.rein > *{animation:kartenrein .42s cubic-bezier(.22,1,.3,1) backwards}
.rein > *:nth-child(1){animation-delay:.01s}
.rein > *:nth-child(2){animation-delay:.05s}
.rein > *:nth-child(3){animation-delay:.09s}
.rein > *:nth-child(4){animation-delay:.13s}
.rein > *:nth-child(5){animation-delay:.17s}
.rein > *:nth-child(6){animation-delay:.2s}
.rein > *:nth-child(n+7){animation-delay:.23s}
@keyframes kartenrein{from{opacity:0;transform:translateY(16px) scale(.97)}}

/* Funken-Ebene für Kauf-Feiern */
#funken{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.funke{position:absolute;width:11px;height:11px;border-radius:3px;
  animation:funke .95s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes funke{0%{opacity:1;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--dr))}}

/* ---------- Regler ---------- */
.reglerzeile{margin:16px 0}
.reglerzeile .kopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px}
.reglerzeile .kopf b{font-family:"Baloo 2",sans-serif;font-size:var(--f2)}
.reglerzeile .kopf span{font-family:"Baloo 2",sans-serif;font-size:var(--f2);color:var(--gold2);font-variant-numeric:tabular-nums}
.reglerzeile small{color:var(--grau);font-size:var(--f0);font-weight:600;display:block;line-height:1.35}
.regler{width:100%;height:40px;-webkit-appearance:none;appearance:none;background:transparent;margin:2px 0;cursor:pointer}
.regler::-webkit-slider-runnable-track{height:14px;border-radius:99px;
  background:linear-gradient(90deg,var(--gold) var(--p,50%),#e3d7bf var(--p,50%))}
.regler::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-10px;border-radius:50%;
  background:#fff;border:5px solid var(--gold);box-shadow:0 3px 7px #00000038}
.regler::-moz-range-track{height:14px;border-radius:99px;background:#e3d7bf}
.regler::-moz-range-progress{height:14px;border-radius:99px;background:var(--gold)}
.regler::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--gold);box-shadow:0 3px 7px #00000038}
.regler:active::-webkit-slider-thumb{transform:scale(1.08)}

/* ---------- Überlagerungen (Einstellungen, Wissenssegment) ---------- */
.ueberlage{position:fixed;inset:0;z-index:64;background:#06202ecc;backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.ueberlage[hidden]{display:none}
.ueberlage .tafel{position:relative;background:var(--papier);width:100%;max-width:520px;
  border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);
  box-shadow:0 -8px 40px #0009;animation:hochrein .34s cubic-bezier(.22,1,.3,1)}
@keyframes hochrein{from{transform:translateY(60px);opacity:.4}}
.ueberlage h2{font-size:var(--f5);padding-right:52px}
.ueberlage .unter{color:var(--grau);font-size:var(--f1);margin-bottom:12px}
@media (min-width:820px){
  .ueberlage{align-items:center}
  .ueberlage .tafel{border-radius:26px;max-height:86vh}
}

/* ---------- Wissen ---------- */
.segkarte{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:13px;
  margin-bottom:11px;box-shadow:0 2px 8px #00000012;width:100%;text-align:left}
.segkarte .sicon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.segkarte .sicon svg{width:32px;height:32px}
.segkarte .stxt{flex:1;min-width:0}
.segkarte h3{font-size:var(--f2)}
.segkarte small{display:block;color:var(--grau);font-size:var(--f0);font-weight:600;line-height:1.35}
.segkarte .spfeil{font-size:var(--f4);color:var(--grau);flex:none}
.perkleiste{display:flex;gap:4px;margin-top:6px}
.perkleiste i{height:6px;flex:1;max-width:34px;border-radius:99px;background:#e3d7bf}
.perkleiste i.ok{background:var(--gruen)}
.perkkarte{border:3px solid var(--gold);background:#fffdf5;border-radius:18px;padding:14px;margin-top:14px}
.perkkarte.fertig{border-color:var(--gruen);background:#f2fbf6}
.perkkarte .marke{display:inline-block;background:var(--gold);color:#4a3000;border-radius:99px;
  padding:3px 11px;font-size:var(--f0);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.perkkarte.fertig .marke{background:var(--gruen);color:#04331f}
.perkkarte h3{font-size:var(--f3);margin:8px 0 3px}
.perkkarte p{font-size:var(--f1);font-weight:600;color:var(--grau);line-height:1.45}
.wirkung{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.wirkung span{background:#e9f7f0;color:#126b47;border-radius:99px;padding:4px 10px;font-size:var(--f0);font-weight:800}
.geraetbild{display:flex;justify-content:center;margin:6px 0 14px}
.geraetbild svg{width:min(210px,58%);height:auto}
.geraetliste{margin-bottom:6px}
.geraetzeile{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linie)}
.geraetzeile:last-child{border:none}
.geraetzeile .gnr{flex:none;width:30px;height:30px;border-radius:50%;background:#0e2b3c;color:#fff;
  display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:var(--f1)}
.geraetzeile .gtxt{min-width:0}
.geraetzeile b{font-family:"Baloo 2",sans-serif;font-size:var(--f2)}
.geraetzeile small{display:block;color:var(--grau);font-size:var(--f0);font-weight:600;line-height:1.45}
.fakt{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--linie);font-size:var(--f1);font-weight:600;line-height:1.45}
.fakt:last-child{border:none}
.fakt .nr{flex:none;width:26px;height:26px;border-radius:9px;background:var(--papier2);color:var(--grau);
  display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-size:var(--f0)}

/* ---------- Ereignis ---------- */
#schleier{position:fixed;inset:0;z-index:60;background:#06202ecc;backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:18px}
#schleier[hidden]{display:none}
.dialog{background:var(--papier);border-radius:26px;width:100%;max-width:440px;
  padding:22px;box-shadow:0 20px 50px #0009;max-height:86vh;overflow-y:auto;
  animation:hochrein .34s cubic-bezier(.22,1,.3,1)}
.dialog .art{display:inline-block;background:var(--alarm);color:#fff;border-radius:99px;
  padding:4px 13px;font-size:var(--f0);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.dialog h2{font-size:var(--f5);margin:10px 0 8px}
.dialog p{font-size:var(--f2);font-weight:600;line-height:1.5;margin-bottom:16px}
.wahl{display:block;width:100%;text-align:left;background:#fff;border-radius:17px;
  padding:14px 16px;margin-bottom:10px;box-shadow:0 3px 0 #e0d3b8}
.wahl:active{transform:translateY(2px);box-shadow:0 1px 0 #e0d3b8}
.wahl b{display:block;font-family:"Baloo 2",sans-serif;font-size:var(--f2)}
.wahl small{color:var(--grau);font-size:var(--f0);font-weight:600;line-height:1.4}

/* ---------- Meldungen ---------- */
#toasts{position:absolute;top:calc(var(--hudh) + 4px);left:10px;width:min(45%,300px);z-index:42;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;transition:opacity .2s}
/* Meldungen gehören auf die Karte – sobald ein Fenster offen ist, treten sie zurück */
body.fensterauf #toasts{opacity:0;visibility:hidden}
.toast{position:relative;overflow:hidden;isolation:isolate;
  background:#fffaf0f7;border-radius:15px;padding:10px 14px;font-size:var(--f0);font-weight:700;line-height:1.45;
  box-shadow:var(--sh);animation:rein .3s cubic-bezier(.22,1,.3,1)}
/* Zweiter Hintergrund: ein Band, das langsam nach links zieht.
   Es zeigt nebenbei, wie lange die Meldung noch bleibt. */
.toast::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(100deg, #f5b73d00 0%, #f5b73d30 26%, #f5b73d12 46%, #f5b73d00 68%);
  background-size:220% 100%;background-position:100% 0}
body[data-anim="1"] .toast::before,body[data-anim="2"] .toast::before{
  animation:toastzug 10s linear forwards}
@keyframes toastzug{from{background-position:120% 0}to{background-position:-90% 0}}
.toast .balken{position:absolute;left:0;right:0;bottom:0;height:3px;background:#00000012;z-index:-1}
.toast .balken i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:0 50%}
body[data-anim="1"] .toast .balken i,body[data-anim="2"] .toast .balken i{
  animation:toastbalken 10s linear forwards}
@keyframes toastbalken{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toast.gut{border-left:5px solid var(--gruen)}
.toast.gut .balken i{background:var(--gruen)}
.toast.warn{border-left:5px solid var(--warn)}
.toast.warn .balken i{background:var(--warn)}
.toast.alarm{border-left:5px solid var(--alarm)}
.toast.alarm .balken i{background:var(--alarm)}
.toast.geld{border-left:5px solid var(--gold)}
@keyframes rein{from{opacity:0;transform:translateY(-10px)}}

/* Tabellen scrollen bei Bedarf in sich selbst – nie die ganze Seite */
table{width:100%;border-collapse:collapse;font-size:var(--f1);
  display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--linie);vertical-align:middle}
th{font-size:var(--f0);text-transform:uppercase;letter-spacing:.04em;color:var(--grau)}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
code{background:var(--papier2);padding:2px 7px;border-radius:7px;font-size:var(--f0)}
#seite p,.ueberlage p{font-size:var(--f1);font-weight:600;line-height:1.55;margin-bottom:11px}
#seite h2{font-size:var(--f4);margin:20px 0 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body[data-anim="0"] *{animation:none!important}
@media (min-width:820px){
  #hud{padding-left:18px;padding-right:18px}
  #blatt{left:50%;transform:translate(-50%,calc(100% + var(--dockh) + 44px));width:470px}
  #blatt.auf{transform:translate(-50%,0)}
  #seite{left:50%;transform:translateX(-50%);width:600px;border-radius:22px 22px 0 0;top:64px}
  #seitenkopf{right:calc(50% - 292px);top:76px}
  #quest.breit{left:auto;right:calc(50% - 292px);width:320px;top:130px}
}
</style>
</head>
<body data-anim="1">
<div id="spiel">
  <div id="sicht">
    <div id="welt"></div>
  </div>

  <div id="hud">
    <button class="pille kasse" data-tun="kassebuch" aria-label="Kasse aufschlüsseln">

/* ---------- Ausbau (Idle-Stufen) ----------
   Jede Mine und jede Raffinerie lässt sich in Stufen ausbauen.

   Jede Stufe kostet mehr als die vorherige.                        */
const AUSBAU_REIHE    = 10;      // Kästchen pro Reihe
const AUSBAU_SCHRITT  = 1.05;    // was eine normale Stufe bringt
const AUSBAU_WACHSTUM = 1.38;    // wie stark der Preis pro Stufe steigt
const AUSBAU_BASIS    = 0.05;    // erste Stufe = 5 % der Baukosten
const AUSBAU_MAX      = 60;

/* Gesamtfaktor auf die Ausbringung bei Stufe n */
function ausbauFaktor(n){
  n = n || 0;
  const reihen = Math.floor(n / AUSBAU_REIHE);
  return Math.pow(AUSBAU_SCHRITT, n - reihen) * Math.pow(2, reihen);
}
/* Was kostet der Sprung von Stufe n auf n+1? */
function ausbauKosten(grundpreis, n){
  return Math.round(grundpreis * AUSBAU_BASIS * Math.pow(AUSBAU_WACHSTUM, n || 0) / 100) * 100;
}
/* Was wurde bis Stufe n insgesamt in den Ausbau gesteckt? */
function ausbauInvestiert(grundpreis, n){
  let summe = 0;
  for (let i = 0; i < (n || 0); i++) summe += ausbauKosten(grundpreis, i);
  return summe;
}

/* flagge("kongo")            → kleine Flagge im Text
   flagge("kongo","gross")    → grosse Flagge im Kopf eines Fensters */
function flagge(land, klasse){
  return `<svg class="fl ${klasse||""}" viewBox="0 0 30 20" role="img" aria-label="Flagge ${LAND[land]?LAND[land].name:land}">${FLAGGE[land]||""}</svg>`;
}
/* Flagge + Landesname als eine Einheit */
function landZeile(land, klasse){
  return `<span class="flz">${flagge(land, klasse)}<span>${LAND[land].name}</span></span>`;
}

/* Bergmann mit Spitzhacke. h = Farbe der Kleidung, verz = Animationsverzögerung */
function kumpel(x, y, s, farbe, verz){
  farbe = farbe || "#3f7fb0";
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cy="1.5" rx="7.5" ry="1.8" fill="#00000022"/>

      <circle cx="11" cy="-17" r="1.5"/><circle cx="13.6" cy="-13.6" r="1"/><circle cx="9" cy="-13" r=".8"/>
    </g></g>`;
}

/* Team-Ikone: mehrere Personen mit Spitzhacke nebeneinander */
function ikonTeam(n, breite, skala){
  n = Math.max(1, Math.min(5, n||3));
  const s = skala || .32, w = breite || 24, hoehe = 34*s, abstand = 21*s, mitte = w/2;
  let g = "";
  for (let i=0;i<n;i++){
    const x = mitte + (i - (n-1)/2) * abstand;
    g += kumpel(x, hoehe-1, s, i%2 ? "#4d94c6" : "#3f7fb0", i*.22);
  }
  return `<svg viewBox="0 0 ${w} ${hoehe.toFixed(1)}" aria-hidden="true">${g}</svg>`;
}

/* Zufriedenheit: Herz mit Bergmann und Spitzhacke drin.
   Farbe, Puls und Mundwinkel richten sich nach dem Wert. */
function ikonZufrieden(wert){
  const w = Math.max(0, Math.min(100, wert));
  const farbe = w < 32 ? "#e0504a" : w < 60 ? "#f08c2e" : "#2fbe7e";
  const takt  = (2.2 - w/100*.9).toFixed(2);       // unzufrieden = schneller, nervöser Puls
  const mund  = w < 32 ? `<path d="M10.6 14.5q1.4-1.2 2.8 0" stroke="${farbe}" stroke-width=".85" fill="none" stroke-linecap="round"/>`
              : w < 60 ? `<path d="M10.6 14h2.8" stroke="${farbe}" stroke-width=".85" stroke-linecap="round"/>`
                       : `<path d="M10.5 13.5q1.5 1.5 3 0" stroke="${farbe}" stroke-width=".85" fill="none" stroke-linecap="round"/>`;
  const riss  = w < 32 ? `<path d="M5.2 7.2 6.9 9 5 10.3l1.5 1.9" stroke="#ffffffbb" stroke-width="1"
                            fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : "";
  const glanz = w >= 60 ? `<g class="funkeln" fill="#fff3b0"><circle cx="20" cy="5.4" r="1.2"/>
                            <circle cx="4.4" cy="6.6" r=".9"/></g>` : "";
  return `<svg viewBox="0 0 24 24" aria-hidden="true">
    <g class="herz" style="--takt:${takt}s">
      <path d="M12 21.2C4.8 16.4 1.6 12.6 1.6 8.8 1.6 5.8 3.9 3.7 6.7 3.7c2.1 0 3.9 1.2 5.3 3.2 1.4-2 3.2-3.2 5.3-3.2 2.8 0 5.1 2.1 5.1 5.1 0 3.8-3.2 7.6-10.4 12.4z" fill="${farbe}"/>
      ${riss}
      <g fill="#fff">
        <rect x="15.6" y="8.4" width="1.15" height="8" rx=".57" transform="rotate(15 16.2 12.4)" opacity=".92"/>
        <path d="M13.6 9.5q2.7-2.3 5.4 0-2.7-1.1-5.4 0z" opacity=".92"/>
        <circle cx="12" cy="12.3" r="2.85" fill="#ffe6cd"/>
        ${mund}
        <path d="M9 11.7a3 3 0 0 1 6 0z"/>
        <rect x="8.4" y="11.35" width="7.2" height="1.3" rx=".65"/>
        <circle cx="12" cy="9.8" r=".8" fill="#fff8cc"/>
        <path d="M8.3 18.1c0-2.2 1.7-3.8 3.7-3.8s3.7 1.6 3.7 3.8z"/>
      </g>
    </g>${glanz}</svg>`;
}

/* Lohnstufe: 1 / 2 / 3 Münzen, ab Stufe «fair» mit Helm & Schutz */
function ikonLohn(stufe, aktiv){
  const n = stufe + 1;
  const gold = aktiv ? "#f5b73d" : "#cfc0a4", rand = aktiv ? "#c48d1c" : "#b3a58a";
  let m = "";
  for (let i=0;i<n;i++){
    const y = 17 - i*3.6;
    m += `<ellipse cx="14" cy="${y}" rx="7.6" ry="3.1" fill="${gold}" stroke="${rand}" stroke-width="1"/>`;
  }
  const schutz = stufe === 2
    ? `<path d="M4.4 7.2a4.6 4.6 0 0 1 9.2 0z" fill="${aktiv?"#2fbe7e":"#b8c9bd"}" transform="translate(13 -2)"/>
       <rect x="15.4" y="4.9" width="11.6" height="1.8" rx=".9" fill="${aktiv?"#2fbe7e":"#b8c9bd"}"/>` : "";
  const blitz = stufe === 0
    ? `<path d="M6 3.5 3 8.5h2.4L4.4 12l4-5.2H6.1z" fill="${aktiv?"#e0504a":"#c9b8a2"}"/>` : "";
  return `<svg viewBox="0 0 30 22" aria-hidden="true">${schutz}${blitz}${m}</svg>`;
}

/* ---------- Szenen: kleine bewegte Bilder in den Fenstern ---------- */
function szeneMine(def, m){
  const mat = MATERIAL[def.mat];
  const arbeiter = m ? m.arbeiter : 0;
  const still = m && m.stillBis > S.tag;
  const laeuft = arbeiter > 0 && !still;
  const anzahl = arbeiter === 0 ? 0 : Math.max(1, Math.min(5, Math.round(arbeiter/12) + 1));
  let leute = "";
  for (let i=0;i<anzahl;i++)
    leute += kumpel(58 + i*34, 88, .95, i%2 ? "#4d94c6" : "#3f7fb0", i*.26);
  const brocken = laeuft ? [...Array(4)].map((_,i) =>
    `<circle class="funkeln" style="animation-delay:${(i*.3).toFixed(2)}s" cx="${34+i*7}" cy="${58+ (i%2)*6}" r="${2.6-i*.3}" fill="${mat.farbe}"/>`).join("") : "";
  return `<div class="szene" data-szene="${def.id}|${arbeiter}|${laeuft?1:0}">
    <svg class="buehne" viewBox="0 0 240 110" aria-label="Mine ${def.ort}">
      <defs><linearGradient id="mg${def.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8f7c5c"/><stop offset="1" stop-color="#6d5c40"/></linearGradient></defs>
      <circle cx="212" cy="20" r="11" fill="#ffe9a0"/>
      <g class="wandern" fill="#ffffffcc"><ellipse cx="60" cy="20" rx="17" ry="7"/><ellipse cx="74" cy="17" rx="12" ry="6"/></g>
      <path d="M0 78 38 30 66 54 98 22 136 60 168 40 240 78Z" fill="url(#mg${def.id})"/>
      <path d="M98 22 116 40 136 60 168 40 240 78 240 60 190 34 168 24 136 40Z" fill="#00000018"/>
      <rect y="78" width="240" height="32" fill="#c8a86b"/>
      <rect y="78" width="240" height="3" fill="#00000018"/>
      <path d="M14 78v-14a13 13 0 0 1 26 0v14z" fill="#2c2318"/>
      <path d="M10 78v-15a17 17 0 0 1 34 0v15h-5v-13a12 12 0 0 0-24 0v13z" fill="#8a5c30"/>
      <rect x="8" y="74" width="38" height="5" rx="2" fill="#8a5c30"/>
      ${brocken}
      <rect x="6" y="92" width="228" height="2.4" rx="1.2" fill="#7d6a4c"/>
      ${[...Array(12)].map((_,i)=>`<rect x="${10+i*19}" y="90" width="3" height="7" rx="1.5" fill="#6b5940"/>`).join("")}
      <g class="${laeuft?"kiste":""}"><g transform="translate(150 78)">
        <path d="M-13 0h26l-3.4 13h-19.2z" fill="#6f7c88"/>
        <rect x="-13" y="-3" width="26" height="4" rx="1.6" fill="#8b98a5"/>
        <circle cx="-7" cy="14" r="3.2" fill="#3d4750"/><circle cx="7" cy="14" r="3.2" fill="#3d4750"/>
        <circle cx="-4" cy="-1" r="2.6" fill="${mat.farbe}"/><circle cx="3" cy="-2" r="3" fill="${mat.farbe}"/>
      </g></g>
      ${leute}
      ${arbeiter === 0 ? `<text x="120" y="46" text-anchor="middle" font-family="Baloo 2,sans-serif" font-size="15"
        fill="#ffffff" stroke="#00000055" stroke-width="3" paint-order="stroke">Noch niemand hier</text>` : ""}
      ${still ? `<rect width="240" height="110" fill="#00000055"/>
        <text x="120" y="58" text-anchor="middle" font-family="Baloo 2,sans-serif" font-size="17" fill="#fff">Mine steht still</text>` : ""}
    </svg><div class="schweber"></div></div>`;
}

/* ---------- Kassenbuch ----------
   Jeder Franken wird mit Datum und Grund verbucht. Daraus entsteht die

const BUCH_ARTEN = ["verkauf","lohn","betrieb","bau","personal","ausbau","wissen","ereignis","sonstiges"];
const BUCH_NAME = {verkauf:"Verkauf", lohn:"Löhne", betrieb:"Betrieb", bau:"Neubauten",
  personal:"Anstellen", ausbau:"Ausbau", wissen:"Wissen", ereignis:"Ereignisse", sonstiges:"Sonstiges"};
const BUCH_TAGE = 45;

function buchTag(){
  if (!Array.isArray(S.buch)) S.buch = [];
  let e = S.buch[S.buch.length - 1];
  if (!e || e.t !== S.tag){
    e = {t:S.tag}; BUCH_ARTEN.forEach(a => e[a] = 0);
    S.buch.push(e);
    while (S.buch.length > BUCH_TAGE) S.buch.shift();
  }
  return e;
}
function buchen(art, betrag){
  if (!betrag) return;
  const e = buchTag();
  e[art] = (e[art] || 0) + betrag;
}
/* Geld ausgeben – immer über diesen Weg, dann stimmt das Buch. */
function zahlen(betrag, art){
  S.kasse -= betrag; S.ausgegeben += betrag; buchen(art || "sonstiges", betrag);
}
/* Summe der letzten n Tage je Art */
function buchSumme(n){
  const ab = S.tag - n;
  const summe = {}; BUCH_ARTEN.forEach(a => summe[a] = 0);
  (S.buch || []).forEach(e => { if (e.t > ab) BUCH_ARTEN.forEach(a => summe[a] += e[a] || 0); });
  return summe;
}

/* ---------- Wissen / Perks ----------
   mult = multiplikativ (1.10 = +10 %), plus = additiv.
   Beide stapeln sich über alle gekauften Perks.                */
function perkMult(art){
  let f = 1;
  for (const id in S.perks){ const e = PERK_INDEX[id];
    if (e && e.perk.mult && e.perk.mult[art] != null) f *= e.perk.mult[art]; }
  return f;
}
function perkPlus(art){
  let s = 0;
  for (const id in S.perks){ const e = PERK_INDEX[id];
    if (e && e.perk.plus && e.perk.plus[art] != null) s += e.perk.plus[art]; }
  return s;
}
const perkHat = id => !!S.perks[id];

function perksGekauft(seg){ return seg.perks.filter(p => S.perks[p.id]).length; }

/* Wie viele Arbeiter sind bereits eingeteilt? */

  let n = S.verkaeufer || 0;
  for (const id in S.minen) n += S.minen[id].arbeiter;
  for (const id in S.raff)  n += S.raff[id].arbeiter;

}

/* Monatliche Lohnsumme */
function lohnsumme(){
  let summe = 0;
  for (const id in S.minen){
    const m = S.minen[id], def = MINEN.find(x=>x.id===id);
    summe += m.arbeiter * LAND[def.land].lohn * LOHNSTUFE[m.stufe].faktor;
  }
  for (const id in S.raff){
    const def = RAFF_ORTE.find(x=>x.id===id);
    summe += S.raff[id].arbeiter * LAND[def.land].lohn;
  }
  for (const f of S.fabriken) summe += f.arbeiter * LAND[f.land].lohn;
  summe += (S.verkaeufer || 0) * VERKAUF_LOHN;
  // Arbeiter ohne Einteilung kosten trotzdem eine Grundpauschale
  summe += freieArbeiter() * 200;
  return summe * perkMult("lohn");
}

/* ---------- Auslastung der Kette ----------
   Damit sichtbar wird, wo es klemmt: Fördern die Minen mehr, als die

function erzProTag(){
  let summe = 0;
  for (const id in S.minen){
    const m = S.minen[id], def = MINEN.find(x=>x.id===id);
    if (m.stillBis > S.tag) continue;
    summe += m.arbeiter * def.ergiebigkeit * ausbauFaktor(m.ausbau) * perkMult("foerderung")
             * (0.55 + m.zufriedenheit/100 * 0.6) * (m.malusBis > S.tag ? m.malus : 1);
  }
  return summe;
}
function raffProTag(){
  let summe = 0;
  const hafen = globalWert("hafen") * perkMult("durchsatz");
  for (const id in S.raff){
    const r = S.raff[id], def = RAFF_ORTE.find(x=>x.id===id);
    summe += def.kapazitaet * ausbauFaktor(r.ausbau) * (r.arbeiter / def.plaetze) * hafen;
  }
  return summe;
}

/* Balken, der zwei Werte vergleicht und den Engpass benennt */
function engpassBalken(ist, kann, einheitIst, einheitKann){
  const anteil = kann > 0 ? Math.min(1, ist / kann) : (ist > 0 ? 1 : 0);
  const eng = kann > 0 && ist > kann * 1.02;

  return `<div class="leiste" style="height:16px"><i style="width:${(anteil*100).toFixed(0)}%;background:${farbe}"></i></div>
    <div class="zeile" style="padding-top:4px"><span>${einheitIst}</span><b>${Math.round(ist)}</b></div>
    <div class="zeile"><span>${einheitKann}</span><b>${Math.round(kann)}</b></div>`;
}

/* Lohnsumme aufgeschlüsselt nach Land – für die Auswertung am Rundenende */
function lohnNachLand(){
  const nach = {};
  const dazu = (land, betrag) => { nach[land] = (nach[land] || 0) + betrag; };
  for (const id in S.minen){
    const m = S.minen[id], def = MINEN.find(x=>x.id===id);
    dazu(def.land, m.arbeiter * LAND[def.land].lohn * LOHNSTUFE[m.stufe].faktor);
  }
  for (const id in S.raff){
    const def = RAFF_ORTE.find(x=>x.id===id);
    dazu(def.land, S.raff[id].arbeiter * LAND[def.land].lohn);
  }
  for (const f of S.fabriken) dazu(f.land, f.arbeiter * LAND[f.land].lohn);
  const f = perkMult("lohn");
  for (const l in nach) nach[l] *= f;
  return nach;
}

/* Wie viele Stück können deine Verkäuferinnen heute absetzen? */
function verkaufsKraft(){
  return Math.floor((S.verkaeufer || 0) * STUECK_PRO_VERKAEUFER * perkMult("verkaufskraft"));
}
/* Wie viel liegt insgesamt fertig im Lager? */
function warenLager(){
  return Object.keys(PRODUKT).reduce((a,p) => a + (S.ware[p] || 0), 0);
}

/* Verkauft Ware. grenze = wie viele Stück höchstens.
   Pro Produkt bremst zusätzlich die Tagesnachfrage. */
function wareVerkaufen(grenze){
  let rest = grenze, stueck = 0, erloes = 0;
  // Zuerst das Teuerste: sonst verbrauchen billige Kabel die Verkaufskraft,
  // die für ein Mainboard viel mehr Geld gebracht hätte.
  const reihenfolge = Object.keys(PRODUKT)
    .filter(p => (S.ware[p] || 0) > 0)
    .sort((a,b) => warenPreis(b) - warenPreis(a));
  for (const p of reihenfolge){
    if (rest <= 0) break;
    const lager = S.ware[p] || 0;
    if (lager <= 0) continue;
    const menge = Math.min(lager, rest, Math.round(nachfrage(p)));
    if (menge <= 0) continue;
    const geld = menge * warenPreis(p);
    S.ware[p] = lager - menge;
    S.kasse += geld; S.eingenommen += geld;
    rest -= menge; stueck += menge; erloes += geld;
  }
  return {stueck, erloes};
}

/* Aktueller Marktpreis eines Materials */
function matPreis(k){
  const mod = S.preisMod[k];
  const f = (mod && mod.bis > S.tag) ? mod.faktor : 1;
  return MATERIAL[k].preis * f * dollarFaktor();
}
function dollarFaktor(){
  const g = S.globalMod.find(m => m.art === "dollar" && m.bis > S.tag);
  return g ? g.wert : 1;
}
function globalWert(art){
  const g = S.globalMod.find(m => m.art === art && m.bis > S.tag);
  return g ? g.wert : 1;
}

/* Nachfrage pro Tag: Grundwert × Saison × Ereignis × Ruf */
function nachfrage(p){
  const def = PRODUKT[p];
  const m = ((monat()-1) % 12) + 1;
  let saison = 1;
  if (p==="konsole" || p==="tv") saison = (m===11||m===12) ? 1.8 : (m===1||m===2 ? .75 : 1);
  if (p==="phone") saison = (m===9||m===10) ? 1.35 : 1;
  if (p==="akku")  saison = (m>=3 && m<=7) ? 1.4 : .8;
  const mod = S.nachfrageMod[p];
  const ev = (mod && mod.bis > S.tag) ? mod.faktor : 1;
  const rufF = 0.65 + (S.ruf/100) * 0.7;     // schlechter Ruf → weniger Käufer
  return def.nachfrage * saison * ev * rufF * perkMult("nachfrage");
}

/* Verkaufspreis sinkt, wenn das Lager überquillt (Angebot > Nachfrage) */
function warenPreis(p){
  const lager = S.ware[p] || 0;
  const n = Math.max(1, nachfrage(p));
  const ueber = klemm(lager / (n*12), 0, 1);
  return PRODUKT[p].preis * (1 - 0.35*ueber) * dollarFaktor() * perkMult("warenpreis") * erloesFaktor();
}

/* Rohstoffe lassen sich nicht zukaufen: Jedes Material muss aus einer
   eigenen Mine kommen. Das ist der Kern des Spiels. */

/* ============================================================
   Der Tagesschritt – hier passiert alles.
   Reihenfolge: Zufriedenheit → Abbau → Raffination → Bau →
                Produktion → Verkauf → Monatsende → Ereignis
   ============================================================ */
function tagVor(){
  if (S.ende || modalOffen) return;
  S.tag++;
  letzteFoerderung = {};

  // 1) Zufriedenheit bewegt sich langsam auf den Zielwert der Lohnstufe zu
  const zufBonus = perkPlus("zufrieden");
  for (const id in S.minen){
    const m = S.minen[id], def = MINEN.find(x=>x.id===id);
    const ziel = LOHNSTUFE[m.stufe].ziel - (LAND[def.land].risiko - 1) * 8 + zufBonus;
    m.zufriedenheit += (ziel - m.zufriedenheit) * 0.04;
    m.zufriedenheit = klemm(m.zufriedenheit, 0, 100);
  }

  // 2) Abbau: Roherz entsteht
  const foerderBonus = perkMult("foerderung");
  for (const id in S.minen){
    const m = S.minen[id], def = MINEN.find(x=>x.id===id);
    if (m.stillBis > S.tag) continue;
    let f = foerderBonus * ausbauFaktor(m.ausbau);
    if (m.malusBis > S.tag) f *= m.malus;
    f *= 0.55 + (m.zufriedenheit/100) * 0.6;          // müde, unzufriedene Leute fördern weniger
    const menge = m.arbeiter * def.ergiebigkeit * f;
    if (menge > 0){
      S.erz[def.mat] = (S.erz[def.mat] || 0) + menge;
      if (!S.erzGesamt) S.erzGesamt = {};
      S.erzGesamt[def.mat] = (S.erzGesamt[def.mat] || 0) + menge;
      letzteFoerderung[id] = menge;
    }
  }

  // 3) Raffination: Roherz → Material
  const hafen = globalWert("hafen") * perkMult("durchsatz");
  const ausbeuteBonus = perkMult("ausbeute");
  for (const id in S.raff){
    const r = S.raff[id], def = RAFF_ORTE.find(x=>x.id===id);
    if (r.arbeiter === 0) continue;
    const rest = def.kapazitaet * ausbauFaktor(r.ausbau) * (r.arbeiter / def.plaetze) * hafen;
    // Die Kapazitaet wird anteilig auf alle vorhandenen Erze verteilt,
    // damit nicht immer nur das erste Material in der Liste verarbeitet wird.
    const vorrat = Object.keys(MATERIAL).filter(k => (S.erz[k]||0) > 0.5);
    const total = vorrat.reduce((a,k) => a + S.erz[k], 0);
    if (total <= 0) continue;
    for (const k of vorrat){
      const anteil = S.erz[k] / total;
      const nimm = Math.min(S.erz[k], rest * anteil);
      S.erz[k] -= nimm;
      S.mat[k] = (S.mat[k] || 0) + nimm * MATERIAL[k].ausbeute * ausbeuteBonus;
    }
  }

  // 4) Fabrikbau + Produktion
  //    Knappes Material wird ANTEILIG auf alle Fabriken verteilt: keine
  //    Fabrik nimmt der anderen alles weg, nur weil sie zuerst dran ist.
  const fabrikBonus = perkMult("fabrik");
  const laufende = [];
  for (const f of S.fabriken){
    if (f.restbau > 0){ f.restbau--; if (f.restbau === 0) notiz(`Fabrik <b>${PRODUKT[f.produkt].name}</b> in ${fabOrt(f.land)} nimmt die Produktion auf.`, "gut"); continue; }
    if (f.arbeiter === 0) continue;
    const def = PRODUKT[f.produkt];
    const wunsch = Math.floor(f.arbeiter * def.proArbeiter * fabrikBonus * ausbauFaktor(f.ausbau));
    if (wunsch > 0) laufende.push({f, def, wunsch, stueck:0});
  }
  if (laufende.length){
    // Wie viel von jedem Material wollen alle Fabriken zusammen?
    const bedarf = {};
    for (const l of laufende)
      for (const k in l.def.rezept) bedarf[k] = (bedarf[k] || 0) + l.wunsch * l.def.rezept[k];
    // Anteil, den jede Fabrik davon bekommt
    const anteil = {};
    for (const k in bedarf) anteil[k] = Math.min(1, (S.mat[k] || 0) / bedarf[k]);
    for (const l of laufende){
      let f2 = 1;
      for (const k in l.def.rezept) f2 = Math.min(f2, anteil[k]);
      l.stueck = Math.floor(l.wunsch * f2);
      for (const k in l.def.rezept) S.mat[k] -= l.stueck * l.def.rezept[k];
    }
    // Zweiter Durchgang: was übrig bleibt, geht an die wertvollste Ware –
    // sonst läge Material ungenutzt herum.
    laufende.sort((a,b) => b.def.preis - a.def.preis);
    for (const l of laufende){
      let mehr = l.wunsch - l.stueck;
      for (const k in l.def.rezept) mehr = Math.min(mehr, Math.floor((S.mat[k] || 0) / l.def.rezept[k]));
      if (mehr <= 0) continue;
      for (const k in l.def.rezept) S.mat[k] -= mehr * l.def.rezept[k];
      l.stueck += mehr;
    }
    for (const l of laufende)
      if (l.stueck > 0) S.ware[l.f.produkt] = (S.ware[l.f.produkt] || 0) + l.stueck;
  }

  // 5) Verkauf: nur so viel, wie deine Verkäuferinnen schaffen –
  //    und höchstens so viel, wie der Markt an einem Tag aufnimmt.
  const kraft = verkaufsKraft();
  if (kraft > 0){ const erg = wareVerkaufen(kraft); buchen("verkauf", erg.erloes); }

  // 6) Monatsende: Löhne, Betriebskosten, Ruf
  if ((S.tag - 1) % 30 === 0){
    const lohn = lohnsumme();
    const betrieb = (Object.keys(S.raff).length * 9000 + S.fabriken.length * 14000) * perkMult("betrieb");
    zahlen(lohn, "lohn"); zahlen(betrieb, "betrieb");
    if (!S.lohnLand) S.lohnLand = {};
    const jeLand = lohnNachLand();
    for (const l in jeLand) S.lohnLand[l] = (S.lohnLand[l] || 0) + jeLand[l];
    notiz(`Monatsabschluss: Löhne ${chf(lohn)}, Betrieb ${chf(betrieb)}.`, "geld");
    rufAnpassen();
    if (S.kasse < 0) notiz("Die Kasse ist im Minus. Ohne Gegensteuer ist die Firma bald zahlungsunfähig.", "alarm");
  }

  // 7) Marktbewegung: Preise wandern zufällig
  if (S.tag % 5 === 0) marktBewegen();

  // 8) Ereignisse
  ereignisPruefen();

  // 9) Ende der Runde?
  if (S.tag > ZIEL_TAGE || S.kasse < -1200000) rundeBeenden();
  speichern();
}

function rufAnpassen(){
  let summe = 0, n = 0;
  for (const id in S.minen){ summe += LOHNSTUFE[S.minen[id].stufe].faktor; n++; }
  if (n === 0) return;
  const schnitt = summe / n;
  const ziel = schnitt < 0.85 ? 25 : schnitt < 1.15 ? 64 : 88;
  rufAendern((ziel - S.ruf) * 0.18);
}

function marktBewegen(){
  const k = Object.keys(MATERIAL)[Math.floor(Math.random()*12)];
  const alt = S.preisMod[k] && S.preisMod[k].bis > S.tag ? S.preisMod[k].faktor : 1;
  const neu = klemm(alt * zufall(0.88, 1.14), 0.55, 2.2);
  S.preisMod[k] = {faktor:neu, bis:S.tag + 60};
}

function rundeBeenden(){
  const gewinn = S.eingenommen - S.ausgegeben;
  const geschafft = gewinn >= ZIEL_GEWINN && S.ruf >= ZIEL_RUF;
  S.ende = {gewinn, ruf:Math.round(S.ruf), geschafft};
  tempoSetzen(0);
  speichern();
  klang(geschafft ? "verdopplung" : "warnung");
  bilanzZeigen();
}

function ereignisPruefen(){
  if (S.tag < 12 || S.tag % 2 !== 0) return;
  // Zwingende Ereignisse (Protest, Unfall, Reportage) zuerst
  for (const e of EREIGNISSE){
    if (e.gewicht !== 0) continue;
    if (e.einmalig && S.erledigt[e.id]) continue;
    if (S.erledigt["cool_"+e.id] > S.tag) continue;
    if (!e.passt()) continue;
    S.erledigt[e.id] = true; S.erledigt["cool_"+e.id] = S.tag + 90;
    dialogZeigen(e.bau());
    return;
  }
  // Zufällige Ereignisse
  if (Math.random() > 0.13) return;
  const pool = EREIGNISSE.filter(e => e.gewicht > 0 && !(e.einmalig && S.erledigt[e.id]) && e.passt() && (S.erledigt["cool_"+e.id]||0) <= S.tag);
  if (!pool.length) return;
  const gesamt = pool.reduce((a,e)=>a+e.gewicht, 0);
  let w = Math.random()*gesamt, gewaehlt = pool[0];
  for (const e of pool){ w -= e.gewicht; if (w <= 0){ gewaehlt = e; break; } }
  S.erledigt[gewaehlt.id] = true; S.erledigt["cool_"+gewaehlt.id] = S.tag + 90;
  const erg = gewaehlt.bau();
  if (erg.passiv) notiz(erg.text, erg.art);
  else dialogZeigen(erg);
}

/* Standorte in Längen-/Breitengrad. Einzelne Pins sind leicht
   auseinandergezogen, damit sie sich auf dem Handy nicht überdecken. */
const ORT = {
  kolwezi:[25.5,-10.7], katanga:[28.8,-7.5], rubaya:[28.9,-1.0], kigali:[30.4,-4.2],
  bayanobo:[109.9,41.8], jiangxi:[116.5,27.6], liuzhou:[107.6,24.6],
  sprucepine:[-82,36], mountainpass:[-115.5,35.5],
  greenbushes:[115.6,-33.9], kalgoorlie:[122.5,-30.0],
  atacama:[-67.0,-23.5], escondida:[-70.5,-20.5],
  fresnillo:[-102.9,23.2], sanrafael:[-70.3,-14.2],
  bangka:[105.0,-3.5], sulawesi:[121.5,-2.5],
  obuasi:[-1.7,6.2], boke:[-14.3,10.9], potosi:[-65.7,-19.6],
  r_china:[112.0,20.0], r_malay:[103.3,3.8], r_chile:[-71.5,-25.5],
  r_de:[9.5,49.5], r_usa:[-95.0,29.0],
  f_china:[119.0,31.0], f_vietnam:[105.0,20.5], f_mexiko:[-107.0,27.0],
  f_deutschland:[14.5,52.0], f_usa:[-112.0,33.5]
};

const KARTE_B = 1000, KARTE_H = 560;
const geo = ([lon,lat]) => [ (lon+180)/360*KARTE_B, (78-lat)/138*KARTE_H ];

/* Pins duerfen sich nicht ueberdecken: die Rohposition wird solange leicht
   auseinandergeschoben, bis alle mindestens PIN_ABSTAND auseinander liegen.
   Die Standorte bleiben dadurch ungefaehr, aber tippbar. */
const PIN_ABSTAND = 64;
const POS = {};
(function pinsEntzerren(){
  for (const k in ORT) POS[k] = geo(ORT[k]);
  const ids = Object.keys(POS);
  for (let runde = 0; runde < 120; runde++){
    let bewegt = false;
    for (let i = 0; i < ids.length; i++) for (let j = i+1; j < ids.length; j++){
      const a = POS[ids[i]], b = POS[ids[j]];
      let dx = b[0]-a[0], dy = b[1]-a[1];
      let d = Math.hypot(dx, dy);
      if (d >= PIN_ABSTAND) continue;
      if (d < 0.01){ dx = Math.random()-0.5; dy = Math.random()-0.5; d = 1; }
      const schub = (PIN_ABSTAND - d) / 2 / d;
      a[0] -= dx*schub; a[1] -= dy*schub;
      b[0] += dx*schub; b[1] += dy*schub;
      bewegt = true;
    }
    // Federkraft zurueck zum echten Ort: die Karte bleibt so nah wie moeglich an der Geografie
    for (const k of ids){
      const z = geo(ORT[k]);
      POS[k][0] += (z[0]-POS[k][0])*0.10;
      POS[k][1] += (z[1]-POS[k][1])*0.10;
    }
    if (!bewegt) break;
  }
  for (const k in POS){
    POS[k][0] = Math.max(22, Math.min(KARTE_B-22, POS[k][0]));
    POS[k][1] = Math.max(26, Math.min(KARTE_H-14, POS[k][1]));
  }
})();
const px = id => POS[id];

/* Duenne Linie vom echten Ort zum verschobenen Pin, damit die Geografie stimmt */
function ankerLinien(){
  return Object.keys(ORT).map(k => {
    const [gx,gy] = geo(ORT[k]), [pxx,pyy] = POS[k];
    if (Math.hypot(gx-pxx, gy-pyy) < 6) return "";
    return `<line x1="${gx.toFixed(1)}" y1="${gy.toFixed(1)}" x2="${pxx.toFixed(1)}" y2="${pyy.toFixed(1)}"
      stroke="#00000030" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="2.2" fill="#00000045"/>`;
  }).join("");
}

function ansichtAnwenden(){
  const b = sicht.clientWidth, hh = sicht.clientHeight;
  const zmin = Math.max(b/KARTE_B, 0.95), zmax = 4.5;
  ansicht.z = Math.min(zmax, Math.max(zmin, ansicht.z));
  const bb = KARTE_B*ansicht.z, bh = KARTE_H*ansicht.z;
  ansicht.x = bb <= b ? (b-bb)/2 : Math.min(0, Math.max(b-bb, ansicht.x));
  ansicht.y = bh <= hh ? (hh-bh)/2 : Math.min(0, Math.max(hh-bh, ansicht.y));
  welt.style.transform = `translate(${ansicht.x}px,${ansicht.y}px) scale(${ansicht.z})`;
  pinGroesse();
}

/* Pins behalten ihre Bildschirmgroesse, schrumpfen aber leicht beim Herauszoomen. */
function pinGroesse(){
  const k = Math.max(0.62, Math.min(1, 0.45 + ansicht.z*0.55));
  const s = k / ansicht.z;
  welt.classList.toggle("weit", ansicht.z < 0.99);
  document.querySelectorAll(".pin").forEach(p => p.style.transform = `translate(-50%,-100%) scale(${s})`);
}

function zoomUm(f, mx, my){
  const b = sicht.clientWidth, hh = sicht.clientHeight;
  mx = mx ?? b/2; my = my ?? hh/2;
  const alt = ansicht.z, neu = alt*f;
  ansicht.x = mx - (mx-ansicht.x)*(neu/alt);
  ansicht.y = my - (my-ansicht.y)*(neu/alt);
  ansicht.z = neu; ansichtAnwenden();
}

/* ---------- Ziehen und Zoomen ---------- */
(function steuerung(){
  const zeiger = new Map();
  let start = null, bewegt = 0, gefangen = false;
  sicht.addEventListener("pointerdown", e => {
    zeiger.set(e.pointerId, {x:e.clientX, y:e.clientY});
    // Erst greifen, wenn wirklich gezogen wird – sonst schluckt der Zeigerfang die Tipps auf Pins.
    if (zeiger.size === 1){ start = {x:e.clientX-ansicht.x, y:e.clientY-ansicht.y}; bewegt = 0; gefangen = false; }
  });
  sicht.addEventListener("pointermove", e => {
    if (!zeiger.has(e.pointerId)) return;
    const vor = zeiger.get(e.pointerId);
    zeiger.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (zeiger.size === 2){
      const [a,b] = [...zeiger.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (steuerung.dist) zoomUm(d/steuerung.dist, (a.x+b.x)/2, (a.y+b.y)/2);
      steuerung.dist = d; return;
    }
    if (!start) return;
    bewegt += Math.abs(e.clientX-vor.x) + Math.abs(e.clientY-vor.y);
    if (bewegt < 9) return;
    if (!gefangen){ gefangen = true; sicht.classList.add("zieht");
      try { sicht.setPointerCapture(e.pointerId); } catch(err){} }
    ansicht.x = e.clientX - start.x; ansicht.y = e.clientY - start.y;
    ansichtAnwenden();
  });
  const ende = e => { zeiger.delete(e.pointerId); if (zeiger.size < 2) steuerung.dist = null;
    if (!zeiger.size){ start = null; gefangen = false; sicht.classList.remove("zieht"); } };
  sicht.addEventListener("pointerup", ende);
  sicht.addEventListener("pointercancel", ende);
  sicht.addEventListener("wheel", e => { e.preventDefault();
    zoomUm(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});
  window.addEventListener("resize", () => { ansichtAnwenden(); masseMessen(); });
})();

const frischePins = new Map();          // id -> Zeitpunkt des Kaufs (für die Pop-Animation)
function pinFeiern(id){ frischePins.set(id, Date.now()); }

function pinsZeichnen(){
  const jetzt = Date.now();
  const ziel = typeof hinweisZiel === "function" ? hinweisZiel() : null;
  const winkt = (art, offen, erlaubt) => {
    if (!ziel) return "";
    if (ziel === art + "-frei"  && !offen) return erlaubt === false ? "blass" : "wink";
    if (ziel === "meine-" + art &&  offen) return "wink";
    if (ziel.startsWith("dock:")) return "";
    return "blass";
  };
  const frisch = id => (jetzt - (frischePins.get(id)||0)) < 900 ? "pop" : "";
  const staub = `<span class="staub"></span><span class="staub b"></span><span class="staub c"></span>`;
  /* Kleine Leute, die vor einer laufenden Mine hin und her gehen */
  const leute = n => [...Array(Math.max(1, Math.min(3, n)))].map((_,i) =>
    `<span class="laeufer l${i}"><svg viewBox="0 0 22 32" aria-hidden="true">${
      kumpel(10, 30, .95, i%2?"#4d94c6":"#3f7fb0", i*.35)}</svg></span>`).join("");

  const gebaut = [];   // {id, sig, html}

  if (ebenen.mine) for (const def of MINEN){
    const [x,y] = px(def.id);
    const m = S.minen[def.id], mat = MATERIAL[def.mat];
    const streik = m && m.stillBis > S.tag;
    const foerdert = m && m.arbeiter > 0 && !streik;
    const klassen = `${m?"":"zu"} ${streik?"alarm":""} ${foerdert?"foerdert":""} ${winkt("minen", !!m, mineErlaubt(def.id))} ${frisch(def.id)}`;
    gebaut.push({id:"m_"+def.id, sig:klassen + "|" + (m?m.arbeiter:0),
      html:`<button class="pin ${klassen}" data-pin="mine" data-id="${def.id}"
        style="left:${x}px;top:${y}px" aria-label="Mine ${def.ort}, ${LAND[def.land].name}">
        <span class="knopf" style="${m?`background:${mat.farbe};color:#fff`:""}">
          ${m?`<span class="sym">${mat.sym}</span>`:IK.hacke}
          ${foerdert?staub:""}
          ${m&&m.arbeiter?`<span class="crew">${m.arbeiter}</span>`:""}</span>
        ${foerdert?`<span class="treiben">${leute(Math.ceil(m.arbeiter/15))}</span>`:""}
        <span class="bez">${flagge(def.land)}${def.ort}</span></button>`});
  }

  if (ebenen.raff) for (const def of RAFF_ORTE){
    const [x,y] = px(def.id);
    const r = S.raff[def.id];
    const laeuft = r && r.arbeiter > 0;
    const klassen = `werk ${r?"":"zu"} ${laeuft?"kocht":""} ${winkt("raff", !!r)} ${frisch(def.id)}`;
    gebaut.push({id:"r_"+def.id, sig:klassen + "|" + (r?r.arbeiter:0),
      html:`<button class="pin ${klassen}" data-pin="raff" data-id="${def.id}"
        style="left:${x}px;top:${y}px" aria-label="Raffinerie ${def.ort}, ${LAND[def.land].name}">
        <span class="knopf" style="${r?"background:#5b8f7a;color:#fff":""}">${IK.kolben}
          ${laeuft?`<span class="blubb"></span><span class="blubb b"></span><span class="blubb c"></span>`:""}
          ${r&&r.arbeiter?`<span class="crew">${r.arbeiter}</span>`:""}</span>
        <span class="bez">${flagge(def.land)}${def.ort}</span></button>`});
  }

  if (ebenen.fab) for (const land of FAB_ORTE){
    const [x,y] = px("f_"+land);
    const meine = S.fabriken.filter(f => f.land === land);
    const crew = meine.reduce((a,f)=>a+f.arbeiter, 0);
    const laeuft = meine.some(f => f.restbau === 0 && f.arbeiter > 0);
    const klassen = `werk ${meine.length?"":"zu"} ${laeuft?"raucht":""} ${winkt("fab", !!meine.length)} ${frisch("f_"+land)}`;
    gebaut.push({id:"f_"+land, sig:klassen + "|" + crew,
      html:`<button class="pin ${klassen}" data-pin="fab" data-id="${land}"
        style="left:${x}px;top:${y}px" aria-label="Fabrikstandort ${fabOrt(land)}, ${LAND[land].name}">
        <span class="knopf" style="${meine.length?"background:#b5703c;color:#fff":""}">${IK.fabrik}
          ${laeuft?`<span class="qualm"></span><span class="qualm b"></span>`:""}
          ${crew?`<span class="crew">${crew}</span>`:""}</span>
        <span class="bez">${flagge(land)}${fabOrt(land)}</span></button>`});
  }

  /* Nur austauschen, was sich geändert hat – sonst würden die Animationen
     (laufende Leute, Rauch, Blasen) bei jedem Spieltag neu starten. */
  const vorhanden = new Map();
  welt.querySelectorAll(".pin").forEach(p => vorhanden.set(p.dataset.schluessel, p));
  const behalten = new Set();
  for (const g of gebaut){
    behalten.add(g.id);
    const alt = vorhanden.get(g.id);
    if (alt && alt.dataset.sig === g.sig) continue;
    const huelle = document.createElement("div");
    huelle.innerHTML = g.html;
    const neu = huelle.firstElementChild;
    neu.dataset.schluessel = g.id;
    neu.dataset.sig = g.sig;
    if (alt) alt.replaceWith(neu); else welt.appendChild(neu);
  }
  vorhanden.forEach((el, id) => { if (!behalten.has(id)) el.remove(); });
  pinGroesse();
}

/* Karte auf einen Ort zentrieren, damit man nach dem Bauen sieht, wo es passiert ist. */
function zeigeAuf(id, z){
  const [mx,my] = px(id);
  ansicht.z = z || Math.max(ansicht.z, 1.6);
  ansicht.x = sicht.clientWidth/2 - mx*ansicht.z;
  ansicht.y = sicht.clientHeight/2 - my*ansicht.z;
  ansichtAnwenden();
}
/* Bildschirmposition eines Pins – für die Funken beim Kauf */
function pinAufSchirm(id){
  const [mx,my] = px(id);
  return [ansicht.x + mx*ansicht.z, ansicht.y + my*ansicht.z];
}

/* Gibt es schon eine offene Mine für dieses Material? Liefert die ID. */
function materialMine(k){
  return Object.keys(S.minen).find(id => MINEN.find(x => x.id === id).mat === k) || null;
}

/* Das Tutorial hält den Weg frei: Solange es läuft, sind nur die Minen
   für Kupfer, Aluminium und Zinn kaufbar, nur eine Raffinerie, nur eine
   Fabrik – und dort nur das Ladekabel. So kann kein Geld verloren gehen,
   bevor die Kette einmal ganz gelaufen ist. */
function mineErlaubt(id){
  if (!tutorialLaeuft()) return true;
  const def = MINEN.find(x => x.id === id);
  if (!def || !START_MATERIALIEN.includes(def.mat)) return false;
  const schon = materialMine(def.mat);
  return !schon || schon === id;          // pro Material genau eine Mine
}
function gesperrt(art, id){
  if (!tutorialLaeuft()) return false;
  if (art === "mine") return !mineErlaubt(id);
  if (art === "raff") return Object.keys(S.raff).length > 0;
  if (art === "fab")  return S.fabriken.length > 0;
  return false;
}
const SPERRTEXT = "Im Tutorial gesperrt";

function tutorialPruefen(){
  while (tutorialLaeuft() && TUTORIAL[S.tutorial].fertig()){
    const erledigt = TUTORIAL[S.tutorial];
    S.tutorial++;
    notiz(tutorialLaeuft() ? "Erledigt: " + erledigt.titel
                           : "Tutorial geschafft – alle Standorte, alle Produkte und der Ausbau von Minen und Raffinerien sind jetzt offen.", "gut");
  }
}

/* ---------- Ton ----------
   Kleine Klänge, direkt im Browser erzeugt – keine Dateien, kein Netz.
   Lautstärke steht in den Einstellungen, 0 heisst stumm.            */
const KLAENGE = {
  kauf:      {noten:[[523,0,.10],[784,.07,.14]],           form:"triangle", stark:.5},
  erfolg:    {noten:[[523,0,.10],[659,.09,.10],[784,.18,.22]], form:"triangle", stark:.55},
  verdopplung:{noten:[[523,0,.09],[659,.08,.09],[784,.16,.09],[1047,.24,.3]], form:"triangle", stark:.6},
  muenze:    {noten:[[988,0,.06],[1319,.05,.09]],          form:"sine",     stark:.35},
  klick:     {noten:[[440,0,.05]],                          form:"sine",     stark:.25},
  warnung:   {noten:[[330,0,.14],[247,.12,.22]],            form:"sawtooth", stark:.3},
  fehler:    {noten:[[196,0,.18]],                          form:"square",   stark:.22}
};
let tonRaum = null;
function klang(name){
  if (!OPT.ton) return;
  const k = KLAENGE[name]; if (!k) return;
  try {
    if (!tonRaum){
      const AK = window.AudioContext || window.webkitAudioContext;
      if (!AK) return;
      tonRaum = new AK();
    }
    if (tonRaum.state === "suspended") tonRaum.resume();
    const jetzt = tonRaum.currentTime, laut = (OPT.ton/100) * k.stark;
    for (const [hz, ab, dauer] of k.noten){
      const o = tonRaum.createOscillator(), g = tonRaum.createGain();
      o.type = k.form; o.frequency.value = hz;
      g.gain.setValueAtTime(0.0001, jetzt + ab);
      g.gain.exponentialRampToValueAtTime(laut, jetzt + ab + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, jetzt + ab + dauer);
      o.connect(g); g.connect(tonRaum.destination);
      o.start(jetzt + ab); o.stop(jetzt + ab + dauer + 0.02);
    }
  } catch(e){}
}

/* ---------- Funken: kleine Feier bei Käufen ---------- */
const FUNKENFARBEN = ["#f5b73d","#ffe9a8","#2fbe7e","#6fb8e0","#fff"];
function funken(x, y, farben, n){
  if (OPT.anim === 0) return;
  farben = farben || FUNKENFARBEN;
  const lage = $("#funken");
  const anz = Math.round((n || 16) * (OPT.anim === 2 ? 1.7 : 1));
  for (let i=0;i<anz;i++){
    const s = document.createElement("span");
    const w = Math.random()*Math.PI*2, d = 40 + Math.random()*95;
    s.className = "funke";
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.background = farben[i % farben.length];
    s.style.borderRadius = i % 3 ? "3px" : "50%";
    s.style.setProperty("--dx", Math.round(Math.cos(w)*d) + "px");
    s.style.setProperty("--dy", Math.round(Math.sin(w)*d - 34) + "px");
    s.style.setProperty("--dr", Math.round(Math.random()*540-270) + "deg");
    lage.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
function funkenAn(el, farben, n){
  if (!el) return;
  const r = el.getBoundingClientRect();
  funken(r.left + r.width/2, r.top + r.height/2, farben, n);
}
/* Einzug: Karten fliegen gestaffelt herein. Der Wecker nimmt die Klasse
   danach wieder weg – so kann keine hängende Animation Inhalte verstecken. */
function einzug(el){
  if (!el) return;
  clearTimeout(el._einzugUhr);
  el.classList.remove("rein");
  if (OPT.anim === 0) return;
  void el.offsetWidth;
  el.classList.add("rein");
  el._einzugUhr = setTimeout(() => el.classList.remove("rein"), 1000);
}
