/* ---------- Wegweiser ---------- */
function naechsterSchritt(){
  const minen = Object.keys(S.minen);
  if (!minen.length) return ["Eröffne deine erste Mine", "Tippe auf einen hellen Pin. Günstig sind Boké, Katanga und Kolwezi."];
  if (minen.every(id => S.minen[id].arbeiter === 0)) return ["Schick Leute in die Mine", "Ohne Arbeiter wird nichts gefördert."];
  const gefahr = minen.find(id => S.minen[id].zufriedenheit < 35 && S.minen[id].arbeiter > 0);
  if (gefahr) return ["Streikgefahr in " + MINEN.find(x=>x.id===gefahr).ort, "Zufriedenheit unter 35 %. Erhöh dort den Lohn."];
  if (!Object.keys(S.raff).length) return ["Bau eine Raffinerie", "Roherz allein nützt nichts. Erst die Raffinerie macht Material daraus."];
  const kapa = Object.keys(S.raff).reduce((a,id)=>{ const d=RAFF_ORTE.find(x=>x.id===id); return a + d.kapazitaet*(S.raff[id].arbeiter/d.plaetze); }, 0);
  if (kapa === 0) return ["Die Raffinerie steht still", "Schick Arbeiter hin, sonst stapelt sich dein Erz."];
  if (Object.values(S.erz).reduce((a,b)=>a+b,0) > kapa*5) return ["Deine Raffinerie kommt nicht nach", "Mehr Arbeiter dort – oder eine zweite bauen."];
  if (!S.fabriken.length) return ["Bau deine erste Fabrik", "Tippe auf einen Fabrik-Pin. Das Ladekabel braucht am wenigsten Materialien."];
  const leer = S.fabriken.findIndex(f => f.restbau === 0 && f.arbeiter === 0);
  if (leer >= 0) return ["Deine Fabrik hat keine Leute", "Sie ist fertig, produziert aber nichts."];
  for (const f of S.fabriken){
    if (f.restbau > 0) continue;
    const fehlt = Object.keys(PRODUKT[f.produkt].rezept).filter(k => (S.mat[k]||0) < PRODUKT[f.produkt].rezept[k]*3);
    if (fehlt.length){
      const k = fehlt[0], eigene = materialMine(k);
      if (!eigene) return ["Es fehlt " + MATERIAL[k].name,
        "Rohstoffe kannst du nicht zukaufen. Eröffne eine Mine für " + MATERIAL[k].name + "."];
      const d = MINEN.find(x => x.id === eigene);
      return ["Zu wenig " + MATERIAL[k].name,
        `Deine Mine in ${d.ort} kommt nicht nach. Schick mehr Leute hin oder bau sie aus.`];
    }
  }
  if (warenLager() > 0 && verkaufsKraft() === 0)
    return ["Deine Ware bleibt liegen", "Stell im Markt Verkäufer an – oder verkauf einmal selber."];
  if (warenLager() > verkaufsKraft() * 12 && verkaufsKraft() > 0)
    return ["Das Lager füllt sich schneller als du verkaufst", "Mehr Verkäufer anstellen, sonst fällt der Preis."];
  if (freieArbeiter() > 15) return [freieArbeiter() + " Leute ohne Aufgabe", "Sie kosten trotzdem Lohn. Einteilen oder entlassen."];
  if (S.ruf < 55) return ["Dein Ruf ist tief", "Das senkt die Nachfrage nach allen Produkten. Prüf die Löhne."];
  const offen = WISSEN.filter(s => naechsterPerk(s) && S.kasse > naechsterPerk(s).kosten*2.5);
  if (offen.length) return ["Neues Wissen ist bezahlbar", `Im Reiter Wissen: «${naechsterPerk(offen[0]).titel}» im Feld ${offen[0].titel}.`];
  // Ausbau lohnt sich vor allem kurz vor einer Verdopplung
  for (const id in S.minen){
    const d = MINEN.find(x=>x.id===id), st = S.minen[id].ausbau || 0;
    if (ausbauVerdoppelt(st) && S.kasse > ausbauKosten(d.erschliessung, st) * 1.5)
      return ["Verdopplung in " + d.ort + " möglich", "Die nächste Ausbaustufe verdoppelt dort die Förderung."];
  }
  const billigsteMine = Object.keys(S.minen).sort((a,b) =>
    ausbauKosten(MINEN.find(x=>x.id===a).erschliessung, S.minen[a].ausbau||0)
    - ausbauKosten(MINEN.find(x=>x.id===b).erschliessung, S.minen[b].ausbau||0))[0];
  if (billigsteMine && S.kasse > ausbauKosten(MINEN.find(x=>x.id===billigsteMine).erschliessung, S.minen[billigsteMine].ausbau||0) * 4)
    return ["Du hast Geld auf der Seite", "Bau eine Mine oder Raffinerie aus – jede zehnte Stufe verdoppelt."];
  return null;
}

/* Wie viel Platz braucht der Aufgabenkasten oben auf einer Seite? */
function questHoeheMessen(){
  const k = $("#quest"), kopf = $("#seitenkopf");
  if (aktiveSeite === "karte" || kopf.hidden){
    document.documentElement.style.setProperty("--questh", "0px"); return;
  }
  const oben = seite.getBoundingClientRect().top;
  let unten = kopf.getBoundingClientRect().bottom;
  if (!k.hidden && k.classList.contains("breit"))
    unten = Math.max(unten, k.getBoundingClientRect().bottom);
  document.documentElement.style.setProperty("--questh", Math.max(0, Math.round(unten - oben) + 12) + "px");
}

/* Zeigt entweder die Tutorial-Aufgabe oder danach den Wegweiser.
   Der Kasten bleibt immer oben – auf der Karte rechts, sonst über die
   ganze Breite. */
function questZeichnen(){
  const k = $("#quest");
  const t = tutorialSchritt();
  k.classList.toggle("breit", aktiveSeite !== "karte");
  if (t){
    $("#q-emoji").innerHTML = IK[t.ikon] || IK.ziel;
    $("#q-art").textContent = `Aufgabe ${S.tutorial+1}/${TUTORIAL.length}`;
    $("#q-stand").textContent = "";
    $("#q-titel").textContent = t.titel;
    $("#q-text").textContent = t.text;
    $("#q-punkte").innerHTML = TUTORIAL.map((_,i) =>
      `<i class="${i < S.tutorial ? "ok" : i === S.tutorial ? "jetzt" : ""}"></i>`).join("");
    k.hidden = false;
    questHoeheMessen();
    return;
  }
  const a = auftragJetzt();
  if (a){
    const [ist, soll] = a.stand();
    $("#q-emoji").innerHTML = IK[a.ikon] || IK.ziel;
    $("#q-art").textContent = `Auftrag ${(S.auftrag||0)+1}/${AUFTRAEGE.length}`;
    $("#q-stand").textContent = a.anzeige ? a.anzeige() : (soll > 1 ? `${Math.min(ist,soll)}/${soll}` : "");
    $("#q-titel").textContent = a.titel;
    $("#q-text").textContent = a.text;
    $("#q-punkte").innerHTML = AUFTRAEGE.map((_,i) =>
      `<i class="${i < (S.auftrag||0) ? "ok" : i === (S.auftrag||0) ? "jetzt" : ""}"></i>`).join("");
    k.hidden = false;
    // kleine Feier, wenn gerade ein Auftrag fertig wurde
    if (belohnung && belohnung.tag === S.tag && !k.classList.contains("belohnt")){
      k.classList.add("belohnt");
      const r = k.getBoundingClientRect();
      funken(r.left + r.width/2, r.top + r.height/2, ["#2fbe7e","#f5b73d","#fff","#6fb8e0"], 30);
      klang("erfolg");
      setTimeout(()=>k.classList.remove("belohnt"), 950);
      belohnung = null;
    }
    questHoeheMessen();
    return;
  }
  $("#q-stand").textContent = "";
  const w = naechsterSchritt();
  if (!w || offenesBlatt){ k.hidden = true; questHoeheMessen(); return; }
  $("#q-emoji").innerHTML = IK.pfeil;
  $("#q-art").textContent = "Nächster Schritt";
  $("#q-titel").textContent = w[0];
  $("#q-text").textContent = w[1];
  $("#q-punkte").innerHTML = "";
  k.hidden = false;
  questHoeheMessen();
}

/* ---------- Ausbau-Karte (Mine wie Raffinerie) ----------
   Zehn Kästchen pro Reihe, das zehnte verdoppelt. Frisch gekaufte
   Stufen ploppen kurz auf.                                          */
let frischeStufe = {};        // id -> Zeitpunkt der letzten Stufe
function ausbauKarte(art, id, stufe, grundpreis, was, index){
  stufe = stufe || 0;
  const reihen  = Math.floor(stufe / AUSBAU_REIHE);
  const inReihe = stufe % AUSBAU_REIHE;
  const kosten  = ausbauKosten(grundpreis, stufe);
  const geht    = S.kasse >= kosten && stufe < AUSBAU_MAX;
  const doppelt = ausbauVerdoppelt(stufe);
  const frisch  = Date.now() - (frischeStufe[id] || 0) < 800;

  const kaesten = [...Array(AUSBAU_REIHE)].map((_,i) => {
    const voll = i < inReihe, letzte = i === AUSBAU_REIHE - 1;
    const naechst = i === inReihe && stufe < AUSBAU_MAX;
    return `<i class="${voll?"voll":""} ${letzte?"doppel":""} ${naechst?"naechst":""}
      ${voll && frisch && i === inReihe-1 ? "frisch" : ""}">${letzte ? "×2" : voll ? "✓" : ""}</i>`;
  }).join("");

  return `<div class="karte">
    <div class="ausbaukopf"><h3>Ausbau</h3>
      ${reihen ? `<span class="ausbaumarke">×${Math.pow(2,reihen)}</span>` : ""}</div>
    <div class="ort">Stufe ${stufe} · Reihe ${reihen+1} · ${was} ×${ausbauFaktor(stufe).toFixed(2)}</div>
    <div class="ausbaureihe">${kaesten}</div>
    <div class="zeile"><span>${doppelt ? "Nächste Stufe verdoppelt!" : "Nächste Stufe"}</span>
      <b>${stufe >= AUSBAU_MAX ? "voll ausgebaut" : "+" + Math.round((ausbauFaktor(stufe+1)/ausbauFaktor(stufe)-1)*100) + " %"}</b></div>
    ${stufe >= AUSBAU_MAX ? "" : `<button class="cta ${doppelt?"gruen":""} ${geht&&doppelt?"puls":""}"
      data-tun="ausbau" data-art="${art}" data-id="${id}" ${index!=null?`data-i="${index}"`:""} ${geht?"":"disabled"}>
      ${geht?IK.berg:""}${geht ? (doppelt ? "VERDOPPELN · " : "Ausbauen · ") + chf(kosten) : "Zu wenig Geld · " + chf(kosten)}</button>`}
    <div class="notiz">Jede Stufe bringt +5 % und kostet mehr als die vorherige. Jede zehnte Stufe verdoppelt die Ausbringung.</div>
  </div>`;
}

/* ---------- Standort schliessen ----------
   Wer sich verbaut hat, soll wieder herauskommen: 40 % des Gebauten
   kommen zurück, die Leute gehen ins Team zurück. Wer Belegschaft
   entlässt, verliert etwas Ruf.                                     */
function schliessKarte(art, id, grundpreis, stufe, arbeiter, index){
  const zurueck = Math.round((grundpreis + ausbauInvestiert(grundpreis, stufe)) * RUECK_ANTEIL);
  return `<div class="karte">
    <h3>Standort schliessen</h3>
    <div class="ort">Wenn du dich verbaut hast, kommst du hier wieder heraus</div>
    <div class="zeile"><span>Du bekommst zurück</span><b>${chf(zurueck)}</b></div>
    <div class="zeile"><span>Leute gehen ins Team zurück</span><b>${arbeiter}</b></div>
    ${arbeiter > 0 ? `<div class="zeile"><span>Ruf</span><b style="color:var(--alarm)">−4</b></div>` : ""}
    <button class="cta still" data-tun="schliessen" data-art="${art}" data-id="${id}"
      ${index!=null?`data-i="${index}"`:""}>Schliessen · ${chf(zurueck)} zurück</button>
    <div class="notiz">40 % des Gebauten kommen zurück. Der Rest ist weg – ein Bergwerk lässt sich nicht einpacken.</div>
  </div>`;
}

/* ---------- Blatt: Mine ---------- */
function blattMine(id){
  const def = MINEN.find(x=>x.id===id), m = S.minen[id];
  const mat = MATERIAL[def.mat], land = LAND[def.land];
  const kopf = `<div class="titelzeile">${flagge(def.land,"gross")}
    <div><h2>${def.ort}</h2><div class="ort">${land.name} · Mine</div></div></div>`;
  const band = `<div class="erzband" style="background:${mat.farbe}"><span class="kugel">${mat.sym}</span>${mat.name}</div>`;

  if (!m){
    const zu = gesperrt("mine", id);
    const geht = S.kasse >= def.erschliessung && !zu;
    return kopf + band + szeneMine(def, null)
      + (zu ? `<div class="notiz">${START_MATERIALIEN.includes(def.mat)
            ? `Für <b>${mat.name}</b> hast du bereits eine Mine. Im Tutorial genügt eine pro Material.`
            : `Im Tutorial eröffnest du zuerst die Minen für <b>Kupfer, Aluminium und Zinn</b> – die drei Rohstoffe deines Ladekabels. Danach werden alle Standorte frei.`}</div>` : "")
      + `<div class="werte">
        <div class="wert"><span class="wi">${IK.berg}</span><span class="wt"><small>Ergiebigkeit</small><b>${def.ergiebigkeit} Erz</b></span></div>
        <div class="wert"><span class="wi">${IK.person}</span><span class="wt"><small>Plätze</small><b>${def.plaetze}</b></span></div>
        <div class="wert"><span class="wi">${IK.muenze}</span><span class="wt"><small>Lohn üblich</small><b>${chf(land.lohn)}</b></span></div>
        <div class="wert"><span class="wi">${IK.gluehbirne}</span><span class="wt"><small>Wofür</small><b style="font-size:var(--f0)">${mat.wofuer}</b></span></div>
      </div>
      <div class="notiz">${def.info}</div>
      <button class="cta ${geht?"puls":""}" data-tun="mine-auf" data-id="${id}" ${geht?"":"disabled"}>
        ${geht?IK.hacke:""}${zu ? SPERRTEXT : geht ? "Mine eröffnen · " + chf(def.erschliessung) : "Zu wenig Geld · " + chf(def.erschliessung)}</button>`;
  }

  const st = LOHNSTUFE[m.stufe], zuf = Math.round(m.zufriedenheit);
  const farbe = zuf < 32 ? "var(--alarm)" : zuf < 60 ? "var(--warn)" : "var(--gruen)";
  const still = m.stillBis > S.tag;
  const ertrag = still ? 0 : m.arbeiter * def.ergiebigkeit * (0.55 + zuf/100*0.6)
                             * (m.malusBis>S.tag ? m.malus : 1) * perkMult("foerderung")
                             * ausbauFaktor(m.ausbau);
  const leuteBild = ikonTeam(Math.max(1, Math.ceil(m.arbeiter / Math.max(1, def.plaetze/5))), 60, .34);

  return kopf + band + szeneMine(def, m)
    + (still ? `<div class="notiz rot"><b>Die Mine steht still.</b>${m.stillBis-S.tag<900?" Noch "+(m.stillBis-S.tag)+" Tage.":""}</div>` : "")
    + `<div class="werte">
      <div class="wert"><span class="wi">${IK.berg}</span><span class="wt"><small>Förderung</small><b>${ertrag.toFixed(1)}/Tag</b></span></div>
      <div class="wert"><span class="wi">${IK.muenze}</span><span class="wt"><small>Lohnkosten</small><b>${chf(m.arbeiter*land.lohn*st.faktor)}</b></span></div>
    </div>

    <div class="karte">
      <h3>Belegschaft</h3>
      <div class="ort">${m.arbeiter} von ${def.plaetze} Plätzen · ${freieArbeiter()} Leute frei im Team</div>
      <div style="display:flex;justify-content:center">${m.arbeiter?`<div style="width:min(190px,60%)">${leuteBild}</div>`:""}</div>
      <div class="crewzeile">
        <button data-tun="crew" data-id="${id}" data-n="-10" ${m.arbeiter<=0?"disabled":""}>−10</button>
        <button data-tun="crew" data-id="${id}" data-n="-1" ${m.arbeiter<=0?"disabled":""}>−</button>
        <div class="zahl"><b>${m.arbeiter}</b><small>von ${def.plaetze}</small></div>
        <button data-tun="crew" data-id="${id}" data-n="1" ${(freieArbeiter()<=0||m.arbeiter>=def.plaetze)?"disabled":""}>+</button>
        <button data-tun="crew" data-id="${id}" data-n="10" ${(freieArbeiter()<=0||m.arbeiter>=def.plaetze)?"disabled":""}>+10</button>
      </div>
      <div class="leiste"><i style="width:${(m.arbeiter/def.plaetze*100).toFixed(0)}%;background:#6fb8e0"></i></div>
    </div>

    ${tutorialLaeuft() ? "" : ausbauKarte("mine", id, m.ausbau, def.erschliessung, "Förderung")}

    <div class="karte">
      <h3>Lohnstufe</h3>
      <div class="ort">Was du zahlst, entscheidet über Zufriedenheit und Ruf</div>
      <div class="segment">${LOHNSTUFE.map((s,i)=>
        `<button data-tun="lohn" data-id="${id}" data-stufe="${i}" aria-pressed="${i===m.stufe}">
           ${ikonLohn(i, i===m.stufe)}${s.label}</button>`).join("")}</div>
      <div class="zeile"><span>${st.name}</span><b>${chf(land.lohn*st.faktor)}/Mt.</b></div>
      <div class="zeile"><span>Zielwert Zufriedenheit</span><b>${Math.round(st.ziel - (land.risiko-1)*8 + perkPlus("zufrieden"))} %</b></div>
    </div>

    <div class="karte">
      <h3>Zufriedenheit</h3>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:64px;flex:none">${ikonZufrieden(zuf)}</div>
        <div style="flex:1;min-width:0">
          <div class="leiste"><i style="width:${zuf}%;background:${farbe}"></i></div>
          <div class="zeile" style="padding-top:4px"><span>${zuf<32?"Streik ist wahrscheinlich":zuf<60?"angespannt":"gut"}</span><b>${zuf} %</b></div>
        </div>
      </div>
    </div>

    <div class="notiz">${def.info}</div>
    ${tutorialLaeuft() ? "" : schliessKarte("mine", id, def.erschliessung, m.ausbau, m.arbeiter)}`;
}

/* ---------- Blatt: Raffinerie ---------- */
function blattRaff(id){
  const def = RAFF_ORTE.find(x=>x.id===id), r = S.raff[id], land = LAND[def.land];
  const kopf = `<div class="titelzeile">${flagge(def.land,"gross")}
    <div><h2>${def.ort}</h2><div class="ort">${land.name} · Raffinerie</div></div></div>`;
  if (!r){
    const zu = gesperrt("raff");
    const geht = S.kasse >= def.bau && !zu;
    return kopf + szeneRaff(def, null)
      + (zu ? `<div class="notiz">Im Tutorial baust du zuerst nur <b>eine</b> Raffinerie.</div>` : "")
      + `<div class="werte">
        <div class="wert"><span class="wi">${IK.kolben}</span><span class="wt"><small>Kapazität</small><b>${def.kapazitaet}/Tag</b></span></div>
        <div class="wert"><span class="wi">${IK.person}</span><span class="wt"><small>Plätze</small><b>${def.plaetze}</b></span></div>
        <div class="wert"><span class="wi">${IK.muenze}</span><span class="wt"><small>Lohn</small><b>${chf(land.lohn)}</b></span></div>
        <div class="wert"><span class="wi">${IK.kalender}</span><span class="wt"><small>Betrieb</small><b>${chf(9000)}/Mt.</b></span></div>
      </div>
      <div class="notiz">${def.info}</div>
      <button class="cta ${geht?"puls":""}" data-tun="raff-bau" data-id="${id}" ${geht?"":"disabled"}>
        ${geht?IK.kolben:""}${zu ? SPERRTEXT : geht ? "Raffinerie bauen · " + chf(def.bau) : "Zu wenig Geld · " + chf(def.bau)}</button>`;
  }
  const erzda = Object.values(S.erz).reduce((a,b)=>a+b,0);
  return kopf + szeneRaff(def, r) + `
    <div class="werte">
      <div class="wert"><span class="wi">${IK.kolben}</span><span class="wt"><small>Durchsatz</small><b>${Math.round(def.kapazitaet*ausbauFaktor(r.ausbau)*(r.arbeiter/def.plaetze)*globalWert("hafen")*perkMult("durchsatz"))}/Tag</b></span></div>
      <div class="wert"><span class="wi">${IK.berg}</span><span class="wt"><small>Roherz im Lager</small><b>${Math.round(erzda)}</b></span></div>
    </div>
    <div class="karte">
      <h3>Belegschaft</h3>
      <div class="ort">${freieArbeiter()} Leute frei im Team</div>
      <div class="crewzeile">
        <button data-tun="rcrew" data-id="${id}" data-n="-5" ${r.arbeiter<=0?"disabled":""}>−5</button>
        <button data-tun="rcrew" data-id="${id}" data-n="-1" ${r.arbeiter<=0?"disabled":""}>−</button>
        <div class="zahl"><b>${r.arbeiter}</b><small>von ${def.plaetze}</small></div>
        <button data-tun="rcrew" data-id="${id}" data-n="1" ${(freieArbeiter()<=0||r.arbeiter>=def.plaetze)?"disabled":""}>+</button>
        <button data-tun="rcrew" data-id="${id}" data-n="5" ${(freieArbeiter()<=0||r.arbeiter>=def.plaetze)?"disabled":""}>+5</button>
      </div>
      <div class="leiste"><i style="width:${(r.arbeiter/def.plaetze*100).toFixed(0)}%;background:#5b8f7a"></i></div>
    </div>
    <div class="karte">
      <h3>Kommst du nach?</h3>
      <div class="ort">Alle Minen zusammen gegen alle Raffinerien zusammen</div>
      ${engpassBalken(erzProTag(), raffProTag(), "Minen fördern pro Tag", "Raffinerien schaffen pro Tag")}
      ${(() => {
        const f = erzProTag(), k = raffProTag(), halde = Object.values(S.erz).reduce((a,b)=>a+b,0);
        if (k <= 0) return `<div class="notiz rot">Keine Raffinerie besetzt – dein Erz bleibt liegen.</div>`;
        if (f > k * 1.02) return `<div class="notiz rot">Deine Minen fördern <b>${Math.round(f-k)} Erz mehr pro Tag</b>, als verarbeitet werden kann. Das Erz stapelt sich. Mehr Leute in die Raffinerie, ausbauen oder eine zweite bauen.</div>`;
        if (halde > k * 3) return `<div class="notiz">Es liegen noch <b>${Math.round(halde)} Erz</b> auf Halde. Die Raffinerie holt es nach und nach auf.</div>`;
        return `<div class="notiz gruen">Deine Raffinerien kommen mit. Noch <b>${Math.round(k-f)} Erz Reserve</b> pro Tag.</div>`;
      })()}
    </div>
    ${tutorialLaeuft() ? "" : ausbauKarte("raff", id, r.ausbau, def.bau, "Durchsatz")}
    <div class="notiz">Aus 1 Erz wird je nach Material unterschiedlich viel: Silizium 70 %, Gold nur 8 %. Der Rest ist Abraum.</div>
    <div class="notiz blau">${def.info}</div>
    ${tutorialLaeuft() ? "" : schliessKarte("raff", id, def.bau, r.ausbau, r.arbeiter)}`;
}

/* ---------- Blatt: Fabrikstandort ---------- */
function blattFab(land){
  const meine = S.fabriken.map((f,i)=>({f,i})).filter(o => o.f.land === land);
  const kopf = `<div class="titelzeile">${flagge(land,"gross")}
    <div><h2>${fabOrt(land)}</h2><div class="ort">${LAND[land].name} · Fabrikstandort · Lohn ${chf(LAND[land].lohn)}/Monat</div></div></div>
    ${FAB_STADT[land] ? `<div class="notiz">${FAB_STADT[land].info}</div>` : ""}`;

  const laufend = meine.map(({f,i}) => {
    const def = PRODUKT[f.produkt];
    if (f.restbau > 0) return `<div class="karte"><h3>${def.name}</h3>
      <div class="ort">Im Bau – noch ${f.restbau} Tage</div>
      ${szeneFabrik(f, def)}
      <div class="leiste"><i style="width:${(100-f.restbau/def.bauzeit*100).toFixed(0)}%;background:var(--gold)"></i></div></div>`;
    const moeglich = Math.floor(f.arbeiter * def.proArbeiter * perkMult("fabrik") * ausbauFaktor(f.ausbau));
    let stueck = moeglich;
    for (const k in def.rezept) stueck = Math.min(stueck, Math.floor((S.mat[k]||0)/def.rezept[k]));
    const fehlt = Object.keys(def.rezept).filter(k => (S.mat[k]||0) < def.rezept[k]);
    return `<div class="karte"><h3>${def.name}</h3>
      <div class="ort">Verkauf ${chf(warenPreis(f.produkt))} · Nachfrage ${Math.round(nachfrage(f.produkt))}/Tag</div>
      ${szeneFabrik(f, def)}
      <div class="stueck">${Object.keys(def.rezept).map(k =>
        `<span class="${fehlt.includes(k)?"fehlt":""}" style="background:${MATERIAL[k].farbe}">${MATERIAL[k].sym} ${def.rezept[k]}</span>`).join("")}</div>
      <div class="crewzeile">
        <button data-tun="fcrew" data-i="${i}" data-n="-5" ${f.arbeiter<=0?"disabled":""}>−5</button>
        <button data-tun="fcrew" data-i="${i}" data-n="-1" ${f.arbeiter<=0?"disabled":""}>−</button>
        <div class="zahl"><b>${f.arbeiter}</b><small>von ${def.plaetze}</small></div>
        <button data-tun="fcrew" data-i="${i}" data-n="1" ${(freieArbeiter()<=0||f.arbeiter>=def.plaetze)?"disabled":""}>+</button>
        <button data-tun="fcrew" data-i="${i}" data-n="5" ${(freieArbeiter()<=0||f.arbeiter>=def.plaetze)?"disabled":""}>+5</button>
      </div>
      <div class="zeile"><span>Produktion heute</span><b>${stueck} Stück</b></div>
      <div class="zeile"><span>Möglich mit dieser Belegschaft</span><b>${moeglich} Stück</b></div>
      <div class="leiste"><i style="width:${moeglich?Math.min(100,stueck/moeglich*100).toFixed(0):0}%;background:${stueck<moeglich?"var(--warn)":"var(--gruen)"}"></i></div>
      ${stueck < moeglich ? `<div class="notiz rot">Material bremst dich: nur ${stueck} statt ${moeglich} Stück.</div>` : ""}
      <div class="zeile"><span>Lager</span><b>${S.ware[f.produkt]||0} Stück</b></div>
      ${tutorialLaeuft() ? "" : ausbauKarte("fab", land, f.ausbau, def.kosten, "Ausstoss", i)}
      ${tutorialLaeuft() ? "" : schliessKarte("fab", land, def.kosten, f.ausbau, f.arbeiter, i)}
      ${fehlt.length ? `<div class="notiz rot">Es fehlt: ${fehlt.map(k=>MATERIAL[k].name).join(", ")}.
        Zukaufen geht nicht – eröffne dafür eine Mine.</div>` : ""}</div>`;
  }).join("");

  const zu = gesperrt("fab");
  const bauzeitF = perkMult("bauzeit");
  // Im Tutorial gibt es nur das Ladekabel zu bauen.
  const auswahl = tutorialLaeuft() ? [START_PRODUKT] : Object.keys(PRODUKT);
  const neu = auswahl.map(p => {
    const def = PRODUKT[p], geht = S.kasse >= def.kosten && !zu;
    const tage = Math.max(3, Math.round(def.bauzeit * bauzeitF));
    return `<div class="karte"><h3>${def.name}</h3>
      <div class="ort">Verkaufspreis ${chf(def.preis)} · Bauzeit ${tage} Tage · ${def.plaetze} Plätze</div>
      <div class="stueck">${Object.keys(def.rezept).map(k =>
        `<span style="background:${MATERIAL[k].farbe}">${MATERIAL[k].sym} ${def.rezept[k]}</span>`).join("")}</div>
      <div class="notiz">${def.info}</div>
      <button class="cta gruen" data-tun="fab-bau" data-p="${p}" data-l="${land}" ${geht?"":"disabled"}>
        ${geht?IK.fabrik:""}${zu ? SPERRTEXT : geht ? "Hier bauen · " + chf(def.kosten) : "Zu wenig Geld · " + chf(def.kosten)}</button></div>`;
  }).join("");

  return kopf + laufend + (zu ? `<div class="notiz">Im Tutorial baust du zuerst nur <b>eine</b> Fabrik. Danach stehen alle Produkte offen.</div>` : "")
    + `<h3 style="margin:18px 0 8px">${tutorialLaeuft() ? "Dein erstes Produkt" : "Neue Produktlinie"}</h3>` + neu;
}

/* ---------- Blatt füllen (mit laufenden Animationen) ---------- */
let blattStand = "";
function blattFuellen(art, id){
  const neuesFenster = !offenesBlatt || offenesBlatt.art !== art || offenesBlatt.id !== id;
  offenesBlatt = {art, id};
  const html = art === "mine" ? blattMine(id) : art === "raff" ? blattRaff(id) : blattFab(id);
  if (html !== blattStand){
    // Laufende Szenen behalten, damit Hacke und Fliessband nicht bei jedem Takt neu starten
    const alte = new Map();
    if (!neuesFenster) blattinhalt.querySelectorAll(".szene").forEach(s => alte.set(s.dataset.szene, s));
    blattinhalt.innerHTML = html;
    blattinhalt.querySelectorAll(".szene").forEach(s => {
      const a = alte.get(s.dataset.szene);
      if (a) s.replaceWith(a);
    });
    blattStand = html;
    if (neuesFenster){ einzug(blattinhalt); blattinhalt.scrollTop = 0; }
  }
  blatt.classList.add("auf");
  $("#blattschleier").classList.add("auf");
  fensterKlasse();
}
function blattZu(){
  blatt.classList.remove("auf"); $("#blattschleier").classList.remove("auf");
  offenesBlatt = null; blattStand = "";
  fensterKlasse();
}

/* ---------- Seiten ---------- */
let seitenStand = "";
function seiteFuellen(name){
  if (reglerAktiv) return;                       // nicht neu zeichnen, während ein Regler gezogen wird
  const html = {markt:seiteMarkt, team:seiteTeam, ziel:seiteZiel, wissen:seiteWissen}[name]();
  if (html === seitenStand) return;
  seitenStand = html;
  seite.innerHTML = html;
}
function seiteWechseln(name){
  aktiveSeite = name; blattZu(); seitenStand = "";
  seite.hidden = name === "karte";
  $("#seitenkopf").hidden = seite.hidden;
  if (!seite.hidden){ seiteFuellen(name); seite.scrollTop = 0; einzug(seite); }
  zeichnen();
}

function seiteMarkt(){
  const kraft = verkaufsKraft(), lager = warenLager();
  const heuteSchon = S.handverkaufTag === S.tag;
  const frei = freieArbeiter();

  // Was würde ein Handverkauf jetzt einbringen?
  let handStueck = 0;
  for (const p in PRODUKT) handStueck += Math.min(S.ware[p]||0, Math.round(nachfrage(p)));

  const prod = Object.keys(PRODUKT).map(p => {
    const l = S.ware[p]||0;
    return `<tr><td>${PRODUKT[p].name}</td>
      <td class="n" style="${l>0?"color:var(--gruen)":""}">${l}</td>
      <td class="n">${Math.round(nachfrage(p))}</td>
      <td class="n">${Math.round(warenPreis(p))}</td></tr>`;
  }).join("");

  const roh = Object.keys(MATERIAL).map(k => {
    const p = matPreis(k), d = p/MATERIAL[k].preis - 1;

      <td class="n">${Math.round(S.erz[k]||0)}</td>

  }).join("");

  const eff = S.globalMod.filter(m => m.bis > S.tag);

  return `<h1>Markt &amp; Verkauf</h1><div class="unter">Fertige Ware verkauft sich nicht von allein</div>

    <div class="karte" style="background:linear-gradient(#fffdf6,#fdf3dd)">

        ${(heuteSchon || handStueck<=0) ? "disabled" : ""}>
        ${IK.muenze}${handStueck<=0 ? "Nichts zu verkaufen"
          : heuteSchon ? "Heute schon verkauft" : "SELBER VERKAUFEN · " + handStueck + " Stück"}</button>
      <div class="notiz">Einmal pro Tag kannst du selber verkaufen. Wer das nicht jeden Tag machen will, stellt Verkäuferinnen an.</div>

      <h3 style="margin-top:14px">Dein Verkaufsteam</h3>
      <div class="ort">${frei} Leute frei im Team · Lohn ${chf(VERKAUF_LOHN)} pro Person und Monat</div>
      <div style="display:flex;justify-content:center">${(S.verkaeufer||0)
        ? `<div style="width:min(190px,60%)">${ikonTeam(Math.max(1, Math.min(5, Math.ceil((S.verkaeufer||0)/4))), 60, .34)}</div>` : ""}</div>
      <div class="crewzeile">
        <button data-tun="vcrew" data-n="-5" ${(S.verkaeufer||0)<=0?"disabled":""}>−5</button>
        <button data-tun="vcrew" data-n="-1" ${(S.verkaeufer||0)<=0?"disabled":""}>−</button>
        <div class="zahl"><b>${S.verkaeufer||0}</b><small>Verkäufer</small></div>
        <button data-tun="vcrew" data-n="1" ${(frei<=0||(S.verkaeufer||0)>=VERKAUF_PLAETZE)?"disabled":""}>+</button>
        <button data-tun="vcrew" data-n="5" ${(frei<=0||(S.verkaeufer||0)>=VERKAUF_PLAETZE)?"disabled":""}>+5</button>
      </div>
      <div class="zeile"><span>Setzen ab</span><b>${kraft} Stück/Tag</b></div>
      <div class="zeile"><span>Lohnkosten</span><b>${chf((S.verkaeufer||0)*VERKAUF_LOHN)}/Mt.</b></div>
      ${frei <= 0 ? `<div class="notiz rot">Niemand ist gerade frei. Stell zuerst im Team neue Leute an – dann kannst du sie hier in den Verkauf schicken.
        <button class="cta" data-tun="zumteam">${IK.person}Zum Team</button></div>` : ""}
      ${lager > 0 && kraft === 0 ? `<div class="notiz rot">Deine Ware bleibt liegen. Ohne Verkäufer verkauft nur dein eigener Fingerdruck.</div>` : ""}
    </div>

    <div class="karte">
      <h3>Verkaufst du, was du baust?</h3>
      <div class="ort">Tagesproduktion gegen das, was Verkauf und Markt aufnehmen</div>
      ${engpassBalken(fabrikWunsch(), Math.min(kraft, nachfrageGesamt()),
        "Fabriken bauen pro Tag", "Abgesetzt werden können")}
      ${(() => {
        const bau = fabrikWunsch(), ab = Math.min(kraft, nachfrageGesamt());
        if (bau === 0) return "";
        if (kraft === 0) return `<div class="notiz rot">Ohne Verkaufsteam wird gar nichts abgesetzt.</div>`;
        if (kraft < nachfrageGesamt() && bau > kraft)
          return `<div class="notiz rot">Dein Verkaufsteam ist der Engpass: Der Markt würde ${Math.round(nachfrageGesamt())} Stück nehmen, deine Leute schaffen ${kraft}.</div>`;
        if (bau > ab) return `<div class="notiz">Du baust mehr, als der Markt aufnimmt. Das Lager füllt sich und der Preis fällt.</div>`;
        return `<div class="notiz gruen">Alles, was du baust, wird auch verkauft.</div>`;
      })()}
    </div>

    <div class="karte"><h3>Deine Produkte</h3>
      <table><tr><th>Produkt</th><th class="n">Lager</th><th class="n">Nachfr.</th><th class="n">CHF</th></tr>${prod}</table>
      <div class="notiz">Der Markt nimmt pro Tag nur die Nachfrage auf. Produzierst du mehr, füllt sich das Lager und der Preis fällt um bis zu 35 %.</div></div>

    <div class="karte"><h3>Deine Rohstoffe</h3>
      <table><tr><th>Material</th><th class="n">Bereit</th><th class="n">Erz</th><th class="n">Weltpreis</th></tr>${roh}</table>
      <div class="notiz">Rohstoffe kannst du nicht zukaufen. Jedes Material, das du brauchst, muss aus einer eigenen Mine kommen und durch eine Raffinerie gehen.</div></div>

    ${eff.length ? `<div class="karte"><h3>Aktuelle Sondereffekte</h3>${eff.map(m =>
      `<div class="zeile"><span>${m.art==="dollar"?"US-Dollar-Kurs":"Hafen-Durchsatz"}</span><b>${Math.round(m.wert*100)} % · ${m.bis-S.tag} T.</b></div>`).join("")}</div>` : ""}`;
}

function seiteTeam(){
  const rows = [];
  for (const id in S.minen){ const d = MINEN.find(x=>x.id===id);
    if (S.minen[id].arbeiter) rows.push([d.land, "Mine " + d.ort, S.minen[id].arbeiter, LAND[d.land].lohn*LOHNSTUFE[S.minen[id].stufe].faktor]); }
  for (const id in S.raff){ const d = RAFF_ORTE.find(x=>x.id===id);
    if (S.raff[id].arbeiter) rows.push([d.land, "Raffinerie " + d.ort, S.raff[id].arbeiter, LAND[d.land].lohn]); }
  S.fabriken.forEach(f => { if (f.arbeiter) rows.push([f.land, fabOrt(f.land) + " · " + PRODUKT[f.produkt].name, f.arbeiter, LAND[f.land].lohn]); });
  if (S.verkaeufer) rows.push([null, "Verkauf", S.verkaeufer, VERKAUF_LOHN]);
  const menge = anstellbar();

  return `<h1>Dein Team</h1><div class="unter">Jeder Mensch kostet Lohn – auch ohne Aufgabe</div>

    <div class="karte" style="text-align:center;background:linear-gradient(#fffdf6,#fdf3dd)">

      <div class="ort">Ohne Leute fördert keine Mine und läuft keine Fabrik</div>
      ${regler("anstell", "Wie viele?", "Einmalige Einstellungskosten: CHF " + LOHN_PRO_KOPF.toLocaleString("de-CH") + " pro Person.",
               5, 50, 5, anstellMenge, anstellMenge + " Leute")}
      <button class="cta riesig ${geht?"puls":""}" data-tun="anstellen" ${geht?"":"disabled"}>
        ${IK.person}${menge <= 0 ? "Im Tutorial genügen " + TUTORIAL_MAX_LEUTE + " Leute"
          : geht ? "STELL " + menge + " LEUTE AN · " + chf(kosten) : "Zu wenig Geld · " + chf(kosten)}</button>
      <button class="cta still" data-tun="entlassen" ${frei<5?"disabled":""}>−5 entlassen · nur freie Leute</button>
    </div>

    <div class="karte">
      <div class="werte">
        <div class="wert"><span class="wi">${IK.person}</span><span class="wt"><small>Angestellt</small><b>${S.arbeiterGesamt}</b></span></div>
        <div class="wert"><span class="wi">${IK.hacke}</span><span class="wt"><small>Ohne Aufgabe</small><b style="color:${frei>10?"var(--warn)":"inherit"}">${frei}</b></span></div>
        <div class="wert"><span class="wi">${IK.muenze}</span><span class="wt"><small>Lohnsumme</small><b>${chf(lohnsumme())}</b></span></div>
        <div class="wert"><span class="wi">${IK.kalender}</span><span class="wt"><small>pro Tag</small><b>${chf(lohnsumme()/30)}</b></span></div>
      </div>
      <div class="notiz">Nicht eingeteilte Leute kosten CHF 200 pro Monat. Stell nur so viele an, wie du beschäftigen kannst.</div>
    </div>

    <div class="karte"><h3>Wer arbeitet wo?</h3>
      ${rows.length ? `<table><tr><th>Ort</th><th class="n">Leute</th><th class="n">Lohn</th></tr>
        ${rows.map(r=>`<tr><td><span class="flz">${r[0]?flagge(r[0]):`<span style="width:1.7em;display:inline-block">${IK.muenze}</span>`}<span>${r[1]}</span></span></td>
          <td class="n">${r[2]}</td><td class="n">${Math.round(r[3]).toLocaleString("de-CH")}</td></tr>`).join("")}</table>`
      : `<p style="color:var(--grau)">Noch niemand eingeteilt.</p>`}</div>`;
}

      <span class="sicon" style="background:${seg.farbe}22;color:${seg.farbe}">${IK[seg.ikon]||IK.wissen}</span>

        <h3>${seg.titel}</h3>
        <small>${seg.kurz}</small>

        <small style="margin-top:4px">${naechst ? "Nächstes Wissen: " + naechst.titel + " · " + chf(naechst.kosten) : "Alles erforscht"}</small>

}

/* ---------- Wissen: ein Segment öffnen ---------- */
function lupeFuellen(segId){
  const seg = WISSEN.find(s => s.id === segId);
  if (!seg) return;
  offeneLupe = segId;
  const naechst = naechsterPerk(seg);
  const idx = naechst ? seg.perks.indexOf(naechst) : -1;
  const gesperrtDurch = idx > 0 && !S.perks[seg.perks[idx-1].id] ? seg.perks[idx-1] : null;
  const geht = naechst && !gesperrtDurch && S.kasse >= naechst.kosten;

  const erforscht = seg.perks.filter(p => S.perks[p.id]).map(p =>
    `<div class="perkkarte fertig"><span class="marke">Erforscht</span>
      <h3>${p.titel}</h3><p>${p.text}</p>
      <div class="wirkung">${p.wirkung.map(w=>`<span>${w}</span>`).join("")}</div></div>`).join("");

  const angebot = naechst ? `<div class="perkkarte">
      <span class="marke">Neues Wissen</span>
      <h3>${naechst.titel}</h3><p>${naechst.text}</p>
      <div class="wirkung">${naechst.wirkung.map(w=>`<span>${w}</span>`).join("")}</div>
      ${gesperrtDurch ? `<div class="notiz">Zuerst «${gesperrtDurch.titel}» erforschen.</div>` : ""}
      <button class="cta ${geht?"puls":""}" data-tun="perk" data-p="${naechst.id}" ${geht?"":"disabled"}>
        ${geht?IK.gluehbirne:""}${gesperrtDurch ? "Noch gesperrt" : geht ? "Wissen erwerben · " + chf(naechst.kosten) : "Zu wenig Geld · " + chf(naechst.kosten)}</button>
    </div>`
    : `<div class="perkkarte fertig"><span class="marke">Vollständig</span>
        <h3>Dieses Feld ist ausgeforscht</h3><p>Du hast alles Wissen aus «${seg.titel}» erworben.</p></div>`;

  const formeln = seg.formeln ? `<div class="karte"><h3>Formeln</h3><table>${
    seg.formeln.map(f=>`<tr><td>${f[0]}</td><td><code>${f[1]}</code></td></tr>`).join("")}</table></div>` : "";

  const geraet = seg.geraet ? geraetBild() : "";
  const materialTabelle = seg.id === "geologie" ? `<div class="karte"><h3>Woher die Rohstoffe kommen</h3>
    <table><tr><th>Material</th><th>Wichtige Förderländer</th><th class="n">Ausbeute</th></tr>
    ${Object.keys(MATERIAL).map(k => {
      const laender = [...new Set(MINEN.filter(m=>m.mat===k).map(m=>m.land))];
      return `<tr><td><i class="punkt" style="background:${MATERIAL[k].farbe}"></i> <b>${MATERIAL[k].name}</b><br>
        <small style="color:var(--grau);font-weight:600">${MATERIAL[k].wofuer}</small></td>
        <td>${laender.map(l=>`<span class="flz" style="margin-right:6px">${flagge(l,"mini")}<span style="font-size:var(--f0)">${LAND[l].name}</span></span>`).join("")}</td>
        <td class="n">${(MATERIAL[k].ausbeute*100).toFixed(0)} %</td></tr>`;
    }).join("")}</table></div>` : "";

  const rezepte = seg.id === "fabrik" ? `<div class="karte"><h3>Was in einem Gerät steckt</h3>
    ${Object.keys(PRODUKT).map(p=>`<div style="margin-bottom:10px"><b>${PRODUKT[p].name}</b>
      <div class="stueck">${Object.keys(PRODUKT[p].rezept).map(k=>
        `<span style="background:${MATERIAL[k].farbe}">${MATERIAL[k].sym} ${PRODUKT[p].rezept[k]}</span>`).join("")}</div></div>`).join("")}</div>` : "";

  const loehne = seg.id === "leute" ? `<div class="karte"><h3>Monatslöhne im Vergleich</h3>
    <table>${Object.keys(LAND).sort((a,b)=>LAND[a].lohn-LAND[b].lohn).map(l =>
      `<tr><td><span class="flz">${flagge(l)}<span>${LAND[l].name}</span></span></td>
        <td class="n">${LAND[l].lohn.toLocaleString("de-CH")}</td></tr>`).join("")}</table>
    <div class="notiz">Alle Werte sind gerundete Grössenordnungen für einfache Arbeit im Bergbau.</div></div>` : "";

  $("#lupeinhalt").innerHTML = `
    <div class="titelzeile" style="padding-right:52px">
      <span class="sicon" style="background:${seg.farbe}22;color:${seg.farbe};width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none">${IK[seg.ikon]||IK.wissen}</span>
      <div><h2>${seg.titel}</h2><div class="ort">${seg.kurz}</div></div></div>
    ${seg.text.map(t=>`<p>${t}</p>`).join("")}
    ${geraet}${materialTabelle}${loehne}${rezepte}${formeln}
    <div class="karte"><h3>Zum Merken</h3>
      ${seg.fakten.map((f,i)=>`<div class="fakt"><span class="nr">${i+1}</span><span>${f}</span></div>`).join("")}</div>
    ${erforscht}${angebot}`;
  einzug($("#lupeinhalt"));
  $("#lupe").hidden = false;
  fensterKlasse();
}

/* ---------- Kassenbuch: was ist wohin geflossen? ---------- */
const BUCH_FARBE = {verkauf:"#2fbe7e", lohn:"#e0504a", betrieb:"#f08c2e", bau:"#b5703c",
  personal:"#6fb8e0", ausbau:"#f5b73d", wissen:"#8a6ae8", ereignis:"#8a97a3", sonstiges:"#a99a80"};

function kasseFuellen(){
  const w = buchSumme(7), m = buchSumme(30);
  const tage7 = Math.min(7, S.tag), tage30 = Math.min(30, S.tag);
  const ausArten = BUCH_ARTEN.filter(a => a !== "verkauf");
  const ausSumme = o => ausArten.reduce((sum,a) => sum + o[a], 0);
  const saldo7 = w.verkauf - ausSumme(w), saldo30 = m.verkauf - ausSumme(m);

  const zahl = (wert, ein) => {
    const v = Math.round(Math.abs(wert));
    if (v === 0) return `<td style="color:var(--grau)">0</td>`;
    return `<td class="${ein?"ein":"aus"}">${ein?"+":"−"}${v.toLocaleString("de-CH")}</td>`;
  };
  const zeile = (art, name) => (w[art] === 0 && m[art] === 0) ? "" :
    `<tr><td><i class="buchpunkt" style="background:${BUCH_FARBE[art]}"></i>${name}</td>
      ${zahl(w[art], art==="verkauf")}${zahl(m[art], art==="verkauf")}</tr>`;

  // Balken: woran die Ausgaben der letzten 30 Tage hängen
  const gesamtAus = ausSumme(m);
  const balken = gesamtAus > 0 ? `<div class="leiste" style="height:18px;display:flex">${
    ausArten.filter(a => m[a] > 0).map(a =>
      `<i style="width:${(m[a]/gesamtAus*100).toFixed(1)}%;background:${BUCH_FARBE[a]};border-radius:0"
         title="${BUCH_NAME[a]}"></i>`).join("")}</div>` : "";

  const html = `
    <h2>Deine Kasse</h2>
    <div class="unter">Woher das Geld kommt und wohin es geht</div>
    <div class="werte">
      <div class="wert"><span class="wi">${IK.muenze}</span><span class="wt"><small>Kontostand</small>
        <b style="color:${S.kasse<0?"var(--alarm)":"inherit"}">${chf(S.kasse)}</b></span></div>
      <div class="wert"><span class="wi">${IK.kalender}</span><span class="wt"><small>pro Tag (30 T.)</small>
        <b style="color:${saldo30<0?"var(--alarm)":"var(--gruen)"}">${chf(saldo30/Math.max(1,tage30))}</b></span></div>
    </div>

    <div class="karte">
      <h3>Bewegungen</h3>
      <table class="buchtabelle">
        <tr><th>Was</th><th>${tage7} Tage</th><th>${tage30} Tage</th></tr>
        ${zeile("verkauf", BUCH_NAME.verkauf)}
        ${ausArten.map(a => zeile(a, BUCH_NAME[a])).join("")}
        <tr class="summe"><td>Saldo</td>${zahl(saldo7, saldo7>=0)}${zahl(saldo30, saldo30>=0)}</tr>
      </table>
      ${balken ? `<div style="margin-top:14px"><div class="ort">Wofür die Ausgaben der letzten ${tage30} Tage draufgingen</div>${balken}</div>` : ""}
      <div class="notiz">Löhne und Betriebskosten werden immer am Monatsende abgebucht. Deshalb sieht die 7-Tage-Spalte manchmal leer aus – schau dann in die 30-Tage-Spalte.</div>
    </div>

    <div class="karte">
      <h3>Was jeden Monat fällig wird</h3>
      <div class="zeile"><span><b style="font-family:inherit;font-size:inherit">Löhne gesamt</b></span><b>${chf(lohnsumme())}</b></div>
      <div class="zeile"><span style="padding-left:14px;color:var(--grau)">davon Verkaufsteam</span>
        <b style="color:var(--grau)">${chf((S.verkaeufer||0) * VERKAUF_LOHN * perkMult("lohn"))}</b></div>
      <div class="zeile"><span style="padding-left:14px;color:var(--grau)">davon Leute ohne Aufgabe</span>
        <b style="color:var(--grau)">${chf(freieArbeiter() * 200 * perkMult("lohn"))}</b></div>
      <div class="zeile"><span>Betrieb (Werke &amp; Fabriken)</span><b>${chf((Object.keys(S.raff).length*9000 + S.fabriken.length*14000) * perkMult("betrieb"))}</b></div>
      <div class="notiz">Zusammen ${chf(lohnsumme() + (Object.keys(S.raff).length*9000 + S.fabriken.length*14000) * perkMult("betrieb"))} pro Monat. Das wird jeweils am Monatsende abgebucht.</div>
    </div>

    <div class="karte">
      <h3>Seit dem ersten Tag</h3>
      <div class="zeile"><span>Eingenommen</span><b class="ein" style="color:#0f7a4f">${chf(S.eingenommen)}</b></div>
      <div class="zeile"><span>Ausgegeben</span><b style="color:#b8443e">${chf(S.ausgegeben)}</b></div>
      <div class="zeile"><span>Gewinn</span><b>${chf(S.eingenommen - S.ausgegeben)}</b></div>
    </div>`;
  if (html !== kasseStand){ $("#kasseinhalt").innerHTML = html; kasseStand = html; }
  $("#kasse").hidden = false;
  fensterKlasse();
}
let kasseStand = "";

/* ---------- Einstellungen ---------- */
function regler(id, label, hilfe, min, max, step, wert, anzeige){
  const p = ((wert-min)/(max-min)*100).toFixed(1);
  return `<div class="reglerzeile">
    <div class="kopf"><b>${label}</b><span id="w-${id}">${anzeige}</span></div>
    <input class="regler" type="range" data-regler="${id}" id="r-${id}"
      min="${min}" max="${max}" step="${step}" value="${wert}" style="--p:${p}%" aria-label="${label}">
    <small>${hilfe}</small></div>`;
}

    ${regler("ton", "Ton", "Kleine Klänge beim Kaufen, Verkaufen und bei erledigten Aufträgen. Im Klassenzimmer besser auf 0.",
             0, 100, 5, OPT.ton, OPT.ton === 0 ? "aus" : OPT.ton + " %")}
    <div class="karte" style="margin-top:18px">

        `<button data-tun="grad" data-g="${g}" aria-pressed="${(S.grad||"mittel")===g}">

/* ---------- Auswertung am Rundenende ----------
   Nicht nur «geschafft/verfehlt», sondern: Wo hast du gefördert, was
   hast du wo bezahlt, wie ist der Ruf zustande gekommen?            */
function bilanzZeigen(){
  const e = S.ende || {gewinn:S.eingenommen-S.ausgegeben, ruf:Math.round(S.ruf), geschafft:false};
  const gewinn = e.gewinn, ruf = e.ruf;
  const zielGeld = gewinn >= ZIEL_GEWINN, zielRuf = ruf >= ZIEL_RUF;

  // Erze nach Menge
  const erze = Object.keys(S.erzGesamt || {}).filter(k => S.erzGesamt[k] > 1)
    .sort((a,b) => S.erzGesamt[b] - S.erzGesamt[a]);
  const erzGesamtSumme = erze.reduce((a,k) => a + S.erzGesamt[k], 0);

  // Löhne nach Land
  const laender = Object.keys(S.lohnLand || {}).filter(l => S.lohnLand[l] > 1)
    .sort((a,b) => S.lohnLand[b] - S.lohnLand[a]);
  const lohnSummeGesamt = laender.reduce((a,l) => a + S.lohnLand[l], 0);

  // Lohnpolitik
  const stufen = [0,0,0];
  for (const id in S.minen) stufen[S.minen[id].stufe]++;
  const minenZahl = stufen[0] + stufen[1] + stufen[2];

  const perkListe = Object.keys(S.perks || {}).map(id => PERK_INDEX[id]).filter(Boolean);

  $("#bilanzinhalt").innerHTML = `
    <div style="text-align:center;padding:6px 0 2px">
      <div style="width:78px;margin:0 auto;color:${e.geschafft?"var(--gruen)":"var(--warn)"}">
        ${e.geschafft ? IK.schild : IK.ziel}</div>
      <h2 style="padding:0;margin-top:6px">${e.geschafft ? "Ziel erreicht" : "Ziel verfehlt"}</h2>
      <div class="unter" style="margin-bottom:4px">Nach ${Math.min(S.tag, ZIEL_TAGE)} Tagen · ${grad().name}</div>
    </div>

    <div class="karte">
      <h3>Die zwei Ziele</h3>
      <div class="zeile"><span>Gewinn</span><b style="color:${zielGeld?"var(--gruen)":"var(--alarm)"}">${chf(gewinn)}</b></div>
      <div class="leiste"><i style="width:${klemm(gewinn/ZIEL_GEWINN*100,0,100)}%;background:${zielGeld?"var(--gruen)":"var(--gold)"}"></i></div>
      <div class="ort">Ziel ${chf(ZIEL_GEWINN)}</div>
      <div class="zeile" style="margin-top:10px"><span>Ruf</span><b style="color:${zielRuf?"var(--gruen)":"var(--alarm)"}">${ruf}</b></div>
      <div class="leiste"><i style="width:${klemm(ruf/ZIEL_RUF*100,0,100)}%;background:${zielRuf?"var(--gruen)":"var(--warn)"}"></i></div>
      <div class="ort">Ziel ${ZIEL_RUF}</div>
      <div class="notiz ${e.geschafft?"gruen":""}">${
        e.geschafft ? "Geld verdient <b>und</b> den Ruf gehalten. Beides zusammen ist der schwierige Teil."
        : zielGeld ? "Der Gewinn stimmt, aber der Ruf nicht. Tiefe Löhne haben sich kurzfristig gelohnt und langfristig gerächt."
        : zielRuf ? "Der Ruf stimmt, das Geld nicht. Wo ist die Kette gerissen – zu wenig Erz, zu wenig Raffination oder zu wenig Verkauf?"
        : "Weder das eine noch das andere. Schau in der Auswertung, wo am meisten Geld hingegangen ist."}</div>
    </div>

    ${erze.length ? `<div class="karte">
      <h3>Was du aus der Erde geholt hast</h3>
      <div class="ort">Insgesamt ${Math.round(erzGesamtSumme).toLocaleString("de-CH")} Einheiten Roherz</div>
      ${erze.map(k => `<div class="zeile">
        <span><i class="punkt" style="background:${MATERIAL[k].farbe}"></i> ${MATERIAL[k].name}</span>
        <b>${Math.round(S.erzGesamt[k]).toLocaleString("de-CH")}</b></div>`).join("")}
      <div class="notiz">${erze.length >= 8
        ? "Du hast fast das ganze Periodensystem eines Smartphones angefasst."
        : "In einem Smartphone stecken zehn davon. Wie viele hast du gefördert?"}</div>
    </div>` : ""}

    ${laender.length ? `<div class="karte">
      <h3>Wo dein Lohn hingegangen ist</h3>
      <div class="ort">Insgesamt ${chf(lohnSummeGesamt)} an Löhnen</div>
      ${laender.map(l => `<div class="zeile">
        <span class="flz">${flagge(l)}<span>${LAND[l].name}</span></span>
        <b>${chf(S.lohnLand[l])} <small style="color:var(--grau);font-weight:600">${Math.round(S.lohnLand[l]/lohnSummeGesamt*100)} %</small></b></div>`).join("")}
      <div class="notiz">Vergleich das mit der Menge Erz von dort. Wo viel gefördert wurde, floss nicht unbedingt viel Lohn.</div>
    </div>` : ""}

    ${minenZahl ? `<div class="karte">
      <h3>Wie du bezahlt hast</h3>
      ${LOHNSTUFE.map((st,i) => `<div class="zeile"><span>${st.label} – ${st.name}</span>
        <b>${stufen[i]} ${stufen[i]===1?"Mine":"Minen"}</b></div>`).join("")}
      <div class="notiz">${stufen[0] > stufen[2]
        ? "Du hast überwiegend unter dem üblichen Lohn gezahlt. Das war billig – und hat den Ruf gekostet."
        : stufen[2] > 0 ? "Du hast an mindestens einem Ort deutlich über dem üblichen Lohn gezahlt."
        : "Du bist beim landesüblichen Lohn geblieben."}</div>
    </div>` : ""}

    <div class="karte">
      <h3>Dein Betrieb am Schluss</h3>
      <div class="zeile"><span>Minen</span><b>${Object.keys(S.minen).length}</b></div>
      <div class="zeile"><span>Raffinerien</span><b>${Object.keys(S.raff).length}</b></div>
      <div class="zeile"><span>Fabriken</span><b>${S.fabriken.length}</b></div>
      <div class="zeile"><span>Mitarbeitende</span><b>${S.arbeiterGesamt}</b></div>
      <div class="zeile"><span>Erledigte Aufträge</span><b>${Math.min(S.auftrag||0, AUFTRAEGE.length)} von ${AUFTRAEGE.length}</b></div>
      <div class="zeile"><span>Erforschtes Wissen</span><b>${perkListe.length} von ${WISSEN.reduce((a,x)=>a+x.perks.length,0)}</b></div>
    </div>

    <div class="karte">
      <h3>Zum Nachdenken</h3>
      <div class="fakt"><span class="nr">1</span><span>Welche Entscheidung hat am meisten Geld gebracht – und welche am meisten Ruf?</span></div>
      <div class="fakt"><span class="nr">2</span><span>Du hast Löhne in ${laender.length || "mehreren"} Ländern gezahlt. Warum sind die Unterschiede so gross?</span></div>
      <div class="fakt"><span class="nr">3</span><span>Was würdest du im echten Leben anders machen als hier im Spiel?</span></div>
    </div>

    <button class="cta" data-tun="neuerunde">${IK.pfeil}Neue Runde starten</button>
    <button class="cta still" data-schliessen="bilanz">Auswertung schliessen</button>`;
  $("#bilanz").hidden = false;
  fensterKlasse();
}

/* ---------- Schwierigkeit wählen ---------- */
function gradWaehlen(beimStart){
  dialogZeigen({
    art: "Schwierigkeit",
    titel: beimStart ? "Wie schwer soll es sein?" : "Schwierigkeit ändern",
    text: beimStart
      ? "Du übernimmst eine Rohstofffirma. Wähle, wie streng gerechnet wird – du kannst das später in den Einstellungen ändern."
      : "Die Änderung gilt ab sofort für alle Verkäufe. Das Startkapital bleibt, wie es ist.",
    wahlen: Object.keys(GRADE).map(g => ({
      text: GRADE[g].name,
      klein: GRADE[g].text + (beimStart ? ` · Startkapital ${chf(GRADE[g].start)}` : ""),
      tun(){
        S.grad = g;
        if (beimStart){ S.kasse = GRADE[g].start; }
        notiz(`Schwierigkeit: <b>${GRADE[g].name}</b>.`, "gut");
      }
    }))
  });
}

/* ---------- Ereignisdialog ---------- */
function dialogZeigen(e){
  modalOffen = true;
  $("#d-art").textContent = e.art || "Ereignis";
  $("#d-titel").innerHTML = (e.land ? `<span class="flz">${flagge(e.land,"gross")}<span>${e.titel||""}</span></span>` : (e.titel || ""));
  $("#d-text").innerHTML = e.text || "";
  $("#d-wahlen").innerHTML = "";
  e.wahlen.forEach((w,i) => {
    const b = document.createElement("button");
    b.className = "wahl";
    b.innerHTML = `<b>${w.text}</b><small>${w.klein||""}</small>`;
    b.onclick = () => { w.tun(); S.ruf = klemm(S.ruf,0,100);
      modalOffen = false; $("#schleier").hidden = true; speichern(); zeichnen(); };
    $("#d-wahlen").appendChild(b);
    if (!i) setTimeout(()=>b.focus(), 60);
  });
  $("#schleier").hidden = false;
  if (e.wahlen && e.wahlen.length > 1) klang("warnung");
  zeichnen();
}

/* ---------- Menüs schliessen ---------- */
function ueberlageZu(welche){
  $("#" + welche).hidden = true;
  if (welche === "lupe") offeneLupe = null;
  if (welche === "kasse") kasseStand = "";
  zeichnen();
}
/* ESC / rotes X: immer das oberste offene Menü schliessen */
function obersteSchliessen(){
  if (!$("#bilanz").hidden){ ueberlageZu("bilanz"); return true; }
  if (!$("#kasse").hidden){ ueberlageZu("kasse"); return true; }
  if (!$("#lupe").hidden){ ueberlageZu("lupe"); return true; }
  if (!$("#einst").hidden){ ueberlageZu("einst"); return true; }
  if (offenesBlatt){ blattZu(); zeichnen(); return true; }
  if (aktiveSeite !== "karte"){ seiteWechseln("karte"); return true; }
  return false;
}

/* ---------- Steuerung ---------- */
document.addEventListener("click", e => {
  const sch = e.target.closest("[data-schliessen]");
  if (sch){ const w = sch.dataset.schliessen;
    if (w === "seite") seiteWechseln("karte"); else ueberlageZu(w);
    return; }
  if (e.target.id === "zu" || e.target.closest("#zu") || e.target.id === "blattschleier"){ blattZu(); zeichnen(); return; }
  if (e.target.closest(".ueberlage") && !e.target.closest(".tafel")){
    ueberlageZu(e.target.closest(".ueberlage").id); return; }

  const pin = e.target.closest(".pin");
  if (pin){ blattFuellen(pin.dataset.pin, pin.dataset.id); return; }

  const eb = e.target.closest("[data-ebene]");
  if (eb){ const k = eb.dataset.ebene; ebenen[k] = !ebenen[k];
    eb.setAttribute("aria-pressed", ebenen[k]); pinsZeichnen(); return; }

  const zo = e.target.closest("[data-zoom]");
  if (zo){ zoomUm(+zo.dataset.zoom > 0 ? 1.5 : 1/1.5); return; }

  const tm = e.target.closest("[data-tempo]");
  if (tm){ tempoSetzen(+tm.dataset.tempo); return; }

  const sb = e.target.closest("[data-seite]");
  if (sb){ seiteWechseln(sb.dataset.seite); return; }

  const t = e.target.closest("[data-tun]");
  if (!t){ if (!e.target.closest("#blatt") && !e.target.closest("#seite") && !e.target.closest(".ueberlage")
             && !e.target.closest("#dock") && !e.target.closest("#hud")){ blattZu(); zeichnen(); } return; }
  const id = t.dataset.id, n = +t.dataset.n;

  switch (t.dataset.tun){
    case "mine-auf": {
      const def = MINEN.find(x=>x.id===id);
      if (S.kasse < def.erschliessung || gesperrt("mine", id)) return;
      zahlen(def.erschliessung, "bau");
      S.minen[id] = {arbeiter:0, stufe:1, zufriedenheit:55, stillBis:0, malus:1, malusBis:0, ausbau:0};
      notiz(`Mine <b>${def.ort}</b> eröffnet. Jetzt Leute hinschicken.`, "gut");
      zeigeAuf(id); pinFeiern(id);
      const [fx,fy] = pinAufSchirm(id);
      funken(fx, fy, [MATERIAL[def.mat].farbe, "#f5b73d", "#fff", "#ffe9a8"], 24); klang("kauf");
      break; }
    case "crew": {
      const def = MINEN.find(x=>x.id===id), m = S.minen[id];
      const vorher = m.arbeiter;
      m.arbeiter = Math.max(0, Math.min(def.plaetze, m.arbeiter + Math.min(n, n>0?freieArbeiter():n)));
      if (m.arbeiter > vorher) funkenAn(t, ["#6fb8e0","#fff","#f5b73d"], 8);
      break; }
    case "lohn": {
      const neu = +t.dataset.stufe, m = S.minen[id];
      if (neu === m.stufe) return;
      if (neu < m.stufe && m.zufriedenheit > 70) m.zufriedenheit -= 12;
      if (neu > m.stufe){
        funkenAn(t, ["#f5b73d","#ffe9a8","#2fbe7e"], 18); klang("muenze");
        m.zufriedenheit = Math.min(100, m.zufriedenheit + 6);
        notiz(`Lohnstufe in <b>${MINEN.find(x=>x.id===id).ort}</b> auf «${LOHNSTUFE[neu].label}» erhöht.`, "gut");
      }
      m.stufe = neu; break; }
    case "raff-bau": {
      const def = RAFF_ORTE.find(x=>x.id===id);
      if (S.kasse < def.bau || gesperrt("raff")) return;
      zahlen(def.bau, "bau"); S.raff[id] = {arbeiter:0, ausbau:0};
      notiz(`Raffinerie <b>${def.ort}</b> gebaut.`, "gut");
      zeigeAuf(id); pinFeiern(id);
      const [fx,fy] = pinAufSchirm(id); funken(fx, fy, ["#5b8f7a","#cfe8dd","#fff"], 22); klang("kauf");
      break; }
    case "rcrew": {
      const def = RAFF_ORTE.find(x=>x.id===id), r = S.raff[id];
      const vorher = r.arbeiter;
      r.arbeiter = Math.max(0, Math.min(def.plaetze, r.arbeiter + Math.min(n, n>0?freieArbeiter():n)));
      if (r.arbeiter > vorher) funkenAn(t, ["#5b8f7a","#fff"], 8);
      break; }
    case "fab-bau": {
      const p = t.dataset.p, l = t.dataset.l, def = PRODUKT[p];
      if (S.kasse < def.kosten || gesperrt("fab")) return;
      zahlen(def.kosten, "bau");
      const tage = Math.max(3, Math.round(def.bauzeit * perkMult("bauzeit")));
      S.fabriken.push({produkt:p, land:l, arbeiter:0, restbau:tage, ausbau:0});
      notiz(`Fabrik für <b>${def.name}</b> in ${fabOrt(l)} – fertig in ${tage} Tagen.`, "geld");
      pinFeiern("f_"+l);
      const [fx,fy] = pinAufSchirm("f_"+l); funken(fx, fy, ["#b5703c","#f5b73d","#fff"], 22); klang("kauf");
      break; }
    case "fcrew": {
      const i = +t.dataset.i, f = S.fabriken[i], def = PRODUKT[f.produkt];
      const vorher = f.arbeiter;
      f.arbeiter = Math.max(0, Math.min(def.plaetze, f.arbeiter + Math.min(n, n>0?freieArbeiter():n)));
      if (f.arbeiter > vorher) funkenAn(t, ["#b5703c","#fff"], 8);
      break; }
    case "anstellen": {
      const menge = anstellbar(), kosten = menge * LOHN_PRO_KOPF;
      if (menge <= 0 || S.kasse < kosten) return;
      zahlen(kosten, "personal"); S.arbeiterGesamt += menge;
      notiz(`<b>${menge} Leute</b> angestellt für ${chf(kosten)}.`, "geld");
      funkenAn(t, ["#6fb8e0","#f5b73d","#fff","#2fbe7e"], 26); klang("kauf");
      break; }
    case "entlassen":
      if (freieArbeiter() >= 5){ S.arbeiterGesamt -= 5; notiz("5 Leute entlassen.", "warn"); } break;
    case "handverkauf": {
      if (S.handverkaufTag === S.tag) return;
      const erg = wareVerkaufen(1e9);
      if (erg.stueck <= 0) return;
      S.handverkaufTag = S.tag; S.verkauftSelber = true;
      notiz(`Selber verkauft: <b>${erg.stueck} Stück</b> für ${chf(erg.erloes)}.`, "geld");
      funkenAn(t, ["#f5b73d","#ffe9a8","#2fbe7e","#fff"], 26); klang("muenze");
      break; }
    case "vcrew": {
      const vorher = S.verkaeufer || 0;
      S.verkaeufer = Math.max(0, Math.min(VERKAUF_PLAETZE, vorher + Math.min(n, n>0?freieArbeiter():n)));
      if (S.verkaeufer > vorher) funkenAn(t, ["#f5b73d","#6fb8e0","#fff"], 10);
      break; }
    case "einst":
      einstFuellen(); return;
    case "kassebuch":
      kasseFuellen(); return;
    case "bilanz":
      bilanzZeigen(); return;
    case "neuerunde":
      $("#bilanz").hidden = true; zuruecksetzen(); return;
    case "schliessen": {
      const art = t.dataset.art;
      const i = t.dataset.i != null ? +t.dataset.i : null;
      const ziel = art === "mine" ? S.minen[id] : art === "raff" ? S.raff[id] : S.fabriken[i];
      if (!ziel) return;
      const grund = art === "mine" ? MINEN.find(x=>x.id===id).erschliessung
                  : art === "raff" ? RAFF_ORTE.find(x=>x.id===id).bau
                  : PRODUKT[ziel.produkt].kosten;
      const name = art === "mine" ? "Mine " + MINEN.find(x=>x.id===id).ort
                 : art === "raff" ? "Raffinerie " + RAFF_ORTE.find(x=>x.id===id).ort
                 : "Fabrik " + PRODUKT[ziel.produkt].name + " in " + fabOrt(ziel.land);
      const zurueck = Math.round((grund + ausbauInvestiert(grund, ziel.ausbau)) * RUECK_ANTEIL);
      if (!confirm(`${name} wirklich schliessen?\n\nDu bekommst ${chf(zurueck)} zurück, ${ziel.arbeiter} Leute gehen ins Team.`)) return;
      S.kasse += zurueck; S.eingenommen += zurueck; buchen("verkauf", 0);
      if (ziel.arbeiter > 0) rufAendern(-4);
      if (art === "mine") delete S.minen[id];
      else if (art === "raff") delete S.raff[id];
      else S.fabriken.splice(i, 1);
      notiz(`<b>${name}</b> geschlossen. ${chf(zurueck)} zurück${ziel.arbeiter?`, ${ziel.arbeiter} Leute wieder frei`:""}.`, "warn");
      klang("warnung");
      blattZu();
      break; }
    case "grad": {
      S.grad = t.dataset.g;
      notiz(`Schwierigkeit: <b>${grad().name}</b>.`, "gut");
      speichern(); einstFuellen(); zeichnen(); return; }
    case "zumteam":
      seiteWechseln("team"); return;
    case "ausbau": {
      const art = t.dataset.art;
      const ziel = art === "mine" ? S.minen[id]
                 : art === "raff" ? S.raff[id]
                 : S.fabriken[+t.dataset.i];
      if (!ziel || (ziel.ausbau||0) >= AUSBAU_MAX) return;
      const grund = art === "mine" ? MINEN.find(x=>x.id===id).erschliessung
                  : art === "raff" ? RAFF_ORTE.find(x=>x.id===id).bau
                  : PRODUKT[ziel.produkt].kosten;
      const kosten = ausbauKosten(grund, ziel.ausbau||0);
      if (S.kasse < kosten) return;
      const verdoppelt = ausbauVerdoppelt(ziel.ausbau||0);
      zahlen(kosten, "ausbau");
      ziel.ausbau = (ziel.ausbau||0) + 1;
      frischeStufe[id] = Date.now();
      const ort = art === "mine" ? MINEN.find(x=>x.id===id).ort
                : art === "raff" ? RAFF_ORTE.find(x=>x.id===id).ort
                : PRODUKT[ziel.produkt].name;
      notiz(verdoppelt
        ? `<b>${ort}</b> auf Stufe ${ziel.ausbau} ausgebaut – die Ausbringung ist jetzt <b>doppelt</b> so hoch.`
        : `<b>${ort}</b> auf Stufe ${ziel.ausbau} ausgebaut.`, verdoppelt ? "gut" : "geld");
      funkenAn(t, verdoppelt ? ["#2fbe7e","#82e2b4","#f5b73d","#fff"] : ["#f5b73d","#ffe9a8","#fff"],
        verdoppelt ? 40 : 16);
      klang(verdoppelt ? "verdopplung" : "kauf");
      break; }
    case "segment":
      lupeFuellen(t.dataset.s); return;
    case "perk": {
      const e2 = PERK_INDEX[t.dataset.p];
      if (!e2 || S.perks[e2.perk.id]) return;
      const i = e2.seg.perks.indexOf(e2.perk);
      if (i > 0 && !S.perks[e2.seg.perks[i-1].id]) return;
      if (S.kasse < e2.perk.kosten) return;
      zahlen(e2.perk.kosten, "wissen");
      S.perks[e2.perk.id] = true;
      if (e2.perk.sofort && e2.perk.sofort.ruf) rufAendern(e2.perk.sofort.ruf);
      notiz(`Neues Wissen: <b>${e2.perk.titel}</b> · ${e2.perk.wirkung.join(" · ")}`, "gut");
      funkenAn(t, ["#f5b73d","#2fbe7e","#ffe9a8","#fff"], 28); klang("erfolg");
      auftragPruefen(); speichern(); seitenStand = ""; lupeFuellen(e2.seg.id); zeichnen();
      return; }
    case "reset":
      if (confirm("Neue Runde starten? Der bisherige Verlauf geht verloren.")){
        $("#einst").hidden = true; zuruecksetzen(); }
      return;
  }
  tutorialPruefen(); auftragPruefen(); speichern(); seitenStand = ""; zeichnen();
});

/* ---------- Regler ---------- */
document.addEventListener("input", e => {
  const r = e.target.closest("[data-regler]");
  if (!r) return;
  reglerAktiv = true;
  const wert = +r.value, min = +r.min, max = +r.max;
  r.style.setProperty("--p", ((wert-min)/(max-min)*100).toFixed(1) + "%");
  const anzeige = $("#w-" + r.dataset.regler);
  switch (r.dataset.regler){
    case "schrift": OPT.schrift = wert; if (anzeige) anzeige.textContent = wert + " %"; optAnwenden(); optSpeichern(); break;
    case "tempo":   OPT.tempo = wert;   if (anzeige) anzeige.textContent = wert + " %"; optAnwenden(); optSpeichern(); break;
    case "anim":    OPT.anim = wert;    if (anzeige) anzeige.textContent = ANIM_NAME[wert]; optAnwenden(); optSpeichern(); break;
    case "ton":     OPT.ton = wert;     if (anzeige) anzeige.textContent = wert === 0 ? "aus" : wert + " %";
                    optSpeichern(); if (wert > 0) klang("klick"); break;
    case "anstell": anstellMenge = wert; if (anzeige) anzeige.textContent = wert + " Leute";
      { const knopf = document.querySelector('[data-tun="anstellen"]');
        const menge = anstellbar(), kosten = menge * LOHN_PRO_KOPF, geht = menge > 0 && S.kasse >= kosten;
        if (knopf){ knopf.disabled = !geht;
          knopf.innerHTML = (geht?IK.person:"") + (menge <= 0 ? "Im Tutorial genügen " + TUTORIAL_MAX_LEUTE + " Leute"
            : geht ? "STELL " + menge + " LEUTE AN · " + chf(kosten) : "Zu wenig Geld · " + chf(kosten)); } }
      break;
  }
});
document.addEventListener("change", e => {
  if (e.target.closest("[data-regler]")) setTimeout(()=>{ reglerAktiv = false; }, 400);
});
document.addEventListener("pointerup", () => { if (reglerAktiv) setTimeout(()=>{ reglerAktiv = false; }, 400); });

document.addEventListener("keydown", e => {
  if (e.code === "Space" && !modalOffen && e.target === document.body){
    e.preventDefault(); tempoSetzen(tempo > 0 ? 0 : 1); }
  if (e.key === "Escape"){ e.preventDefault(); obersteSchliessen(); }
});

/* ---------- Uhr ---------- */
function tempoSetzen(v){
  tempo = v;
  document.querySelectorAll("[data-tempo]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.tempo === v));
  if (takt) clearInterval(takt);
  if (v > 0){
    const ms = Math.max(120, 1400 / v * (100 / OPT.tempo));
    takt = setInterval(() => { tagVor(); tutorialPruefen(); auftragPruefen(); zeichnen(); }, ms);
  }
}

/* ---------- Speichern ---------- */
function speichern(){ try { SPEICHER.schreib(SCHLUESSEL, JSON.stringify(S)); } catch(e){} }
function laden(){
  try { const roh = SPEICHER.lies(SCHLUESSEL) || SPEICHER.lies("erzwelt_v1");
    if (!roh) return false;
    const g = JSON.parse(roh); if (!g || typeof g.tag !== "number") return false;
    S = Object.assign(neuerZustand(), g);
    if (!S.perks || typeof S.perks !== "object") S.perks = {};
    // Ältere Spielstände kennen den Verkauf noch nicht: Wer schon eine
    // Fabrik hat, bekommt ein kleines Verkaufsteam, damit nichts stillsteht.
    if (g.verkaeufer === undefined){
      S.verkaeufer = S.fabriken.length ? 3 : 0;
      if (S.verkaeufer) notiz("Neu: Ware verkauft sich nicht mehr von allein. Du hast ein kleines Verkaufsteam bekommen – im Markt kannst du es vergrössern.", "warn");
    }
    return true;
  } catch(e){ return false; }
}
window.addEventListener("pagehide", () => { if (S) speichern(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && S) speichern(); });

function zuruecksetzen(){
  SPEICHER.loesch(SCHLUESSEL); SPEICHER.loesch("erzwelt_v1"); S = neuerZustand();
  modalOffen = false; $("#schleier").hidden = true; $("#lupe").hidden = true;
  blattZu(); seiteWechseln("karte");
  notiz("Neue Runde. Tippe auf einen Pin und eröffne deine erste Mine.", "gut");
  tempoSetzen(1); zeigeAuf("obuasi", 1.15); zeichnen();
  setTimeout(() => gradWaehlen(true), 300);
}

/* ---------- Start ---------- */
optLaden();
optAnwenden();
$("#einstauf").innerHTML = IK.zahnrad;
$("#zu").innerHTML = IK.x;
document.querySelectorAll("[data-schliessen]").forEach(b => b.innerHTML = IK.x);
$("#seitenkopf .seitenknopf").innerHTML = IK.zahnrad;
$("#h-kasse-i").innerHTML = IK.muenze;
$("#h-crew-i").innerHTML = IK.person;
$("#h-tag-i").innerHTML = IK.kalender;
weltZeichnen();
let frischGestartet = false;
if (!laden()){ S = neuerZustand(); frischGestartet = true;
  notiz("Willkommen in der Erzwelt. Tippe auf einen Pin, um eine Mine zu eröffnen.", "gut"); }
letzterTagGezeigt = S.tag;
ansicht.z = 1.15; zeigeAuf("obuasi", 1.15);
dockZeichnen();
tempoSetzen(1);
zeichnen();
if (frischGestartet) setTimeout(() => gradWaehlen(true), 400);
masseMessen();
setTimeout(masseMessen, 300);
window.addEventListener("load", masseMessen);
</script>
